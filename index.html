<style>
@font-face { font-family: "Osifont"; src: url("fonts/osifont-lgpl3fe.woff") format("woff"); font-display: swap; }
:root {
  --paper: #f2eee4;
  --paper-2: #e9e3d6;
  --ink: #1c1d1f;
  --ink-2: #4f5054;
  --ink-3: #6b6862;
  --grid: rgba(28, 29, 31, .05);
  --grid-major: rgba(28, 29, 31, .085);
  --signal: #c23f26;
  --node-fill: rgba(247, 244, 236, .94);
  --shadow: rgba(60, 45, 20, .16);
  --lit: rgba(194, 63, 38, .07);
  --cond: "IBM Plex Sans Condensed", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", "PingFang SC", ui-monospace, monospace;
  /* ISO 3098 drawing lettering for title block, zones and dimensions; CJK falls back to the sans */
  --iso: "Osifont", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", var(--cond);
  --serif: "Newsreader", "Songti SC", "Noto Serif SC", Georgia, serif;
  --u: 1px;
  color-scheme: light;
}
:root[data-theme="blueprint"] {
  --paper: #0f2a45;
  --paper-2: #123251;
  --ink: #e4ecf4;
  --ink-2: #b7c7d7;
  --ink-3: #8fa6bf;
  --grid: rgba(228, 236, 244, .055);
  --grid-major: rgba(228, 236, 244, .1);
  --signal: #ff8a5c;
  --node-fill: rgba(18, 48, 77, .94);
  --shadow: rgba(0, 0, 0, .35);
  --lit: rgba(255, 138, 92, .1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--cond);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; }

/* ---------- sheet ---------- */
.frame { height: 100vh; height: 100dvh; padding: 14px; }
.stage { position: relative; width: 100%; height: 100%; }
#paper { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: hidden; }
.stage svg.tall { display: none; }

.overlay { position: absolute; transition: opacity .35s ease; z-index: 2; }
.panel-open .overlay { opacity: 0; pointer-events: none; }

.ident { left: calc(64 * var(--u)); top: calc(42 * var(--u)); }
.ident h1 {
  margin: 0;
  font-size: calc(48 * var(--u));
  font-weight: 600;
  letter-spacing: .08em;
  line-height: 1;
  text-transform: uppercase;
}
.ident p { margin: calc(8 * var(--u)) 0 0; font-size: calc(21 * var(--u)); font-weight: 500; }
.ident-ctl { display: flex; flex-wrap: wrap; gap: 6px 1.4em; margin-top: calc(16 * var(--u)); font-size: max(11px, calc(13.5 * var(--u))); }

.titleblock {
  right: calc(48 * var(--u)); bottom: calc(48 * var(--u));
  width: calc(540 * var(--u));
  font-size: max(11px, calc(13.5 * var(--u)));
  border: 1.5px solid var(--ink);
  background: var(--paper);
  display: grid;
  grid-template-columns: repeat(12, 1fr);
}
.tb-cell { grid-column: span 4; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: .45em .7em .5em; min-width: 0; }
.tb-cell.end { border-right: 0; }
.tb-label { display: block; font-family: var(--iso); font-size: max(10px, .72em); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: .2em; }
.tb-mono { font-family: var(--iso); font-size: 1.05em; }
.tb-num { grid-column: span 3; }
.tb-num strong { display: block; font-family: var(--mono); font-weight: 500; font-size: 1.22em; color: var(--signal); white-space: nowrap; }
.tb-num span { font-size: max(10.5px, .78em); color: var(--ink-2); line-height: 1.25; display: block; margin-top: .15em; }
.tb-links { grid-column: span 12; display: flex; padding: 0; border-right: 0; }
.tb-links a {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  min-height: max(44px, 2.6em);
  text-decoration: none;
  font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: max(11px, .9em);
  border-right: 1px solid var(--ink);
}
.tb-links a:last-child { border-right: 0; }
.tb-links a:hover, .tb-links a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.tb-controls {
  grid-column: span 12; border: 0;
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px 1.4em; padding: 8px .7em;
}
.ctl { display: flex; align-items: center; gap: .5em; }
.seg-label { font-size: max(11px, .72em); letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.seg { display: flex; align-items: center; border: 1px solid var(--ink); }
.seg button {
  position: relative;
  height: max(32px, 2.2em); min-width: 4.4em; padding: 0 .7em;
  border: 0; background: none; cursor: pointer;
  font-size: max(11px, .82em); letter-spacing: .1em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center;
}
.seg button + button { border-left: 1px solid var(--ink); }
.seg button::after { content: ""; position: absolute; inset: -3px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.revisions {
  right: calc(48 * var(--u)); top: calc(42 * var(--u));
  width: calc(480 * var(--u));
  font-size: max(11px, calc(12.5 * var(--u)));
  border: 1.5px solid var(--ink);
  background: var(--paper);
  border-collapse: collapse;
}
.revisions caption { font-family: var(--iso); text-align: left; font-size: max(10px, .78em); letter-spacing: .14em; color: var(--ink-3); padding: 0 0 .3em; caption-side: top; text-transform: uppercase; }
.revisions th, .revisions td { border: 1px solid var(--ink); padding: .3em .55em; text-align: left; font-weight: 400; vertical-align: top; }
.revisions th { font-family: var(--iso); font-size: max(10px, .76em); letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.revisions td:nth-child(1), .revisions td:nth-child(2) { font-family: var(--iso); white-space: nowrap; }
.revisions tr.cur td:first-child { color: var(--signal); font-weight: 500; }
/* language corner: the sheet's bottom-left corner lifts on hover; a click turns the page */
.curl {
  position: fixed; left: 0; bottom: 0; z-index: 6; width: 58px; height: 58px; padding: 0; border: 0; background: none; cursor: pointer;
  transition: width .55s cubic-bezier(.2, .8, .2, 1), height .55s cubic-bezier(.2, .8, .2, 1), opacity .4s ease;
  animation: curl-breathe 7s ease-in-out 5s infinite; -webkit-tap-highlight-color: transparent;
}
.curl:hover, .curl:focus-visible { width: 172px; height: 172px; outline: none; animation: none; }
.curl.turning { opacity: 0; transition: none; }
.curl-under { position: absolute; inset: 0; clip-path: polygon(0 0, 0 100%, 100% 100%); background: linear-gradient(to top right, var(--paper) 0 30%, color-mix(in srgb, var(--ink) 22%, var(--paper)) 50%); }
.curl-flap { position: absolute; inset: 0; filter: drop-shadow(2px -2px 2px var(--shadow)) drop-shadow(6px -6px 10px var(--shadow)); }
.curl-flap::before {
  content: ""; position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 100% 100%);
  background: linear-gradient(to top right, color-mix(in srgb, var(--ink) 18%, var(--paper-2)) 50%, var(--paper) 63%, var(--paper-2) 100%);
}
.curl-label { position: absolute; left: 6px; bottom: 6px; text-align: left; color: var(--signal); font-family: var(--cond); font-weight: 600; font-size: 11px; letter-spacing: .06em; line-height: 1; transition: font-size .5s cubic-bezier(.2, .8, .2, 1), left .5s ease, bottom .5s ease; }
.curl-label small { display: block; font-family: var(--cond); font-weight: 600; font-size: 15px; letter-spacing: .08em; color: var(--signal); letter-spacing: 0; color: var(--ink-3); margin-top: 6px; white-space: nowrap; opacity: 0; transform: translateY(4px); transition: opacity .3s ease .15s, transform .3s ease .15s; }
.curl:hover .curl-label, .curl:focus-visible .curl-label { left: 11px; bottom: 10px; }
.curl-label svg { display: block; width: 20px; height: 20px; fill: var(--signal); transition: width .5s cubic-bezier(.2, .8, .2, 1), height .5s cubic-bezier(.2, .8, .2, 1); }
.curl:hover .curl-label svg, .curl:focus-visible .curl-label svg { width: 46px; height: 46px; }
.curl:hover .curl-label small, .curl:focus-visible .curl-label small { opacity: 1; transform: none; }
.curl:focus-visible .curl-flap::before { outline: 2px solid var(--signal); }
@keyframes curl-breathe { 0%, 88%, 100% { width: 58px; height: 58px; } 93% { width: 78px; height: 78px; } }
#page-flap { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 30; view-transition-name: page-flap; }
#page-flap .pf-back { filter: drop-shadow(-5px 7px 9px rgba(0, 0, 0, .28)); }
html.vt-turn::view-transition-old(root) { clip-path: var(--peel); z-index: 1; }
html.vt-turn::view-transition-new(root) { z-index: 0; }
::view-transition-group(page-flap), ::view-transition-new(page-flap) { animation: none; }

/* magnifier */
.loupe { opacity: 0; transition: opacity .18s ease; pointer-events: none; }
.loupe.on { opacity: 1; filter: drop-shadow(0 14px 22px var(--shadow)); }
.loupe-bg { fill: var(--paper); }
.loupe-ring { fill: none; stroke: var(--ink); stroke-width: 2.2; }
.loupe-ring2 { fill: none; stroke: var(--signal); stroke-width: .8; }
.loupe-tick { stroke: var(--ink); stroke-width: 1; }
.loupe-read { fill: var(--signal); font-family: var(--mono); font-size: 11px; text-anchor: middle; }
.stage.magnifying { cursor: none; }

/* exploded view */
@property --ax { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --az { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --sway { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --sc { syntax: '<number>'; inherits: true; initial-value: 1; }
@property --tx { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --ty { syntax: '<length>'; inherits: true; initial-value: 0px; }
.node.exploded { opacity: 0 !important; }
.explode { position: absolute; inset: 0; z-index: 3; pointer-events: none; transition: opacity .35s ease; }
.explode.gone { opacity: 0; }
.ex-scene { position: absolute; inset: 0; perspective: 1900px; }
.ex-iso {
  position: absolute; transform-style: preserve-3d; --px: 0deg; --pz: 0deg;
  transform: translate(var(--tx), var(--ty)) rotateX(calc(var(--ax) + var(--px))) rotateZ(calc(var(--az) + var(--sway) + var(--pz))) scale(var(--sc));
  transition: --ax 1.15s cubic-bezier(.7, 0, .2, 1), --az 1.15s cubic-bezier(.7, 0, .2, 1), --sc 1.15s cubic-bezier(.7, 0, .2, 1), --tx 1.15s cubic-bezier(.7, 0, .2, 1), --ty 1.15s cubic-bezier(.7, 0, .2, 1);
}
.explode.open .ex-iso { --ax: 57deg; --az: -36deg; --sc: var(--k); --tx: var(--dx); --ty: var(--dy); animation: sway 11s ease-in-out 1.4s infinite alternate; }
@keyframes sway { from { --sway: 0deg; } to { --sway: 10deg; } }
.plate { position: absolute; inset: 0; transform-style: preserve-3d; transform: translateZ(0); transition: transform 1.1s cubic-bezier(.2, .85, .25, 1) calc(.45s + var(--i) * 90ms); }
.explode.open .plate { transform: translateZ(calc(var(--i) * var(--gap))); }
.plate::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--ink-2); transform-origin: bottom center; transform: rotateX(90deg); }
.plate::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 10px; background: var(--ink); transform-origin: right center; transform: rotateY(-90deg); }
.pl-face { position: absolute; inset: 0; border: 1.5px solid var(--ink); background: var(--node-fill); }
.pl-face::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, transparent 0 9px, var(--grid-major) 9px 10px); }
.pl-face::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 10px; background: var(--ink-2); transform-origin: left center; transform: rotateY(90deg); }
.pl-no { position: absolute; left: 14px; top: 10px; font-family: var(--mono); font-size: 14px; color: var(--signal); }
.pl-text { display: none; }
.pl-anchor { position: absolute; left: 0; top: 50%; width: 1px; height: 1px; }
.ex-labels { position: absolute; inset: 0; pointer-events: none; }
.ex-label {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  font-family: var(--mono); font-size: 13px; padding: 5px 9px; background: var(--paper); border: 1px solid var(--ink); color: var(--ink);
  opacity: 0; transition: opacity .4s ease calc(1.3s + var(--i) * 90ms);
}
.ex-label::after { content: ""; position: absolute; left: 100%; top: 50%; width: var(--lead, 28px); border-top: 1px solid var(--ink); }
.explode.open .ex-label { opacity: 1; }
.ex-axis { position: absolute; left: 50%; top: 50%; width: 0; border-left: 1px dashed var(--signal); transform-origin: top center; transform: rotateX(90deg); opacity: 0; transition: opacity .4s ease 1.1s; }
.explode.open .ex-axis { opacity: .9; }
.ex-caption { position: absolute; left: calc(64 * var(--u)); bottom: calc(52 * var(--u)); font-family: var(--mono); font-size: 12px; letter-spacing: .16em; color: var(--ink-3); opacity: 0; transition: opacity .4s ease 1.3s; }
.explode.open .ex-caption { opacity: 1; }
.explode.instant .ex-iso, .explode.instant .plate, .explode.instant .ex-label, .explode.instant .ex-axis, .explode.instant .ex-caption { transition: none; }
.compact .ex-labels { display: none; }
.compact .pl-text { display: block; position: absolute; left: 12px; top: 30px; right: 10px; font-family: var(--mono); font-size: 11px; color: var(--ink); }
.compact .pl-no { font-size: 11px; top: 8px; left: 12px; }
.compact .ex-caption { left: 12px; bottom: 10px; }
.ex-host { position: relative; height: 290px; margin: 6px 0 22px; border: 1px solid var(--ink); overflow: hidden; background: var(--paper-2); }

/* svg drawing */
.grid-minor { stroke: var(--grid); }
.grid-major { stroke: var(--grid-major); }
.border-outer { fill: none; stroke: var(--ink); stroke-width: 2.2; }
.border-inner { fill: none; stroke: var(--ink); stroke-width: .8; }
.zone { fill: var(--ink-3); font-family: var(--iso); font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
.zone-tick { stroke: var(--ink); stroke-width: .8; }
.hdr-sub { fill: var(--ink-3); font-family: var(--mono); font-size: 13px; letter-spacing: .06em; }
.hdr-lede { fill: var(--ink-2); font-family: var(--serif); font-style: italic; font-size: 20px; }
html:lang(zh) .hdr-lede, html:lang(zh) .panel .lede { font-style: normal; }
.notes-title { fill: var(--ink-3); font-size: 12px; letter-spacing: .16em; font-weight: 500; }
.notes-line { fill: var(--ink-2); font-family: var(--mono); font-size: 13px; }
.notes-rule { stroke: var(--ink); stroke-width: .8; }

.edge { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.edge.dashed { stroke-dasharray: 7 5; stroke: var(--ink-2); }
.edge-head { fill: var(--ink); }
.edge-label-bg { fill: var(--paper); }
.edge-label { fill: var(--ink-2); font-family: var(--mono); font-size: 13px; letter-spacing: .03em; text-anchor: middle; dominant-baseline: middle; }
.packet { fill: var(--signal); }

.node { cursor: pointer; outline: none; }
.node-shadow { fill: var(--shadow); }
.node-box { fill: var(--node-fill); stroke: var(--ink); stroke-width: 1.4; transition: stroke-width .2s ease; }
.node-hit { fill: transparent; }
.node-title { fill: var(--ink); font-size: 23px; font-weight: 600; letter-spacing: .05em; }
.node-title.big { font-size: 27px; }
.node-sub { fill: var(--ink-2); font-family: var(--mono); font-size: 14px; }
.node-tag { fill: var(--signal); font-size: 12px; font-weight: 600; letter-spacing: .14em; }
.hatch-fill { opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.hatch-line { stroke: var(--ink-3); stroke-width: .7; }
.balloon circle { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; transition: fill .2s ease; }
.balloon text { fill: var(--ink); font-family: var(--mono); font-size: 12px; text-anchor: middle; dominant-baseline: central; }
.leader { stroke: var(--ink); stroke-width: .8; fill: none; }
.dims { opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.dim-line { stroke: var(--signal); stroke-width: .8; fill: none; }
.dim-head { fill: var(--signal); }
.dim-text { fill: var(--signal); font-family: var(--iso); font-size: 12.5px; text-anchor: middle; dominant-baseline: middle; }
.dim-bg { fill: var(--paper); }
.node:hover .node-box, .node:focus-visible .node-box, .node.active .node-box { stroke-width: 2.6; }
.node:hover .hatch-fill, .node:focus-visible .hatch-fill { opacity: .55; }
.node:hover .balloon circle, .node:focus-visible .balloon circle, .node.active .balloon circle { fill: var(--signal); }
.node:hover .balloon text, .node:focus-visible .balloon text, .node.active .balloon text { fill: #fff; }
.node:focus-visible .node-box { stroke: var(--signal); }
@media (hover: hover) and (pointer: fine) {
  .node:hover .dims { opacity: 1; }
}
.pending { opacity: 0; }
.node-sub, .node-tag { transition: opacity .3s ease; }
.node.active .node-sub, .node.active .node-tag { opacity: 0; }
.dimmable { transition: opacity .45s ease; }
.focusing .dimmable:not(.active) { opacity: .14; }
.revealed { transition: opacity .35s ease; }

.contour { fill: none; stroke: var(--ink-3); stroke-width: .9; }
.contour.index { stroke: var(--ink-2); stroke-width: 1.3; }
.trail { fill: none; stroke: var(--signal); stroke-width: 1.6; stroke-dasharray: 2 5; stroke-linecap: round; }
.summit { fill: var(--signal); }

.pen { pointer-events: none; }
.pen circle { fill: none; stroke: var(--signal); stroke-width: 1.4; }
.pen line { stroke: var(--signal); stroke-width: 1; }
.pen .nib { fill: var(--signal); stroke: none; }

.guides { pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.guides.on { opacity: 1; }
.guide { stroke: var(--signal); stroke-width: .7; stroke-dasharray: 3 4; opacity: .55; }
.guide-read { fill: var(--signal); font-family: var(--mono); font-size: 11px; }
.guide-read-bg { fill: var(--paper); stroke: var(--signal); stroke-width: .7; }

#world { transform-origin: 0 0; transform-box: view-box; transition: transform .8s cubic-bezier(.65, 0, .25, 1); }
.fade-in { opacity: 0; animation: fade .6s ease forwards; }
@keyframes fade { to { opacity: 1; } }

/* theme change: diazo-copier scan from left to right */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html.vt-scan::view-transition-new(root) {
  -webkit-mask-image: linear-gradient(90deg, #000 0 46%, rgba(0, 0, 0, .35) 49%, transparent 54%);
  mask-image: linear-gradient(90deg, #000 0 46%, rgba(0, 0, 0, .35) 49%, transparent 54%);
  -webkit-mask-size: 220% 100%; mask-size: 220% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  animation: scan 1.1s cubic-bezier(.6, 0, .3, 1) both;
}
@keyframes scan { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
html.vt-fade::view-transition-old(root) { animation: vt-out .25s ease both; }
html.vt-fade::view-transition-new(root) { animation: vt-in .35s ease both; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; } }

/* ---------- detail panel ---------- */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(560px, 100vw);
  background: var(--paper);
  border-left: 1.5px solid var(--ink);
  transform: translateX(102%);
  transition: transform .6s cubic-bezier(.65, 0, .25, 1);
  overflow-y: auto;
  z-index: 10;
  font-family: var(--serif);
  box-shadow: -18px 0 40px -24px var(--shadow);
}
.panel.open { transform: none; }
.panel:not(.open) { visibility: hidden; transition: transform .6s cubic-bezier(.65, 0, .25, 1), visibility 0s .6s; }
.panel-head {
  position: sticky; top: 0; z-index: 1;
  background: var(--paper);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--ink);
  padding: 0 0 0 28px;
  font-family: var(--cond);
}
.panel-kicker { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); letter-spacing: .08em; }
.panel-close {
  height: 52px; min-width: 104px;
  border: 0; border-left: 1px solid var(--ink);
  background: none; cursor: pointer;
  font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
}
.panel-close:hover, .panel-close:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.panel-body { padding: 28px 28px 56px; }
.panel h2 { font-family: var(--cond); font-weight: 600; font-size: 34px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 12px; line-height: 1.05; }
.panel h2:focus { outline: none; }
.panel .lede { font-size: 20px; line-height: 1.45; color: var(--ink-2); margin: 0 0 8px; font-style: italic; }
.panel h3 {
  font-family: var(--cond); font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500; margin: 30px 0 10px;
  display: flex; align-items: center; gap: 10px;
}
.panel h3::after { content: ""; flex: 1; border-top: 1px solid var(--ink-3); opacity: .5; }
.panel p, .panel li { font-size: 17px; line-height: 1.55; }
.panel ul { padding-left: 1.1em; margin: 0; }
.panel li + li { margin-top: 6px; }
.numbers { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
.numbers div { padding: 12px 14px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.numbers strong { display: block; font-family: var(--mono); font-weight: 500; font-size: 23px; color: var(--signal); }
.numbers span { font-family: var(--cond); font-size: 14px; color: var(--ink-2); line-height: 1.3; display: block; margin-top: 4px; }
.note { font-family: var(--mono); font-size: 12.5px !important; color: var(--ink-3); }
.panel-contact { margin-top: 44px; border: 1px solid var(--ink); font-family: var(--cond); }
.panel-contact > span { display: block; padding: 8px 14px; border-bottom: 1px solid var(--ink); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.panel-contact nav { display: flex; }
.panel-contact a { flex: 1; min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; border-right: 1px solid var(--ink); }
.panel-contact a:last-child { border-right: 0; }
.panel-contact a:hover, .panel-contact a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }

/* fleet replay */
.fleet { border: 1px solid var(--ink); display: grid; grid-template-columns: 1fr 1fr; background: var(--paper-2); }
.fleet { position: relative; }
.pane { position: relative; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; min-width: 0; transition: background-color .3s ease; }
.pane.lit { background: var(--lit); }
.tok {
  position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none;
  font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .18em;
  padding: 6px 10px 6px 12px; background: var(--paper); border: 1.5px solid var(--signal); color: var(--signal);
  box-shadow: 4px 4px 0 var(--shadow); opacity: 0; will-change: transform;
}
.stamp {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0;
  display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-top: 1.5px solid var(--ink); background: var(--paper);
  font-family: var(--mono); font-size: 11px; color: var(--ink-2); white-space: nowrap;
}
.stamp b { font-family: var(--cond); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.stamp i { font-style: normal; color: var(--signal); }
.pane:nth-child(2n) { border-right: 0; }
.pane.wide { grid-column: span 2; border-right: 0; border-bottom: 0; }
.pane-head { font-family: var(--cond); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-bottom: 1px solid var(--ink); display: flex; align-items: center; justify-content: space-between; }
.pane-state { font-family: var(--mono); font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.pane-state.busy { color: var(--signal); }
.pane-body { font-family: var(--mono); font-size: 12px; line-height: 1.6; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; height: calc(7 * 1.6em + 16px); overflow: hidden; }
.pane-body .ok { color: var(--signal); }
.pane-body .dim { color: var(--ink-3); }
.pane-body .bad { color: var(--signal); font-weight: 600; }
.pane-body .cursor { display: inline-block; width: .55em; height: 2px; vertical-align: -.15em; background: var(--ink-2); }
.replay-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 12px; }
.btn {
  height: 44px; min-width: 104px; padding: 0 16px;
  border: 1px solid var(--ink); background: none; cursor: pointer;
  font-family: var(--cond); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn:hover, .btn:focus-visible { background: var(--ink); color: var(--paper); outline: none; }

/* change sheet */
.change-sheet { margin: 0; }
.change-sheet svg { display: block; width: 100%; height: auto; }
.cs-frame { fill: var(--node-fill); stroke: var(--ink); stroke-width: 1.5; }
.cs-rule { stroke: var(--ink); stroke-width: 1; fill: none; }
.cs-rule.dashed { stroke-dasharray: 5 4; stroke: var(--ink-3); }
.cs-box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.1; }
.cs-box.cs-hot { stroke: var(--signal); stroke-width: 1.6; }
.cs-line { stroke: var(--ink); stroke-width: 1; fill: none; }
.cs-title { font-family: var(--cond); font-size: 13px; font-weight: 600; letter-spacing: .1em; fill: var(--ink); }
.cs-tag { font-family: var(--cond); font-size: 11px; letter-spacing: .16em; fill: var(--signal); font-weight: 600; }
.cs-txt { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.cs-dim { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-3); }
.cs-ms { font-family: var(--mono); font-size: 12px; fill: var(--signal); font-weight: 500; }

.repo-link { margin: 18px 0 0; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photos figure { margin: 0; }
.photos img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid var(--ink); }
.photos a { display: block; }
.photos a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.photos figcaption { font-family: var(--cond); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding-top: 6px; display: flex; gap: 8px; }
.photos figcaption span { font-family: var(--mono); color: var(--ink-3); letter-spacing: 0; }

.mini { display: none; }

/* ---------- text mode ---------- */
@media screen { .textmode p, .textmode li { max-width: 58ch; } }
.textmode { display: none; max-width: 780px; margin: 0 auto; padding: 48px 20px 80px; font-family: var(--serif); }
body.is-text .frame { display: none; }
body.is-text .textmode { display: block; }
.tm-head { border-bottom: 1.5px solid var(--ink); padding-bottom: 18px; margin-bottom: 8px; }
.tm-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.tm-controls { display: flex; gap: 10px; flex-wrap: wrap; }
.textmode h1 { font-family: var(--cond); font-size: 44px; letter-spacing: .06em; text-transform: uppercase; margin: 0; line-height: 1; font-weight: 600; }
.textmode h1:focus { outline: none; }
.textmode .role { font-family: var(--cond); font-size: 19px; margin: 6px 0 0; }
.textmode .contact { font-family: var(--mono); font-size: 13px; margin: 10px 0 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.textmode .contact a { text-decoration: none; border-bottom: 1px solid var(--ink-3); }
.textmode h2 { font-family: var(--cond); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 34px 0 10px; }
.textmode h3 { font-family: var(--cond); font-size: 21px; margin: 18px 0 4px; font-weight: 600; letter-spacing: .02em; }
.textmode .meta { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); margin: 0 0 6px; }
.textmode p, .textmode li { font-size: 17.5px; line-height: 1.55; }
.textmode ul { padding-left: 1.1em; }
.textmode .proof { list-style: none; padding: 0; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); display: grid; grid-template-columns: repeat(4, 1fr); }
.textmode .proof li { padding: 10px 12px; font-family: var(--cond); font-size: 14px; line-height: 1.3; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.textmode .proof strong { display: block; font-family: var(--mono); font-weight: 500; color: var(--signal); font-size: 19px; margin-bottom: 2px; }
.textmode dl { display: grid; grid-template-columns: 11em 1fr; gap: 6px 16px; margin: 0; }
.textmode dt { font-family: var(--cond); font-weight: 600; font-size: 15px; padding-top: 2px; }
.textmode dd { margin: 0; font-size: 16.5px; line-height: 1.45; }

/* ---------- narrow: stacked column ---------- */
@media (max-width: 1024px), (max-height: 719px) {
  .frame { height: auto; padding: 16px; }
  .stage { height: auto; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  #paper { display: none; }
  .stage svg { position: static; }
  .stage svg.wide { display: none; }
  .stage svg.tall { display: block; height: auto; }
  .overlay { position: static; width: auto; }
  .ident { order: -2; }
  .titleblock { order: -1; }
  .ident h1 { font-size: 34px; }
  .ident p { font-size: 18px; margin-top: 6px; }
  .titleblock { font-size: 13px; width: auto; }
  .tb-num { grid-column: span 6; }
  .tb-num strong { font-size: 1.1em; }
  .tb-num.n0, .tb-num.n2 { border-right: 1px solid var(--ink); }
  .tb-num.n1, .tb-num.n3 { border-right: 0; }
  .ident-ctl { font-size: 13px; margin-top: 14px; }
  .tb-links a { min-height: 44px; }
  .seg button { height: 44px; }
  .seg button::after { display: none; }
  .revisions { order: 3; width: 100%; font-size: 13px; }
  .explode.desk { display: none; }
  .panel-open .overlay { opacity: 1; }
  .panel { border-left: 0; }
  .fleet { grid-template-columns: 1fr; }
  .pane { border-right: 0; }
  .pane.wide { grid-column: auto; }
  .mini {
    display: flex; align-items: center; justify-content: space-between;
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    background: var(--paper); border-bottom: 1.5px solid var(--ink);
    padding: 0 0 0 16px; font-family: var(--cond);
    transform: translateY(-100%); transition: transform .3s ease;
  }
  .mini.show { transform: none; }
  .mini strong { letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .mini nav { display: flex; }
  .mini a { min-height: 44px; min-width: 88px; display: flex; align-items: center; justify-content: center; text-decoration: none; border-left: 1px solid var(--ink); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; }
  body.is-text .mini { display: none; }
  .textmode .proof { grid-template-columns: repeat(2, 1fr); }
  .textmode dl { grid-template-columns: 1fr; gap: 2px; }
  .textmode dd { margin-bottom: 8px; }
}
@media (min-width: 1025px) and (min-height: 720px) {
  .panel h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}

:root.no-motion *, :root.no-motion *::before, :root.no-motion *::after { animation: none !important; transition: none !important; }
:root.no-motion .fade-in, :root.no-motion .pending { opacity: 1; }

/* ---------- orchestration theater: sheet JM-002 ---------- */
.frame { transform-origin: 0 0; transition: transform .9s cubic-bezier(.65, 0, .25, 1); }
body.theater-open { overflow: hidden; }
body.theater-open .frame { position: relative; z-index: 7; pointer-events: none; }
.th { position: fixed; inset: 0; z-index: 6; visibility: hidden; transition: visibility 0s .9s; --rail: 300px; --maph: 200px; }
.th.open { visibility: visible; transition: none; }
.th-rail { position: absolute; left: 0; top: 0; bottom: 0; width: var(--rail); background: var(--paper-2); border-right: 1.5px solid var(--ink); opacity: 0; transition: opacity .5s ease; }
.th.open .th-rail { opacity: 1; }
.th-back { position: absolute; left: 14px; top: 14px; width: calc(var(--rail) - 28px); height: var(--maph); border: 1px solid var(--ink); background: none; cursor: zoom-out; padding: 0; }
.th-back span { position: absolute; left: 0; top: calc(100% + 10px); font-family: var(--cond); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.th-back:hover, .th-back:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.th-acts { position: absolute; left: 14px; right: 14px; top: calc(var(--maph) + 62px); border-bottom: 1px solid var(--ink); }
.th-acts button {
  display: grid; grid-template-columns: 2.6em 1fr auto; align-items: center; width: 100%; min-height: 46px; padding: 0 10px;
  border: 0; border-top: 1px solid var(--ink); background: none; cursor: pointer; text-align: left;
  font-family: var(--cond); font-size: 15px; letter-spacing: .1em; text-transform: uppercase;
}
.th-acts button span { font-family: var(--mono); font-size: 12px; color: var(--signal); letter-spacing: 0; }
.th-acts button:hover { background: var(--lit); }
.th-acts button:focus-visible { outline: 2px solid var(--signal); outline-offset: -3px; }
.th-acts button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.th-acts button[aria-current="true"] span { color: var(--paper); }
.th-note { position: absolute; left: 14px; right: 14px; bottom: 16px; margin: 0; font-family: var(--serif); font-style: italic; font-size: 14px; line-height: 1.4; color: var(--ink-3); }
.th-sheet {
  position: absolute; left: calc(var(--rail) + 14px); right: 14px; top: 14px; bottom: 14px;
  border: 1.5px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -9px;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
  clip-path: inset(0 0 0 100%); transition: clip-path .85s cubic-bezier(.65, 0, .25, 1) .2s;
}
.th.open .th-sheet { clip-path: inset(-14px); }
.th-hdr { position: absolute; left: 28px; right: 28px; top: 22px; display: flex; align-items: center; gap: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
.th-no { font-family: var(--cond); font-weight: 600; font-size: 46px; line-height: 1; color: var(--signal); min-width: 1.7em; }
.th-ttl { font-family: var(--cond); font-weight: 600; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; }
.th-cap { font-family: var(--serif); font-style: italic; font-size: 16.5px; line-height: 1.35; color: var(--ink-2); max-width: 80ch; margin-top: 2px; }
.th-hdr.swap .th-no, .th-hdr.swap .th-ttl, .th-hdr.swap .th-cap { animation: reletter .65s cubic-bezier(.4, 0, .2, 1) both; }
.th-hdr.swap .th-cap { animation-delay: .12s; }
@keyframes reletter { from { clip-path: inset(0 100% 0 0); opacity: .3; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.th-live { flex: none; height: 40px; padding: 0 14px; display: flex; align-items: center; border: 1px solid var(--ink-3); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; white-space: nowrap; color: var(--ink-2); }
.th-hdr > div:not(.th-live) { flex: 1; min-width: 0; }
.th-close { flex: none; white-space: nowrap; height: 40px; padding: 0 16px; border: 1px solid var(--ink); background: none; cursor: pointer; font-family: var(--cond); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.th-close:hover, .th-close:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.th-area { position: absolute; left: 18px; right: 18px; top: 116px; bottom: 46px; }
.th-world { position: absolute; left: 0; top: 0; width: 1120px; height: 660px; transform-origin: 0 0; }
.th-tb { position: absolute; right: 28px; bottom: 16px; display: flex; font-family: var(--iso); font-size: 12px; color: var(--ink-3); border: 1px solid var(--ink); background: var(--paper); }
.th-tb span { padding: 3px 10px; }
.th-tb span + span { border-left: 1px solid var(--ink); }

.th-wires { position: absolute; left: 0; top: 0; width: 1120px; height: 660px; overflow: visible; pointer-events: none; }
.th-wire { fill: none; stroke: var(--ink); stroke-width: 1.4; transition: opacity .5s ease; }
.th-wire.io { stroke: var(--signal); stroke-dasharray: 5 5; }
.th-wire.hand { stroke: var(--signal); stroke-width: 2; }
.th-w { transition: opacity .5s ease; }
.th-w.dead { opacity: .14; }
.th-pin { fill: var(--paper); stroke: var(--ink); stroke-width: 1.3; }
.th-pin.io, .th-pin.hand { stroke: var(--signal); }
.th-trunk { fill: none; stroke: var(--ink); stroke-width: 2.4; }
.th-trunk-t { font: 13px var(--mono); fill: var(--ink-3); text-anchor: end; }
.th-branch { fill: none; stroke: var(--ink-3); stroke-width: 1.4; transition: stroke .4s ease; }
.th-branch.merged { stroke: var(--signal); stroke-width: 2; }
.th-commit { fill: var(--signal); }

.th-pane {
  position: absolute; display: flex; flex-direction: column; border: 1.5px solid var(--ink); background: var(--node-fill);
  box-shadow: 6px 6px 0 var(--shadow); font-family: var(--mono); font-size: 13px; transition: background-color .3s ease, opacity .5s ease;
}
.th-pane.lit { background: color-mix(in srgb, var(--signal) 8%, var(--node-fill)); }
.th-head { display: flex; align-items: center; gap: 8px; padding: 5px 9px; border-bottom: 1px solid var(--ink); font-family: var(--cond); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; min-width: 0; }
.th-head { overflow: hidden; }
.th-head b { flex: none; font-weight: 600; }
.th-pane.has-ctx .th-ctx-k { display: none; }
.th-pane.has-ctx .th-ctx i { width: 44px; }
.th-role { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink-3); font-family: var(--mono); font-size: 12px; letter-spacing: 0; text-transform: none; }
.th-st { margin-left: auto; font-family: var(--mono); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.th-pane.lit .th-st { color: var(--signal); }
.th-body { flex: 1; overflow: hidden; padding: 7px 10px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.th-body .l { min-height: 1.55em; }
.th-body .pre, .th-body .dim, .th-body .l.dim { color: var(--ink-3); }
.th-body .l.ok .pre, .th-body .bar { color: var(--signal); }
.th-body .l.bad { color: var(--signal); font-weight: 600; }
.th-body .l.bad .pre, .th-body .l.warn .pre { color: var(--signal); }
.th-body .l.warn { color: var(--signal); font-style: italic; }
.th-body .cursor { display: inline-block; width: .55em; height: 2px; vertical-align: -.15em; background: var(--ink-2); }
.th-spec { outline: 1px solid var(--ink); outline-offset: 3px; }
.th-pane.has-ctx .th-role { display: none; }
.th-ctx { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.th-ctx + .th-st { margin-left: 8px; }
.th-ctx i { position: relative; display: block; width: 56px; height: 7px; border: 1px solid var(--ink); }
.th-ctx i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.th-ctx i::after { content: ""; position: absolute; left: 40%; top: -4px; bottom: -4px; border-left: 1.5px solid var(--signal); }
.th-ctx em { font-style: normal; min-width: 3ch; }
.th-ctx.hot i b { background: var(--signal); }
.th-ctx.hot em { color: var(--signal); font-weight: 500; }

.th-spawn { animation: th-spawn .6s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes th-spawn { 0% { clip-path: inset(50% 50% 50% 50%); opacity: .2; } 55% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(-24px -24px -24px -24px); opacity: 1; } }
.th-pane.reaped { opacity: .45; border-style: dashed; box-shadow: none; }
.th-pane.reaped .th-body { opacity: .4; }
.th-pane.gone, .th-chip.gone, .th-card.gone, .th-page.gone { animation: th-gone .5s ease forwards; }
@keyframes th-gone { from { clip-path: inset(-24px); } to { clip-path: inset(50% 50% 50% 50%); opacity: 0; } }

.th-tok {
  position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; white-space: nowrap; will-change: transform;
  font: 600 11px var(--cond); letter-spacing: .16em; padding: 4px 9px; background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 var(--shadow);
}
.th-tok.io, .th-tok.hot { border-color: var(--signal); color: var(--signal); }
.th-tok.io { border-style: dashed; }

  /* ================= svg helpers ================= */
  const el = (name, attrs = {}, parent) => {

  };
  const text = (parent, x, y, cls, str) => { const t = el('text', { x, y, class: cls }, parent); t.textContent = str; return t; };
  const textW = (s, size) => { let w = 0; for (const ch of s) w += /[⺀-鿿＀-￯]/.test(ch) ? size : size * .61; return w; };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  const anchor = (box, side, t) => {
    const [x, y, w, h] = box;
    if (side === 'l') return [x, y + h * t];
    if (side === 'r') return [x + w, y + h * t];
    if (side === 't') return [x + w * t, y];
    return [x + w * t, y + h];
  };
  const routeEdge = (a, as, b, bs, off = 18) => {
    const horiz = s => s === 'l' || s === 'r';
    if (as === bs) {
      if (horiz(as)) { const x = as === 'l' ? Math.min(a[0], b[0]) - off : Math.max(a[0], b[0]) + off; return [a, [x, a[1]], [x, b[1]], b]; }
      const y = as === 't' ? Math.min(a[1], b[1]) - off : Math.max(a[1], b[1]) + off; return [a, [a[0], y], [b[0], y], b];
    }
    if (horiz(as) && horiz(bs)) { const mx = (a[0] + b[0]) / 2; return [a, [mx, a[1]], [mx, b[1]], b]; }
    if (!horiz(as) && !horiz(bs)) { const my = (a[1] + b[1]) / 2; return [a, [a[0], my], [b[0], my], b]; }
    return horiz(as) ? [a, [b[0], a[1]], b] : [a, [a[0], b[1]], b];
  };
  const ptsToPath = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const rectPath = (x, y, w, h) => `M${x} ${y} H${x + w} V${y + h} H${x} Z`;
  const makeRand = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  function contours(g, box, rand, S) {
    const [x, y, w, h] = box;
    const cx = x + w * .64, cy = y + h * .56;
    const rings = 8;
    const phase = Array.from({ length: 4 }, () => rand() * Math.PI * 2);
    for (let r = 0; r < rings; r++) {
      const rx = (w * .34) * (1 - r / rings) + 6, ry = (h * .36) * (1 - r / rings) + 4;
      const pts = [];
      for (let i = 0; i <= 72; i++) {
        const a = i / 72 * Math.PI * 2;
        const wob = 1 + .09 * Math.sin(3 * a + phase[0] + r * .4) + .05 * Math.sin(5 * a + phase[1]) + .04 * Math.cos(2 * a + phase[2] - r * .3);
        pts.push([cx + Math.cos(a) * rx * wob, cy + Math.sin(a) * ry * wob * (1 - .04 * r)]);
      }
      S(el('path', { d: ptsToPath(pts) + 'Z', class: 'contour' + (r % 4 === 0 ? ' index' : '') }, g), 4);
    }
    const trail = [[x + 16, y + h - 14], [x + w * .25, y + h * .76], [x + w * .4, y + h * .82], [x + w * .52, y + h * .66], [cx - 8, cy + 6], [cx, cy - 2]];
    let d = 'M' + trail[0].join(' ');
    for (let i = 1; i < trail.length; i++) {
      const p = trail[i - 1], q = trail[i];
      d += ` Q${(p[0] + q[0]) / 2 + 10} ${(p[1] + q[1]) / 2 - 12} ${q[0]} ${q[1]}`;
    }
    return [el('path', { d, class: 'trail' }, g), el('path', { d: `M${cx} ${cy - 9} L${cx + 7} ${cy + 4} L${cx - 7} ${cy + 4} Z`, class: 'summit' }, g)];
  }

  function dimension(g, x1, y1, x2, y2, label, key, vertical) {

    if (vertical) {
      el('path', { d: `M${x1 + 14} ${y1} H${x1 - 4} M${x1 + 14} ${y2} H${x1 - 4}`, class: 'dim-line' }, d);

    } else {
      el('path', { d: `M${x1} ${y1 - 14} V${y1 + 4} M${x2} ${y1 - 14} V${y1 + 4}`, class: 'dim-line' }, d);

  /* ================= build ================= */
  let packets = [];

  function build(L, { plot = false } = {}) {
    const t = T();
    const svg = document.getElementById(L.svg);

    svg.setAttribute('aria-label', t.sheet);

    const rand = makeRand(7);
    const key = L.key;
    const strokes = [];          // outlines; plotted by rank: border, nodes, edges, contours
    const reveals = [];          // [stroke that must finish first, element]
    const S = (node, rank) => { node.dataset.rank = rank; strokes.push(node); return node; };

            el('rect', { x: px + 4, y: py + 5, width: 16, height: 2.2, class: 'live-bar', style: `animation-delay:${(i * .43).toFixed(2)}s` }, lv);

        if (L.dims) {

    // drafting guides that follow the pointer (wide sheet, fine pointers)

  /* ================= plotter intro ================= */
  function plot({ strokes: raw, reveals, svg }, done) {
    const strokes = raw.slice().sort((x, y) => x.dataset.rank - y.dataset.rank);
    reveals.forEach(r => r[1].classList.add('pending'));
    const lens = strokes.map(s => s.getTotalLength());
    const weight = strokes.map(s => s.dataset.rank < 2 ? .3 : 1);   // borders are drawn fast
    const saved = strokes.map(s => s.style.strokeDasharray);
    const markers = strokes.map(s => s.getAttribute('marker-end'));
    strokes.forEach(s => s.removeAttribute('marker-end'));
    strokes.forEach((s, i) => { s.style.strokeDasharray = `${lens[i]} ${lens[i]}`; s.style.strokeDashoffset = lens[i]; });
    const complete = new Set();
    const finishStroke = j => {
      if (complete.has(strokes[j])) return;
      complete.add(strokes[j]);
      strokes[j].style.strokeDashoffset = 0;
      if (markers[j]) strokes[j].setAttribute('marker-end', markers[j]);
      reveals.forEach(([after, e]) => { if (after === strokes[j]) { e.classList.add('revealed'); e.classList.remove('pending'); } });
    };
    const pen = el('g', { class: 'pen', 'aria-hidden': 'true' }, svg);
    el('circle', { r: 9 }, pen); el('circle', { r: 2.4, class: 'nib' }, pen);
    el('line', { x1: -16, y1: 0, x2: -11, y2: 0 }, pen); el('line', { x1: 11, y1: 0, x2: 16, y2: 0 }, pen);
    el('line', { x1: 0, y1: -16, x2: 0, y2: -11 }, pen); el('line', { x1: 0, y1: 11, x2: 0, y2: 16 }, pen);
    const eff = lens.map((l, j) => l * weight[j]);
    const total = eff.reduce((x, y) => x + y, 0);
    const duration = 2800;
    const starts = []; let acc = 0;
    eff.forEach(l => { starts.push(acc); acc += l; });
    let finished = false;
    const t0 = performance.now();
    const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
    const finish = () => {
      if (finished) return; finished = true;
      strokes.forEach((s, j) => { finishStroke(j); s.style.strokeDasharray = saved[j]; s.style.strokeDashoffset = ''; });
      reveals.forEach(([, e]) => { e.classList.add('revealed'); e.classList.remove('pending'); });
      pen.remove();
      removeEventListener('pointerdown', finish); removeEventListener('keydown', finish);
      done();
    };
    addEventListener('pointerdown', finish);
    addEventListener('keydown', finish);
    const frameFn = now => {
      if (finished) return;
      const k = Math.min(1, (now - t0) / duration);
      const dist = ease(k) * total;
      let i = 0;
      while (i < strokes.length - 1 && starts[i + 1] <= dist) i++;
      for (let j = 0; j < i; j++) finishStroke(j);
      const local = Math.max(0, Math.min(lens[i], (dist - starts[i]) / weight[i]));
      strokes[i].style.strokeDashoffset = lens[i] - local;
      const pt = strokes[i].getPointAtLength(local);
      pen.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
      if (k >= 1) finish(); else requestAnimationFrame(frameFn);
    };
    requestAnimationFrame(frameFn);
  }

  /* ================= paper texture (WebGL, rendered once per size/theme) ================= */
  const paper = (() => {
    const canvas = document.getElementById('paper');
    let gl = null;
    try { gl = canvas.getContext('webgl', { antialias: false }); } catch (_) {}
    if (!gl) return { render() {} };
    const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fs = `precision mediump float;
      uniform vec2 res; uniform vec3 base; uniform vec3 fiber; uniform float dark;
      float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
        return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
      void main(){
        vec2 uv=gl_FragCoord.xy/res; vec2 q=gl_FragCoord.xy;
        float cloud=fbm(q*.004)*.6+fbm(q*.02)*.4;
        float fib=0.;
        for(int k=0;k<3;k++){float a=float(k)*2.1+.7; vec2 d=vec2(cos(a),sin(a));
          vec2 r=vec2(dot(q,d),dot(q,vec2(-d.y,d.x)));
          fib+=smoothstep(.72,.98,n(vec2(r.x*.012,r.y*.9)))*.33;}
        float grain=h(q)*.5+h(q*1.7)*.5;
        float vig=smoothstep(1.25,.35,length((uv-.5)*vec2(1.1,1.4)));
        vec3 c=base*(1.-.035*cloud-.025*grain*(1.-dark))+fiber*fib*.06;
        c*=mix(.93,1.,vig);
        gl_FragColor=vec4(c,1.);
      }`;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
    const v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return { render() {} };
    const prog = gl.createProgram(); gl.attachShader(prog, v); gl.attachShader(prog, f); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return { render() {} };
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const uRes = gl.getUniformLocation(prog, 'res'), uBase = gl.getUniformLocation(prog, 'base'), uFiber = gl.getUniformLocation(prog, 'fiber'), uDark = gl.getUniformLocation(prog, 'dark');
    const rgb = css => { const m = css.trim().match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i); return m ? [1, 2, 3].map(i => parseInt(m[i], 16) / 255) : [.95, .93, .89]; };
    return {
      render() {
        const r = canvas.getBoundingClientRect();
        if (r.width === 0) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        const cs = getComputedStyle(document.documentElement);
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform3fv(uBase, rgb(cs.getPropertyValue('--paper')));
        gl.uniform3fv(uFiber, rgb(cs.getPropertyValue('--ink')));
        gl.uniform1f(uDark, document.documentElement.dataset.theme === 'blueprint' ? 1 : 0);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
    };
  })();

  let motionPref = store.get('jm-motion');

  // motion follows the site's own on/off switch only; the OS reduced-motion setting does not turn it off
  const motionOK = () => motionPref !== 'off' && !document.hidden && !document.body.classList.contains('is-text') && !PRINT;

  let running = false, last = performance.now();
  function tick(now) {
    if (!motionOK() || intro) { running = false; packets.forEach(p => p.dots.forEach(d => d.setAttribute('opacity', 0))); return; }
    const dt = Math.min(64, now - last) / 1000; last = now;
    for (const p of packets) {
      if (p.svg.getBoundingClientRect().width === 0) continue;
      if (!p.len) p.len = p.path.getTotalLength();
      p.pos = (p.pos + p.speed * dt) % (p.len + 60);
      p.dots.forEach((d, i) => {
        const raw = p.pos - i * 9;
        const t = Math.min(Math.max(0, raw), p.len);
        const pt = p.path.getPointAtLength(t);
        d.setAttribute('cx', pt.x); d.setAttribute('cy', pt.y);
        const o = raw > p.len || raw < 0 ? 0 : Math.min(1, t / 20, (p.len - t) / 20);
        d.setAttribute('opacity', o * [1, .5, .25][i]);
      });
    }
    requestAnimationFrame(tick);
  }

      ['stamp'],

  const PANES = ['planner', 'worker', 'reviewer'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const MARK = { ok: ['✓ ', 'ok'], bad: ['✗ ', 'bad'] };
  const SPIN = '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏';

  function buildRun(steps) {
    let at = rnd(250, 700);
    const ev = [], busy = { planner: [], worker: [], reviewer: [] };
    for (const [who, a, b, c] of steps) {
      if (who === 'token') { const d = rnd(950, 1250); ev.push({ type: 'token', label: a, from: b, to: c, start: at, dur: d }); at += d + rnd(80, 300); continue; }
      if (who === 'stamp') { ev.push({ type: 'stamp', start: at, dur: 420 }); at += rnd(700, 1200); continue; }
      if (a === 'think') {
        const d = rnd(600, 2200);
        ev.push({ type: 'think', pane: who, start: at, dur: d }); busy[who].push([at, at + d]); at += d; continue;
      }
      if (a === 'tests') {
        const d = rnd(900, 2600);
        ev.push({ type: 'tests', pane: who, start: at, dur: d, n: Math.round(rnd(6, 38)), secs: (d / 1000 * rnd(.9, 1.6)).toFixed(1) });
        busy[who].push([at, at + d]); at += d + rnd(150, 450); continue;
      }
      const segs = a === 'cmd' ? [['$ ', 'dim'], [b]] : a === 'dim' ? [[b, 'dim']] : MARK[a] ? [MARK[a], [b]] : [[b]];
      const len = segs.reduce((n, sg) => n + sg[0].length, 0);
      const ts = [];   // ts[i]: ms after the line starts when character i appears
      let x = 0;
      if (a === 'cmd') {
        ts.push(0, 0); x = rnd(120, 420);
        for (let i = 2; i < len; i++) { x += rnd(26, 90) + (b[i - 3] === ' ' && Math.random() < .2 ? rnd(120, 420) : 0); ts.push(x); }
      } else {
        x = rnd(150, 600);
        for (let i = 0; i < len;) { const k = Math.min(len - i, Math.round(rnd(2, 9))); for (let j = 0; j < k; j++) ts.push(x); i += k; x += rnd(18, 80); }
      }
      ev.push({ type: 'line', pane: who, segs, len, ts, start: at, dur: x });
      busy[who].push([at, at + x]); at += x + rnd(110, 450);
    }
    return { ev, busy, dur: at, end: at + rnd(2200, 4200), tokens: ev.filter(e => e.type === 'token'), stamp: ev.find(e => e.type === 'stamp') };
  }

  function paneLines(run, pane, t) {
    const out = [];
    for (const e of run.ev) {
      if (e.pane !== pane || t < e.start) continue;
      const dt = t - e.start;
      if (e.type === 'line') {
        let k = 0; while (k < e.len && e.ts[k] <= dt) k++;
        let left = k, html = '';
        for (const [str, cls] of e.segs) {
          if (left <= 0) break;
          const part = str.slice(0, left); left -= part.length;
          html += cls ? `<span class="${cls}">${esc(part)}</span>` : esc(part);
        }
        if (k < e.len) html += '<span class="cursor"></span>';
        out.push(html);
      } else if (e.type === 'think') {
        if (dt < e.dur) out.push(`<span class="ok">${SPIN[Math.floor(t / 80) % SPIN.length]}</span> <span class="dim">thinking${'.'.repeat(1 + Math.floor(dt / 400) % 3)}</span>`);
      } else if (e.type === 'tests') {
        const f = Math.min(1, dt / e.dur), n = 14, k = Math.round(f * n);
        out.push(f < 1
          ? `tests <span class="ok">${'█'.repeat(k)}</span><span class="dim">${'░'.repeat(n - k)}</span> <span class="dim">${Math.floor(f * e.n)}/${e.n}</span>`
          : `<span class="ok">✓</span> ${e.n} passed <span class="dim">in ${e.secs}s</span>`);
      }
    }
    return out;
  }

  function fleetHTML() {
    const P = T().panel;
    const pane = (k, label, cls = '') => `<div class="pane ${cls}" data-p="${k}"><div class="pane-head"><span>${esc(label)}</span><span class="pane-state" data-state="${k}"></span></div><div class="pane-body" data-pane="${k}" lang="en"></div>${k === 'reviewer' ? `<div class="stamp"><i>✓</i><b>${esc(P.accepted)}</b>· reviewer · per criterion</div>` : ''}</div>`;
    return `<div class="fleet-wrap"><div class="fleet">${pane('planner', P.panes[0])}${pane('worker', P.panes[1])}${pane('reviewer', P.panes[2], 'wide')}</div>
      <p class="note">${esc(P.replayNote)}</p></div>`;
  }

  function mountFleet(root) {
    const P = T().panel, fleetEl = root.querySelector('.fleet'), stamp = root.querySelector('.stamp');
    const hist = { planner: [], worker: [], reviewer: [] };
    let queue = [], last = -1, run = null, t = 0, playing = false, lastNow = 0, raf = 0, resumeLater = false;
    const next = () => {
      if (!queue.length) {
        queue = TASKS.map((_, i) => i).sort(() => Math.random() - .5);
        if (queue[0] === last) queue.push(queue.shift());
      }
      last = queue.shift();
      run = buildRun(TASKS[last]);
      fleetEl.querySelectorAll('.tok').forEach(x => x.remove());
      run.tokens.forEach(e => {
        e.el = document.createElement('div');
        e.el.className = 'tok'; e.el.setAttribute('aria-hidden', 'true'); e.el.textContent = e.label;
        fleetEl.appendChild(e.el);
      });
      t = 0;
    };
    // a finished task stays in the scrollback above the next one
    const archive = () => PANES.forEach(k => {
      const lines = paneLines(run, k, Infinity);
      if (lines.length) hist[k] = hist[k].concat(hist[k].length ? [''] : [], lines).slice(-16);
    });
    const centre = k => { const p = root.querySelector(`.pane[data-p="${k}"]`); return { x: p.offsetLeft + p.offsetWidth / 2, y: p.offsetTop + p.offsetHeight / 2 }; };
    const draw = () => {
      for (const k of PANES) {
        const b = root.querySelector(`[data-pane="${k}"]`);
        const html = hist[k].concat(paneLines(run, k, t)).join('\n');
        if (b._h !== html) { b.innerHTML = html; b._h = html; b.scrollTop = b.scrollHeight; }
        const busy = run.busy[k].some(([s, e]) => t >= s && t < e);
        const st = root.querySelector(`[data-state="${k}"]`);
        const label = busy ? P.busy : P.idle;
        if (st.textContent !== label) st.textContent = label;
        st.classList.toggle('busy', busy);
        root.querySelector(`.pane[data-p="${k}"]`).classList.toggle('lit', busy);
      }
      run.tokens.forEach(e => {
        const f = (t - e.start) / e.dur;
        if (f < 0 || f > 1) { e.el.style.opacity = 0; return; }
        const a = centre(e.from), b = centre(e.to);
        const q = f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2;
        const cx = (a.x + b.x) / 2 + (b.y - a.y) * .25, cy = Math.min(a.y, b.y) - 60;
        const x = (1 - q) ** 2 * a.x + 2 * (1 - q) * q * cx + q * q * b.x;
        const y = (1 - q) ** 2 * a.y + 2 * (1 - q) * q * cy + q * q * b.y;
        const dx = 2 * (1 - q) * (cx - a.x) + 2 * q * (b.x - cx), dy = 2 * (1 - q) * (cy - a.y) + 2 * q * (b.y - cy);
        e.el.style.opacity = Math.min(1, f * 8, (1 - f) * 8);
        e.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) rotate(${Math.atan2(dy, dx) * 9}deg) scale(${1 + .3 * Math.sin(Math.PI * f)})`;
      });
      const g = (t - run.stamp.start) / run.stamp.dur;
      if (g < 0) stamp.style.opacity = 0;
      else {
        const c = Math.min(1, g), e3 = 1 - Math.pow(1 - c, 3);
        stamp.style.opacity = 1;
        stamp.style.clipPath = `inset(0 ${((1 - e3) * 100).toFixed(1)}% 0 0)`;
      }
    };
    const step = now => {
      if (!playing) return;
      t += Math.min(64, now - lastNow); lastNow = now;
      if (t >= run.end) { archive(); next(); }
      draw();
      raf = requestAnimationFrame(step);
    };
    const play = () => {
      if (!motionOK()) { t = run.dur; draw(); return; }
      playing = true; lastNow = performance.now();
      cancelAnimationFrame(raf); raf = requestAnimationFrame(step);
    };
    const pause = () => { playing = false; cancelAnimationFrame(raf); };
    next(); draw();
    return {
      play, pause,
      suspend() { if (playing) { resumeLater = true; pause(); } },
      resume() { if (resumeLater) { resumeLater = false; play(); } }
    };
  }

  /* ========== exploded view: the selected part lifts off the sheet and separates into layers ========== */
  let explodeEl = null;
  function buildExplode(id, host, g, compact, instant) {
    const n = T().nodes[id];
    if (!n.layers) return null;
    const L = n.layers;
    const gap = Math.max(34, Math.min(76, g.h * .36));
    const ex = document.createElement('div');
    ex.className = 'explode flat' + (compact ? ' compact' : ' desk') + (instant ? ' instant' : '');
    ex.setAttribute('aria-hidden', 'true');
    const k = g.k || 1;
    ex.innerHTML = `<div class="ex-scene"><div class="ex-iso" style="left:${g.cx - g.w / 2}px;top:${g.cy - g.h / 2}px;width:${g.w}px;height:${g.h}px;--gap:${gap}px;--k:${k};--dx:${g.dx || 0}px;--dy:${g.dy || 0}px">
      <div class="ex-axis" style="height:${gap * (L.length - 1) + 60}px"></div>
      ${L.map((l, i) => `<div class="plate" style="--i:${i}"><div class="pl-face"><span class="pl-no">${String(i + 1).padStart(2, '0')}</span><span class="pl-text">${esc(l)}</span></div><i class="pl-anchor"></i></div>`).join('')}
      </div></div><div class="ex-labels">${L.map((l, i) => `<span class="ex-label" style="--i:${i}">${esc(l)}</span>`).join('')}</div><div class="ex-caption">${esc(T().panel.exploded)}</div>`;
    host.appendChild(ex);
    return ex;
  }
  // labels live in 2D and follow each plate's projected left edge, so the text stays crisp
  function trackLabels(ex) {
    const anchors = [...ex.querySelectorAll('.pl-anchor')], labels = [...ex.querySelectorAll('.ex-label')];
    const tick2 = () => {
      if (!ex.isConnected || ex.classList.contains('gone')) return;
      const base = ex.getBoundingClientRect();
      anchors.forEach((a, i) => {
        const r0 = a.getBoundingClientRect(), lb = labels[i];
        lb.style.transform = `translate(${r0.left - base.left - lb.offsetWidth - 28}px, ${r0.top - base.top - lb.offsetHeight / 2}px)`;
      });
      if (motionOK() || ex._frames++ < 90) requestAnimationFrame(tick2);
    };
    ex._frames = 0;
    requestAnimationFrame(tick2);
  }
  function openExplode(ex, instant) {
    if (!ex) return;
    if (!ex.classList.contains('compact')) trackLabels(ex);
    if (instant) { ex.classList.replace('flat', 'open'); return; }
    requestAnimationFrame(() => requestAnimationFrame(() => ex.classList.replace('flat', 'open')));
  }
  function dropExplode() {
    document.querySelectorAll('.node.exploded').forEach(nd => nd.classList.remove('exploded'));
    if (!explodeEl) return;
    const ex = explodeEl; explodeEl = null;
    ex.classList.add('gone');
    setTimeout(() => ex.remove(), 360);
  }
  function mountExplode(id, instant) {
    dropExplode();
    if (isNarrow()) {
      const host = body.querySelector('.ex-host');
      if (!host) return;
      const w = Math.min(210, host.clientWidth * .5), h = w * .48;
      explodeEl = buildExplode(id, host, { cx: host.clientWidth * .52, cy: host.clientHeight * .62, w, h }, true, instant);
      openExplode(explodeEl, instant);
      return;
    }
    const g = focusWorld(id);
    if (!g) return;
    // the part starts at its zoomed size, then shrinks and moves right so the layer labels fit on its left
    const areaW = innerWidth - Math.min(560, innerWidth) - stageEl.getBoundingClientRect().left;
    g.k = Math.min(1, areaW * .38 / g.w);
    g.dx = areaW * .08;
    g.dy = g.h * g.k * .9;
    const go = () => {
      if (currentId !== id) return;
      explodeEl = buildExplode(id, stageEl, g, false, instant);
      if (!explodeEl) return;
      document.querySelectorAll(`#svg-wide .node[data-node="${id}"]`).forEach(nd => nd.classList.add('exploded'));
      openExplode(explodeEl, instant);
    };
    if (instant) go(); else explodeTimer = setTimeout(go, 760);
  }
  let explodeTimer = 0;
  stageEl.addEventListener('pointermove', e => {
    if (!explodeEl || !fine.matches) return;
    const r0 = stageEl.getBoundingClientRect();
    const fx = (e.clientX - r0.left) / r0.width - .35, fy = (e.clientY - r0.top) / r0.height - .5;
    const iso = explodeEl.querySelector('.ex-iso');
    iso.style.setProperty('--pz', (fx * 16).toFixed(2) + 'deg');
    iso.style.setProperty('--px', (fy * -10).toFixed(2) + 'deg');
  });

  const isNarrow = () => innerWidth <= 1024 || innerHeight < 720;
  function focusWorld(id) {
    const world = document.getElementById('world');
    if (!world) return;
    const svg = document.getElementById('svg-wide');
    const rect = svg.getBoundingClientRect();
    if (!id || rect.width === 0 || isNarrow()) { world.style.transform = ''; return null; }
    const box = layouts.wide.nodes[id];
    const units = VW / rect.width;
    const panelLeft = innerWidth - Math.min(560, innerWidth);
    const visibleRight = Math.max(400, Math.min(VW, (panelLeft - rect.left) * units));
    const pad = 80;
    const s = Math.min(2.1, (visibleRight - pad * 2) / (box[2] + 80), (VH - pad * 2) / (box[3] + 80));
    const cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
    world.style.transform = `translate(${visibleRight / 2 - s * cx}px, ${VH / 2 - s * cy}px) scale(${s})`;
    const sr = stageEl.getBoundingClientRect();
    return { cx: rect.left + visibleRight / 2 / units - sr.left, cy: rect.top + VH / 2 / units - sr.top, w: box[2] * s / units, h: box[3] * s / units };
  }
  const visibleNode = id => document.querySelector(`${isNarrow() ? '#svg-tall' : '#svg-wide'} .node[data-node="${id}"]`);

  let fleet = null, fleetTimer = 0;
  function showPanel(id) {
    currentId = id;
    clearTimeout(focusTimer); clearTimeout(explodeTimer);
    document.querySelectorAll('.node.active').forEach(n => n.classList.remove('active'));
    document.querySelectorAll(`.node[data-node="${id}"]`).forEach(n => n.classList.add('active'));
    kicker.textContent = T().panel.kicker(META[id].no);
    body.innerHTML = caseHTML(id);
    panel.scrollTop = 0;
    panel.inert = false;
    panel.classList.add('open');
    frame.inert = true; mini.inert = true; document.getElementById('curl').inert = true;
    stageEl.classList.add('panel-open');
    document.getElementById('svg-wide').classList.add('focusing');
    const gg = document.getElementById('guides'); if (gg) gg.classList.remove('on');
    mountExplode(id, !motionOK());
    clearTimeout(fleetTimer);
    const fw = body.querySelector('.fleet-wrap');
    fleet = fw ? mountFleet(fw) : null;
    if (fleet) fleetTimer = setTimeout(() => fleet && fleet.play(), motionOK() ? 1300 : 0);
    focusTimer = setTimeout(() => document.getElementById('panel-title').focus({ preventScroll: true }), motionOK() ? 400 : 0);
  }
  function hidePanel() {
    if (!currentId) return;
    const id = currentId;

  /* routing: the hash is the single source of truth for the open detail */
  function syncRoute() {
    const id = location.hash.slice(1);
    if (META[id]) {
      if (view() === 'text') setView('drawing');
      if ((id === 'fleet' || id === 'ocr') && !isNarrow()) { hidePanel(); showTheater(id); }
      else { hideTheater(); showPanel(id); }
    } else { hidePanel(); hideTheater(); }
  }
  function openNode(id) {
    if (intro) return;
    if (location.hash === '#' + id) { showPanel(id); return; }
    pushedOpen = true;
    location.hash = id;
  }
  function closePanel() {
    if (pushedOpen) { pushedOpen = false; history.back(); return; }
    history.replaceState(null, '', location.pathname + location.search);
    hidePanel(); hideTheater();
  }
  addEventListener('hashchange', () => { if (!META[location.hash.slice(1)]) pushedOpen = false; syncRoute(); });
  document.getElementById('panel-close').addEventListener('click', closePanel);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (currentId || TH.open)) closePanel(); });

  /* ================= orchestration theater (sheet JM-002) ================= */
  // the architecture sheet shrinks into a left rail; a second sheet spawns the agent processes act by act
  const TW = 1120, THH = 660;
  const TH = { sheet: 'fleet', open: false, playing: false, t: 0, last: 0, raf: 0, run: 0, waits: [], frame: new Set(), act: 0, vault: null };
  const thEl = document.getElementById('theater');
  const thWorld = document.getElementById('th-world');
  const thWires = document.getElementById('th-wires');
  class Abort extends Error {}

  function thTick(now) {
    if (!TH.playing) return;
    TH.t += Math.min(64, now - TH.last); TH.last = now;
    const due = TH.waits.filter(w => TH.t >= w.at);
    if (due.length) { TH.waits = TH.waits.filter(w => TH.t < w.at); due.forEach(w => w.res()); }
    TH.frame.forEach(f => f(TH.t));
    TH.raf = requestAnimationFrame(thTick);
  }
  const sleep = ms => {
    const run = TH.run;
    return new Promise((res, rej) => TH.waits.push({ at: TH.t + ms, res: () => (run === TH.run ? res() : rej(new Abort())) }));
  };
  function thPlay() {
    if (TH.playing || !TH.open || document.hidden) return;
    TH.playing = true; TH.last = performance.now(); TH.raf = requestAnimationFrame(thTick);
  }
  function thPause() { TH.playing = false; cancelAnimationFrame(TH.raf); }
  function thAbort() { TH.run++; const w = TH.waits; TH.waits = []; w.forEach(x => x.res()); TH.frame.clear(); }

  /* ---- primitives: everything lives in a 1120 x 660 world that is scaled to the sheet ---- */
  const hex = n => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
  function box(cls, x, y, w, h, html) {
    const d = document.createElement('div');
    d.className = cls;
    Object.assign(d.style, { left: x + 'px', top: y + 'px' });
    if (w) d.style.width = w + 'px';
    if (h) d.style.height = h + 'px';
    d.innerHTML = html;
    thWorld.appendChild(d);
    return { el: d, x, y, w, h: h || 40 };
  }
  function pane(x, y, w, h, title, role, cls = '') {
    const p = box('th-pane th-spawn ' + cls, x, y, w, h,
      `<div class="th-head"><b>${esc(title)}</b><span class="th-role">${esc(role)}</span><span class="th-st">idle</span></div><div class="th-body"></div>`);
    p.body = p.el.querySelector('.th-body'); p.st = p.el.querySelector('.th-st'); p.wires = [];
    return p;
  }
  const busy = (p, on, label) => { p.st.textContent = label || (on ? 'working' : 'idle'); p.el.classList.toggle('lit', !!on); };
  const PRE = { cmd: '$ ', ok: '✓ ', bad: '✗ ', warn: '! ' };
  async function line(p, str, kind = 'out') {
    const d = document.createElement('div');
    d.className = 'l ' + kind;
    if (PRE[kind]) { const s = document.createElement('span'); s.className = 'pre'; s.textContent = PRE[kind]; d.appendChild(s); }
    const tx = document.createTextNode('');
    const cur = document.createElement('span'); cur.className = 'cursor';
    d.append(tx, cur);
    p.body.appendChild(d);
    p.body.scrollTop = p.body.scrollHeight;
    busy(p, true);
    if (kind === 'cmd') {
      await sleep(rnd(120, 420));
      for (const ch of str) { tx.data += ch; await sleep(rnd(8, 26) + (ch === ' ' && Math.random() < .1 ? rnd(60, 180) : 0)); }
    } else {
      await sleep(rnd(100, 320));
      for (let i = 0; i < str.length;) { const k = Math.round(rnd(2, 8)); tx.data += str.slice(i, i + k); i += k; await sleep(rnd(14, 55)); }
    }
    cur.remove();
    p.body.scrollTop = p.body.scrollHeight;
    busy(p, false);
    await sleep(rnd(80, 300));
    return d;
  }
  async function think(p, ms = rnd(700, 1900)) {
    const d = document.createElement('div'); d.className = 'l dim';
    p.body.appendChild(d); p.body.scrollTop = p.body.scrollHeight;
    busy(p, true);
    const t0 = TH.t;
    const upd = t => { d.textContent = `${SPIN[Math.floor(t / 80) % SPIN.length]} thinking${'.'.repeat(1 + Math.floor((t - t0) / 400) % 3)}`; };
    TH.frame.add(upd); upd(TH.t);
    try { await sleep(ms); } finally { TH.frame.delete(upd); d.remove(); busy(p, false); }
  }
  async function tests(p, label, n, ms = rnd(1100, 2400)) {
    const d = document.createElement('div'); d.className = 'l';
    p.body.appendChild(d); p.body.scrollTop = p.body.scrollHeight;
    busy(p, true);
    const t0 = TH.t, N = 14;
    const upd = t => {
      const f = Math.min(1, (t - t0) / ms), k = Math.round(f * N);
      d.innerHTML = `${esc(label)} <span class="bar">${'█'.repeat(k)}</span><span class="dim">${'░'.repeat(N - k)} ${Math.floor(f * n)}/${n}</span>`;
    };
    TH.frame.add(upd); upd(TH.t);
    try { await sleep(ms); } finally { TH.frame.delete(upd); }
    d.innerHTML = `<span class="pre">✓ </span>${esc(label)} · ${n} passed <span class="dim">in ${(ms / 1000 * rnd(1, 1.6)).toFixed(1)}s</span>`;
    d.className = 'l ok';
    busy(p, false);
    await sleep(rnd(150, 350));
  }
  function meter(p, pct) {
    const m = document.createElement('span'); m.className = 'th-ctx';
    m.innerHTML = '<span class="th-ctx-k">ctx</span><i><b></b></i><em></em>';
    p.st.before(m);
    p.el.classList.add('has-ctx');
    const set = v => { m.querySelector('b').style.width = v + '%'; m.querySelector('em').textContent = Math.round(v) + '%'; m.classList.toggle('hot', v >= 40); set.v = v; };
    set(pct);
    return set;
  }
  async function ramp(set, to, ms) {
    const from = set.v, t0 = TH.t;
    const upd = t => set(from + (to - from) * Math.min(1, (t - t0) / ms));
    TH.frame.add(upd);
    try { await sleep(ms); } finally { TH.frame.delete(upd); set(to); }
  }
  function chip(x, y, html, cls = '') { return box('th-chip th-spawn ' + cls, x, y, null, null, html); }
  function wake(c, html) {
    c.el.innerHTML = html;
    c.el.classList.remove('wake'); void c.el.offsetWidth; c.el.classList.add('wake');
  }
  // wires: drawn between the facing edges of two boxes
  function wire(a, b, cls = '') {
    const ca = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, cb = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    const horiz = Math.abs(cb.x - ca.x) > Math.abs(cb.y - ca.y) * 1.2;
    let p0, p1, d;
    if (horiz) {
      const s = Math.sign(cb.x - ca.x) || 1;
      p0 = [s > 0 ? a.x + a.w : a.x, ca.y]; p1 = [s > 0 ? b.x : b.x + b.w, cb.y];
      const mx = (p0[0] + p1[0]) / 2;
      d = `M${p0[0]} ${p0[1]} H${mx} V${p1[1]} H${p1[0]}`;
    } else {
      const s = Math.sign(cb.y - ca.y) || 1;
      p0 = [ca.x, s > 0 ? a.y + a.h : a.y]; p1 = [cb.x, s > 0 ? b.y : b.y + b.h];
      const my = (p0[1] + p1[1]) / 2;
      d = `M${p0[0]} ${p0[1]} V${my} H${p1[0]} V${p1[1]}`;
    }
    const g = el('g', { class: 'th-w ' + cls }, thWires);
    const path = el('path', { d, class: 'th-wire ' + cls }, g);
    const len = path.getTotalLength();
    path.animate([{ strokeDasharray: `${len} ${len}`, strokeDashoffset: len }, { strokeDasharray: `${len} ${len}`, strokeDashoffset: 0 }], { duration: 480, easing: 'cubic-bezier(.6, 0, .3, 1)' });
    el('circle', { cx: p0[0], cy: p0[1], r: 3, class: 'th-pin ' + cls }, g);
    el('circle', { cx: p1[0], cy: p1[1], r: 3, class: 'th-pin ' + cls }, g);
    const w = { g, path, len, cls };
    [a, b].forEach(n => n.wires && n.wires.push(w));
    return w;
  }
  function send(w, label, { back = false, cls = '', dur = rnd(780, 1100) } = {}) {
    const tok = document.createElement('div');
    tok.className = 'th-tok ' + (cls || w.cls);
    tok.textContent = label;
    thWorld.appendChild(tok);
    const t0 = TH.t;
    const upd = t => {
      const f = Math.min(1, (t - t0) / dur), q = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
      const pt = w.path.getPointAtLength((back ? 1 - q : q) * w.len);
      tok.style.transform = `translate(${pt.x}px, ${pt.y}px) translate(-50%, -50%)`;
      tok.style.opacity = Math.min(1, f * 7, (1 - f) * 7);
    };
    TH.frame.add(upd); upd(TH.t);
    return sleep(dur).finally(() => { TH.frame.delete(upd); tok.remove(); });
  }
  function reap(p, label = 'reaped') {
    p.el.classList.add('reaped');
    busy(p, false, label);
    p.wires.forEach(w => w.g.classList.add('dead'));
  }
  function gone(p) { p.el.classList.add('gone'); p.wires.forEach(w => w.g.classList.add('dead')); }
  // runs fn calls one after another, for the liaison that answers events in order
  const serial = () => { let q = Promise.resolve(); return fn => (q = q.then(fn)); };

  /* ---- the Obsidian vault: recall at the start of every act, a verified record at the end ---- */
  function vault() {
    if (TH.vault && TH.vault.el.isConnected) { TH.vault.wires = []; return TH.vault; }
    const v = box('th-vault th-spawn', 24, 478, 262, 160,
      `<div class="th-vh"><span class="th-stack"><i></i><i></i><i></i></span><b>Obsidian vault</b><span class="th-role">catalog</span></div><div class="th-vrows"></div>`);
    v.rows = v.el.querySelector('.th-vrows');
    v.wires = [];
    TH.vault = v;
    return v;
  }
  async function recall(p, query, src, excerpt) {
    await line(p, `recall "${query}"`, 'cmd');
    const w = wire(TH.vault, p, 'io');
    TH.vault.el.classList.add('reading');
    await send(w, 'READ', { cls: 'io' });
    TH.vault.el.classList.remove('reading');
    const c = box('th-card th-spawn', 300, 486, 300, null,
      `<span class="th-k">[[${esc(src)}]]</span><q>${esc(excerpt)}</q><span class="dim">cited excerpt · not a permission</span>`);
    await line(p, `1 cited excerpt · ${src.split('/')[0]}`, 'dim');
    setTimeout(() => c.el.classList.add('gone'), 2600);
    w.g.classList.add('dead');
  }
  async function writeBack(p, kind, note, refuse) {
    await line(p, `vault-log ${kind} --no-edit --json`, 'cmd');
    const w = wire(p, TH.vault, 'io');
    if (refuse) {
      await send(w, 'WRITE', { cls: 'io' });
      await send(w, 'REFUSED', { cls: 'hot', back: true });
      await line(p, `refused · ${refuse}`, 'warn');
      await line(p, 'add the field, write again', 'dim');
      await line(p, `vault-log ${kind} --no-edit --json`, 'cmd');
    }
    await send(w, 'WRITE', { cls: 'io' });
    const r = document.createElement('div');
    r.className = 'th-vrow';
    r.innerHTML = `<span class="th-vk">${esc(kind)}</span> ${esc(note)}<span class="th-vmeta"></span>`;
    TH.vault.rows.prepend(r);
    while (TH.vault.rows.children.length > 2) TH.vault.rows.lastChild.remove();
    TH.vault.el.classList.remove('bump'); void TH.vault.el.offsetWidth; TH.vault.el.classList.add('bump');
    const meta = r.querySelector('.th-vmeta');
    for (const part of [`uuid ${hex(6)}`, ' · indexed ✓']) { meta.textContent += part; await sleep(rnd(260, 480)); }
    await line(p, `{"tier":"${kind}","index":"indexed"}`, 'dim');
    w.g.classList.add('dead');
  }

  /* ---- act III: the Hayabusa fleet, one liaison and a crew in worktrees ---- */
  async function actFleet() {

  function letterHTML(kind, cont) {
    const bars = (n, w) => Array.from({ length: n }, (_, i) => `<i style="width:${w - (i * 17 % 28)}%"></i>`).join('');
    const inner = {
      header: cont ? '' : '<i class="pg-logo"></i>', address: cont ? '' : bars(4, 88), identifier: cont ? '' : esc(IDS[kind]),
      date: cont ? '' : bars(1, 100), title: bars(1, 100), paragraph: bars(9, 100), table: '', signature: bars(1, 70)
