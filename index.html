<style>
@font-face { font-family: "Osifont"; src: url("fonts/osifont-lgpl3fe.woff") format("woff"); font-display: swap; }
:root {
  --paper: #f2eee4;
  --paper-2: #e9e3d6;
  --ink: #1c1d1f;
  --ink-2: #4f5054;
  --ink-3: #6b6862;
  --grid: rgba(28, 29, 31, .05);
  --grid-major: rgba(28, 29, 31, .085);
  --signal: #c23f26;
  --node-fill: rgba(247, 244, 236, .94);
  --shadow: rgba(60, 45, 20, .16);
  --lit: rgba(194, 63, 38, .07);
  --cond: "IBM Plex Sans Condensed", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Arial Narrow", sans-serif;
  --mono: "IBM Plex Mono", "PingFang SC", ui-monospace, monospace;
  /* ISO 3098 drawing lettering for title block, zones and dimensions; CJK falls back to the sans */
  --iso: "Osifont", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", var(--cond);
  --serif: "Newsreader", "Songti SC", "Noto Serif SC", Georgia, serif;
  --u: 1px;
  color-scheme: light;
}
:root[data-theme="blueprint"] {
  --paper: #0f2a45;
  --paper-2: #123251;
  --ink: #e4ecf4;
  --ink-2: #b7c7d7;
  --ink-3: #8fa6bf;
  --grid: rgba(228, 236, 244, .055);
  --grid-major: rgba(228, 236, 244, .1);
  --signal: #ff8a5c;
  --node-fill: rgba(18, 48, 77, .94);
  --shadow: rgba(0, 0, 0, .35);
  --lit: rgba(255, 138, 92, .1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--cond);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font: inherit; color: inherit; }

/* ---------- sheet ---------- */
.frame { height: 100vh; height: 100dvh; padding: 14px; }
.stage { position: relative; width: 100%; height: 100%; }
#paper { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: hidden; }
.stage svg.tall { display: none; }

.overlay { position: absolute; transition: opacity .35s ease; z-index: 2; }
.panel-open .overlay { opacity: 0; pointer-events: none; }

.ident { left: calc(64 * var(--u)); top: calc(42 * var(--u)); }
.ident h1 {
  margin: 0;
  font-size: calc(48 * var(--u));
  font-weight: 600;
  letter-spacing: .08em;
  line-height: 1;
  text-transform: uppercase;
}
.ident p { margin: calc(8 * var(--u)) 0 0; font-size: calc(21 * var(--u)); font-weight: 500; }
.ident-ctl { display: flex; flex-wrap: wrap; gap: 6px 1.4em; margin-top: calc(16 * var(--u)); font-size: max(11px, calc(13.5 * var(--u))); }

.titleblock {
  right: calc(48 * var(--u)); bottom: calc(48 * var(--u));
  width: calc(540 * var(--u));
  font-size: max(11px, calc(13.5 * var(--u)));
  border: 1.5px solid var(--ink);
  background: var(--paper);
  display: grid;
  grid-template-columns: repeat(12, 1fr);
}
.tb-cell { grid-column: span 4; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: .45em .7em .5em; min-width: 0; }
.tb-cell.end { border-right: 0; }
.sheet-end { display: none; }
/* shown only while the opening drawing plays */
.skip-hint { position: fixed; left: 50%; bottom: 6px; transform: translateX(-50%); margin: 0; font-family: var(--iso); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.stage.intro .skip-hint { opacity: 1; transition-delay: .5s; }
.tb-label { display: block; font-family: var(--iso); font-size: max(10px, .72em); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: .2em; }
.tb-mono { font-family: var(--iso); font-size: 1.05em; }
.tb-num { grid-column: span 3; }
.tb-num strong { display: block; font-family: var(--mono); font-weight: 500; font-size: 1.1em; letter-spacing: -.01em; color: var(--signal); white-space: nowrap; }
.tb-num span { font-size: max(10.5px, .78em); color: var(--ink-2); line-height: 1.25; display: block; margin-top: .15em; }
.tb-links { grid-column: span 12; display: flex; padding: 0; border-right: 0; }
.tb-links a {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  min-height: max(44px, 2.6em);
  text-decoration: none;
  font-weight: 500; letter-spacing: .08em; text-transform: uppercase; font-size: max(11px, .9em);
  border-right: 1px solid var(--ink);
}
.tb-links a:last-child { border-right: 0; }
.tb-links a:hover, .tb-links a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.tb-controls {
  grid-column: span 12; border: 0;
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px 1.4em; padding: 8px .7em;
}
.ctl { display: flex; align-items: center; gap: .5em; }
.seg-label { font-size: max(11px, .72em); letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.seg { display: flex; align-items: center; border: 1px solid var(--ink); }
.seg button {
  position: relative;
  height: max(32px, 2.2em); min-width: 4.4em; padding: 0 .7em;
  border: 0; background: none; cursor: pointer;
  font-size: max(11px, .82em); letter-spacing: .1em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center;
}
.seg button + button { border-left: 1px solid var(--ink); }
.seg button::after { content: ""; position: absolute; inset: -3px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.revisions {
  right: calc(48 * var(--u)); top: calc(42 * var(--u));
  width: calc(480 * var(--u));
  font-size: max(11px, calc(12.5 * var(--u)));
  border: 1.5px solid var(--ink);
  background: var(--paper);
  border-collapse: collapse;
}
.revisions caption { font-family: var(--iso); text-align: left; font-size: max(10px, .78em); letter-spacing: .14em; color: var(--ink-3); padding: 0 0 .3em; caption-side: top; text-transform: uppercase; }
.revisions th, .revisions td { border: 1px solid var(--ink); padding: .3em .55em; text-align: left; font-weight: 400; vertical-align: top; }
.revisions th { font-family: var(--iso); font-size: max(10px, .76em); letter-spacing: .12em; color: var(--ink-3); text-transform: uppercase; }
.revisions td:nth-child(1), .revisions td:nth-child(2) { font-family: var(--iso); white-space: nowrap; }
.revisions tr.cur td:first-child { color: var(--signal); font-weight: 500; }
/* language corner: the sheet's bottom-left corner lifts on hover; a click turns the page */
.curl {
  position: fixed; left: 0; bottom: 0; z-index: 6; width: 58px; height: 58px; padding: 0; border: 0; background: none; cursor: pointer;
  transition: width .55s cubic-bezier(.2, .8, .2, 1), height .55s cubic-bezier(.2, .8, .2, 1), opacity .4s ease;
  -webkit-tap-highlight-color: transparent;
}
.curl:focus-visible { width: 172px; height: 172px; outline: none; }
@media (hover: hover) and (pointer: fine) { .curl:hover { width: 172px; height: 172px; } }
.curl.turning { opacity: 0; transition: none; }
.curl-under { position: absolute; inset: 0; clip-path: polygon(0 0, 0 100%, 100% 100%); background: linear-gradient(to top right, var(--paper) 0 36%, color-mix(in srgb, #000 9%, var(--paper)) 50%); }
.curl-flap { position: absolute; inset: 0; filter: drop-shadow(1px -1px 1.5px var(--shadow)); }
.curl-flap::before {
  content: ""; position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 100% 100%);
  /* the back of the sheet: flat paper, only slightly darker at the crease */
  background:
    linear-gradient(to bottom, color-mix(in srgb, var(--ink) 30%, transparent) 0 1px, transparent 1px),
    linear-gradient(to left, color-mix(in srgb, var(--ink) 30%, transparent) 0 1px, transparent 1px),
    linear-gradient(to top right, color-mix(in srgb, #000 14%, var(--paper-2)) 50%, color-mix(in srgb, #000 4%, var(--paper-2)) 55%, var(--paper-2) 80%);
}
.curl-label { position: absolute; left: 6px; bottom: 6px; text-align: left; color: var(--signal); font-family: var(--cond); font-weight: 600; font-size: 11px; letter-spacing: .06em; line-height: 1; transition: font-size .5s cubic-bezier(.2, .8, .2, 1), left .5s ease, bottom .5s ease; }
.curl-label small { display: block; font-family: var(--cond); font-weight: 600; font-size: 15px; letter-spacing: .08em; color: var(--signal); letter-spacing: 0; color: var(--ink-3); margin-top: 6px; white-space: nowrap; opacity: 0; transform: translateY(4px); transition: opacity .3s ease .15s, transform .3s ease .15s; }
.curl:focus-visible .curl-label { left: 11px; bottom: 10px; }
.curl-label svg { display: block; width: 20px; height: 20px; fill: var(--signal); transition: width .5s cubic-bezier(.2, .8, .2, 1), height .5s cubic-bezier(.2, .8, .2, 1); }
.curl:focus-visible .curl-label svg { width: 46px; height: 46px; }
.curl:focus-visible .curl-label small { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) {
  .curl:hover .curl-label { left: 11px; bottom: 10px; }
  .curl:hover .curl-label svg { width: 46px; height: 46px; }
  .curl:hover .curl-label small { opacity: 1; transform: none; }
}
.curl:focus-visible .curl-flap::before { outline: 2px solid var(--signal); }
#page-flap { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 30; view-transition-name: page-flap; }
#page-flap .pf-back { filter: drop-shadow(-5px 7px 9px rgba(0, 0, 0, .28)); }
html.vt-turn::view-transition-old(root) { clip-path: var(--peel); z-index: 1; }
html.vt-turn::view-transition-new(root) { z-index: 0; }
::view-transition-group(page-flap), ::view-transition-new(page-flap) { animation: none; }

/* magnifier */
.loupe { opacity: 0; transition: opacity .18s ease; pointer-events: none; }
.loupe.on { opacity: 1; filter: drop-shadow(0 14px 22px var(--shadow)); }
.loupe-bg { fill: var(--paper); }
.loupe-ring { fill: none; stroke: var(--ink); stroke-width: 2.2; }
.loupe-ring2 { fill: none; stroke: var(--signal); stroke-width: .8; }
.loupe-tick { stroke: var(--ink); stroke-width: 1; }
.loupe-read { fill: var(--signal); font-family: var(--mono); font-size: 11px; text-anchor: middle; }
.stage.magnifying { cursor: none; }

/* exploded view */
@property --ax { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --az { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --sway { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@property --sc { syntax: '<number>'; inherits: true; initial-value: 1; }
@property --tx { syntax: '<length>'; inherits: true; initial-value: 0px; }
@property --ty { syntax: '<length>'; inherits: true; initial-value: 0px; }
.node.exploded { opacity: 0 !important; }
.explode { position: absolute; inset: 0; z-index: 3; pointer-events: none; transition: opacity .35s ease; }
.explode.gone { opacity: 0; }
.ex-scene { position: absolute; inset: 0; perspective: 1900px; }
.ex-iso {
  position: absolute; transform-style: preserve-3d; --px: 0deg; --pz: 0deg;
  transform: translate(var(--tx), var(--ty)) rotateX(calc(var(--ax) + var(--px))) rotateZ(calc(var(--az) + var(--sway) + var(--pz))) scale(var(--sc));
  transition: --ax 1.15s cubic-bezier(.7, 0, .2, 1), --az 1.15s cubic-bezier(.7, 0, .2, 1), --sc 1.15s cubic-bezier(.7, 0, .2, 1), --tx 1.15s cubic-bezier(.7, 0, .2, 1), --ty 1.15s cubic-bezier(.7, 0, .2, 1);
}
.explode.open .ex-iso { --ax: 57deg; --az: -36deg; --sc: var(--k); --tx: var(--dx); --ty: var(--dy); animation: sway 11s ease-in-out 1.4s infinite alternate; }
@keyframes sway { from { --sway: 0deg; } to { --sway: 10deg; } }
.plate { position: absolute; inset: 0; transform-style: preserve-3d; transform: translate3d(0, 0, calc(var(--i) * 1px)) scale3d(1, 1, 1) rotateZ(0deg) rotateX(0deg) scaleZ(.02); transition: transform 1.1s cubic-bezier(.2, .85, .25, 1) calc(.45s + var(--i) * 90ms); }
.explode.open .plate { transform: var(--open); }
.ex-orbit { position: absolute; border: 1px dashed var(--ink-3); border-radius: 50%; opacity: 0; transition: opacity .4s ease 1.1s; }
.explode.open .ex-orbit { opacity: .9; }
/* model primitives: a box is a top face plus the front and right walls that face the viewer */
.explode { --ex-line: color-mix(in srgb, var(--ink) 32%, transparent); }
.pp, .pw, .pp > i { position: absolute; }
.pp { transform-style: preserve-3d; }
.ft { inset: 0; border: 1.5px solid var(--ink); background-color: var(--node-fill); }
.ft.h { background-image: repeating-linear-gradient(45deg, transparent 0 9px, var(--grid-major) 9px 10px); }
.ft.ln { background-image: repeating-linear-gradient(transparent 0 7px, var(--ex-line) 7px 8px); background-size: 72% 70%; background-position: 50% 60%; background-repeat: no-repeat; }
.ft.gr { background-image: linear-gradient(var(--ex-line) 1px, transparent 1px), linear-gradient(90deg, var(--ex-line) 1px, transparent 1px); background-size: 13px 13px; }
.ft.dt { background-image: radial-gradient(circle, var(--ink-3) 1.2px, transparent 1.7px); background-size: 12px 12px; }
.ft.gl { box-shadow: inset 0 0 0 7px var(--node-fill), inset 0 0 0 8px var(--ink); }
.ft.sg, .pw.sg { border-color: var(--signal); }
.ft.disc { border-radius: 50%; }
.ff { left: 0; top: 100%; width: 100%; transform-origin: 50% 0; transform: rotateX(90deg); background: var(--ink-2); }
.ff.rk { background-image: repeating-linear-gradient(transparent 0 5px, var(--node-fill) 5px 6px); }
.fr { left: 100%; top: 0; height: 100%; transform-origin: 0 50%; transform: rotateY(-90deg); background: var(--ink); }
.fs { transform-origin: 50% 0; background: var(--ink-2); }
.gh > .ft { background: none; border-style: dashed; }
.gh > .ff, .gh > .fr { background: none; border: 1px dashed var(--ink-2); }
.pw { transform-origin: 50% 100%; border: 1.5px solid var(--ink); background: var(--node-fill); }
.pw.bare { border: 0; background: none; }
.ex-iso svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; fill: none; stroke: var(--ink); stroke-width: 1.2; }
.ex-iso svg * { vector-effect: non-scaling-stroke; }
.ex-iso svg .s { stroke: var(--signal); stroke-width: 1.5; }
.ex-iso svg .m { stroke: var(--ink-3); stroke-width: 1; }
.ex-iso svg .f { fill: var(--node-fill); }
.ex-shell { position: absolute; inset: 0; border: 1.5px solid var(--ink); background: repeating-linear-gradient(45deg, transparent 0 9px, var(--grid-major) 9px 10px), var(--node-fill); transition: opacity .5s ease .35s; }
.explode.open .ex-shell { opacity: 0; }
.pl-no { position: absolute; left: 14px; top: 10px; font-family: var(--mono); font-size: 14px; color: var(--signal); }
.pl-tag { display: none; }
.pl-anchor { position: absolute; width: 1px; height: 1px; }
.ex-labels { position: absolute; inset: 0; pointer-events: none; }
.ex-label {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  font-family: var(--mono); font-size: 13px; padding: 5px 9px; background: var(--paper); border: 1px solid var(--ink); color: var(--ink);
  opacity: 0; transition: opacity .4s ease calc(1.3s + var(--i) * 90ms);
}
.ex-label::after { content: ""; position: absolute; left: 100%; top: 50%; width: var(--lead, 28px); border-top: 1px solid var(--ink); transform-origin: 0 0; transform: rotate(var(--ang, 0rad)); }
.ex-label::before { content: ""; position: absolute; left: 100%; top: 50%; width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; border-radius: 50%; background: var(--ink); transform-origin: 2.5px 2.5px; transform: rotate(var(--ang, 0rad)) translateX(var(--lead, 28px)); }
.explode.open .ex-label { opacity: 1; }
.ex-axis { position: absolute; left: 50%; top: 50%; width: 0; border-left: 1px dashed var(--signal); transform-origin: top center; transform: rotateX(90deg); opacity: 0; transition: opacity .4s ease 1.1s; }
.explode.open .ex-axis { opacity: .9; }
.ex-caption { position: absolute; left: calc(64 * var(--u)); bottom: calc(52 * var(--u)); font-family: var(--mono); font-size: 12px; letter-spacing: .16em; color: var(--ink-3); opacity: 0; transition: opacity .4s ease 1.3s; }
.explode.open .ex-caption { opacity: 1; }
.explode.instant .ex-iso, .explode.instant .plate, .explode.instant .ex-shell, .explode.instant .ex-label, .explode.instant .ex-axis, .explode.instant .ex-orbit, .explode.instant .ex-caption { transition: none; }
.compact .pl-no { display: none; }
.compact .ex-caption { left: 12px; bottom: 10px; }
.ex-host { position: relative; margin: 6px 0 22px; border: 1px solid var(--ink); overflow: hidden; background: var(--paper-2); }

/* svg drawing */
.grid-minor { stroke: var(--grid); }
.grid-major { stroke: var(--grid-major); }
.border-outer { fill: none; stroke: var(--ink); stroke-width: 2.2; }
.border-inner { fill: none; stroke: var(--ink); stroke-width: .8; }
.zone { fill: var(--ink-3); font-family: var(--iso); font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
.zone-tick { stroke: var(--ink); stroke-width: .8; }
.hdr-sub { fill: var(--ink-3); font-family: var(--mono); font-size: 13px; letter-spacing: .06em; }
.hdr-lede { fill: var(--ink-2); font-family: var(--serif); font-style: italic; font-size: 20px; }
html:lang(zh) .hdr-lede, html:lang(zh) .panel .lede { font-style: normal; }
.notes-title { fill: var(--ink-3); font-size: 12px; letter-spacing: .16em; font-weight: 500; }
.notes-line { fill: var(--ink-2); font-family: var(--mono); font-size: 13px; }
.notes-rule { stroke: var(--ink); stroke-width: .8; }

.edge { fill: none; stroke: var(--ink); stroke-width: 1.3; }
.edge.dashed { stroke-dasharray: 7 5; stroke: var(--ink-2); }
.edge-head { fill: var(--ink); }
.edge-label-bg { fill: var(--paper); }
.edge-label { fill: var(--ink-2); font-family: var(--mono); font-size: 13px; letter-spacing: .03em; text-anchor: middle; dominant-baseline: middle; }
.packet { fill: var(--signal); }

.node { cursor: pointer; outline: none; }
.node-shadow { fill: var(--shadow); }
.node-box { fill: var(--node-fill); stroke: var(--ink); stroke-width: 1.4; transition: stroke-width .2s ease; }
.node-hit { fill: transparent; }
.node-title { fill: var(--ink); font-size: 23px; font-weight: 600; letter-spacing: .05em; }
.node-title.big { font-size: 27px; }
.node-sub { fill: var(--ink-2); font-family: var(--mono); font-size: 14px; }
.node-tag { fill: var(--signal); font-size: 12px; font-weight: 600; letter-spacing: .14em; }
.hatch-fill { opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.hatch-line { stroke: var(--ink-3); stroke-width: .7; }
.balloon circle { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; transition: fill .2s ease; }
.balloon text { fill: var(--ink); font-family: var(--mono); font-size: 12px; text-anchor: middle; dominant-baseline: central; }
.leader { stroke: var(--ink); stroke-width: .8; fill: none; }
.detail-ring circle, .detail-ring path { fill: none; stroke: var(--signal); stroke-width: 1.1; stroke-dasharray: 1; animation: cs-draw .8s cubic-bezier(.4, 0, .2, 1) .15s both; }
.detail-ring path { animation-delay: .8s; animation-duration: .3s; }
.detail-ring-t { fill: var(--signal); font-family: var(--iso); font-size: 13px; letter-spacing: .1em; animation: cs-fade .3s ease 1s both; }
.dims { opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.dim-line { stroke: var(--signal); stroke-width: .8; fill: none; }
.dim-head { fill: var(--signal); }
.dim-text { fill: var(--signal); font-family: var(--iso); font-size: 12.5px; text-anchor: middle; dominant-baseline: middle; }
.dim-bg { fill: var(--paper); }
.fold { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 2; }
.node:hover .node-box, .node:focus-visible .node-box, .node.active .node-box { stroke-width: 2.6; }
.node:hover .hatch-fill, .node:focus-visible .hatch-fill { opacity: .55; }
.node:hover .balloon circle, .node:focus-visible .balloon circle, .node.active .balloon circle { fill: var(--signal); }
.node:hover .balloon text, .node:focus-visible .balloon text, .node.active .balloon text { fill: #fff; }
.node:focus-visible .node-box { stroke: var(--signal); }
@media (hover: hover) and (pointer: fine) {
  .node:hover .dims { opacity: 1; }
}
.pending { opacity: 0; }
.node-sub, .node-tag { transition: opacity .3s ease; }
.node.active .node-sub, .node.active .node-tag { opacity: 0; }
.dimmable { transition: opacity .45s ease; }
.focusing .dimmable:not(.active) { opacity: .14; }
.revealed { transition: opacity .35s ease; }

.contour { fill: none; stroke: var(--ink-3); stroke-width: .9; }
.contour.index { stroke: var(--ink-2); stroke-width: 1.3; }
.trail { fill: none; stroke: var(--signal); stroke-width: 1.6; stroke-dasharray: 2 5; stroke-linecap: round; }
.summit { fill: var(--signal); }

.pen { pointer-events: none; }
.pen circle { fill: none; stroke: var(--signal); stroke-width: 1.4; }
.pen line { stroke: var(--signal); stroke-width: 1; }
.pen .nib { fill: var(--signal); stroke: none; transition: opacity .2s ease; }
.pen circle:not(.nib) { transition: r .25s ease, stroke-dasharray .25s ease; }
.pen.up .nib { opacity: 0; }
.pen.up circle:not(.nib) { r: 11px; stroke-dasharray: 3 2.4; }
.pen.parked { opacity: 0; transition: opacity .45s ease; }

.guides { pointer-events: none; opacity: 0; transition: opacity .2s ease; }
.guides.on { opacity: 1; }
.guide { stroke: var(--signal); stroke-width: .7; stroke-dasharray: 3 4; opacity: .55; }
.guide-read { fill: var(--signal); font-family: var(--mono); font-size: 11px; }
.guide-read-bg { fill: var(--paper); stroke: var(--signal); stroke-width: .7; }

#world { transform-origin: 0 0; transform-box: view-box; transition: transform .8s cubic-bezier(.65, 0, .25, 1); }
.fade-in { opacity: 0; animation: fade .6s ease forwards; }
@keyframes fade { to { opacity: 1; } }

/* theme change: diazo-copier scan from left to right */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html.vt-scan::view-transition-new(root) {
  -webkit-mask-image: linear-gradient(90deg, #000 0 46%, rgba(0, 0, 0, .35) 49%, transparent 54%);
  mask-image: linear-gradient(90deg, #000 0 46%, rgba(0, 0, 0, .35) 49%, transparent 54%);
  -webkit-mask-size: 220% 100%; mask-size: 220% 100%;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  animation: scan 1.1s cubic-bezier(.6, 0, .3, 1) both;
}
@keyframes scan { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
html.vt-fade::view-transition-old(root) { animation: vt-out .25s ease both; }
html.vt-fade::view-transition-new(root) { animation: vt-in .35s ease both; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; } }

/* ---------- detail panel ---------- */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(560px, 100vw);
  background: var(--paper);
  border-left: 1.5px solid var(--ink);
  transform: translateX(102%);
  transition: transform .6s cubic-bezier(.65, 0, .25, 1);
  overflow-y: auto;
  z-index: 10;
  font-family: var(--serif);
  box-shadow: -18px 0 40px -24px var(--shadow);
}
.panel.open { transform: none; }
.panel:not(.open) { visibility: hidden; transition: transform .6s cubic-bezier(.65, 0, .25, 1), visibility 0s .6s; }
.panel-head {
  position: sticky; top: 0; z-index: 1;
  background: var(--paper);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--ink);
  padding: 0 0 0 28px;
  font-family: var(--cond);
}
.panel-kicker { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); letter-spacing: .08em; }
.panel-close {
  height: 52px; min-width: 104px;
  border: 0; border-left: 1px solid var(--ink);
  background: none; cursor: pointer;
  font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
}
.panel-close:hover, .panel-close:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.panel-body { padding: 28px 28px 56px; }
.panel h2 { font-family: var(--cond); font-weight: 600; font-size: 34px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 12px; line-height: 1.05; }
.panel h2:focus { outline: none; }
.panel .lede { font-size: 20px; line-height: 1.45; color: var(--ink-2); margin: 0 0 8px; font-style: italic; }
.panel h3 {
  font-family: var(--cond); font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 500; margin: 30px 0 10px;
  display: flex; align-items: center; gap: 10px;
}
.panel h3::after { content: ""; flex: 1; border-top: 1px solid var(--ink-3); opacity: .5; }
.panel p, .panel li { font-size: 17px; line-height: 1.55; }
.panel ul { padding-left: 1.1em; margin: 0; }
.panel li + li { margin-top: 6px; }
.numbers { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
.numbers div { padding: 12px 14px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.numbers strong { display: block; font-family: var(--mono); font-weight: 500; font-size: 23px; color: var(--signal); }
.numbers span { font-family: var(--cond); font-size: 14px; color: var(--ink-2); line-height: 1.3; display: block; margin-top: 4px; }
.note { font-family: var(--mono); font-size: 12.5px !important; color: var(--ink-3); }
.panel-contact { margin-top: 44px; border: 1px solid var(--ink); font-family: var(--cond); }
.panel-contact > span { display: block; padding: 8px 14px; border-bottom: 1px solid var(--ink); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }
.panel-contact nav { display: flex; }
.panel-contact a { flex: 1; min-height: 46px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; border-right: 1px solid var(--ink); }
.panel-contact a:last-child { border-right: 0; }
.panel-contact a:hover, .panel-contact a:focus-visible { background: var(--ink); color: var(--paper); outline: none; }

/* fleet replay */
.fleet { border: 1px solid var(--ink); display: grid; grid-template-columns: 1fr 1fr; background: var(--paper-2); }
.fleet { position: relative; }
.pane { position: relative; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); display: flex; flex-direction: column; min-width: 0; transition: background-color .3s ease; }
.pane.lit { background: var(--lit); }
.tok {
  position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none;
  font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .18em;
  padding: 6px 10px 6px 12px; background: var(--paper); border: 1.5px solid var(--signal); color: var(--signal);
  box-shadow: 4px 4px 0 var(--shadow); opacity: 0; will-change: transform;
}
.stamp {
  position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; opacity: 0;
  display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-top: 1.5px solid var(--ink); background: var(--paper);
  font-family: var(--mono); font-size: 11px; color: var(--ink-2); white-space: nowrap;
}
.stamp b { font-family: var(--cond); font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
.stamp i { font-style: normal; color: var(--signal); }
.pane:nth-child(2n) { border-right: 0; }
.pane.wide { grid-column: span 2; border-right: 0; border-bottom: 0; }
.pane-head { font-family: var(--cond); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-bottom: 1px solid var(--ink); display: flex; align-items: center; justify-content: space-between; }
.pane-state { font-family: var(--mono); font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.pane-state.busy { color: var(--signal); }
.pane-body { font-family: var(--mono); font-size: 12px; line-height: 1.6; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; height: calc(7 * 1.6em + 16px); overflow: hidden; }
.pane-body .ok { color: var(--signal); }
.pane-body .dim { color: var(--ink-3); }
.pane-body .bad { color: var(--signal); font-weight: 600; }
.pane-body .cursor { display: inline-block; width: .55em; height: 2px; vertical-align: -.15em; background: var(--ink-2); }
.replay-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 12px; }
.btn {
  height: 44px; min-width: 104px; padding: 0 16px;
  border: 1px solid var(--ink); background: none; cursor: pointer;
  font-family: var(--cond); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn:hover, .btn:focus-visible { background: var(--ink); color: var(--paper); outline: none; }

/* change sheet */
.change-sheet { margin: 0; }
.change-sheet svg { display: block; width: 100%; height: auto; }
.cs-frame { fill: var(--node-fill); stroke: var(--ink); stroke-width: 1.5; }
.cs-rule { stroke: var(--ink); stroke-width: 1; fill: none; }
.cs-rule.dashed { stroke-dasharray: 5 4; stroke: var(--ink-3); }
.cs-box { fill: var(--paper); stroke: var(--ink); stroke-width: 1.1; }
.cs-box.cs-hot { stroke: var(--signal); stroke-width: 1.6; }
.cs-line { stroke: var(--ink); stroke-width: 1; fill: none; }
.cs-title { font-family: var(--cond); font-size: 13px; font-weight: 600; letter-spacing: .1em; fill: var(--ink); }
.cs-tag { font-family: var(--cond); font-size: 11px; letter-spacing: .16em; fill: var(--signal); font-weight: 600; }
.cs-txt { font-family: var(--mono); font-size: 11px; fill: var(--ink); }
.cs-dim { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-3); }
.cs-ms { font-family: var(--mono); font-size: 12px; fill: var(--signal); font-weight: 500; }
.cs-cloud { fill: none; stroke: var(--signal); stroke-width: 1; }
.cs-tri { fill: var(--paper); stroke: var(--signal); stroke-width: 1.2; }
.cs-tri-t { font-family: var(--iso); font-size: 11px; fill: var(--signal); }
.cs-note { font-size: 11px; }
.change-sheet .rv-a, .change-sheet .rv-b, .change-sheet .rv-cloud { transition: opacity .35s ease; }
.change-sheet[data-rev="a"] .rv-b, .change-sheet[data-rev="b"] .rv-a, .change-sheet:not([data-rev="ab"]) .rv-cloud { opacity: 0; }
/* overlay: Rev A stays underneath as a faint dashed ghost */
.change-sheet[data-rev="ab"] .rv-a { opacity: .5; }
.change-sheet[data-rev="ab"] .rv-a .cs-box, .change-sheet[data-rev="ab"] .rv-a .cs-line { stroke: var(--ink-3); stroke-dasharray: .02 .015; }
.change-sheet[data-rev="ab"] .rv-a text { fill: var(--ink-3); }
.change-sheet.draw:not([data-rev="a"]) .rv-b .d { stroke-dasharray: 1; animation: cs-draw 1.1s cubic-bezier(.4, 0, .2, 1) both; }
.change-sheet .rv-cloud .cs-cloud { stroke-dasharray: 6 4; }
.change-sheet.draw[data-rev="ab"] .rv-cloud .cs-cloud { animation: cs-fade .4s ease .9s both; }
.change-sheet.draw[data-rev="ab"] .rv-cloud text, .change-sheet.draw[data-rev="ab"] .rv-cloud .cs-tri { animation: cs-fade .4s ease 1.8s both; }
@keyframes cs-fade { from { opacity: 0; } }
@keyframes cs-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
/* figures in the detail panel */
.fig { margin: 24px 0 0; }
.fig svg, .places svg { display: block; width: 100%; height: auto; }
.aq-p { fill: var(--paper); stroke: var(--ink); stroke-width: 1; transition: fill .2s ease, stroke .2s ease, opacity .2s ease; }
.aq-l { stroke: var(--ink-3); stroke-width: 1; fill: none; }
.aq-k { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; }
.aq.use .aq-p { fill: var(--ink-3); }
.aq.use .aq-k { fill: var(--ink); }
.aq.trap .aq-p { stroke: var(--signal); stroke-width: 1.6; }
.aq.trap .aq-l { stroke: var(--signal); stroke-dasharray: 3 2; }
.aq.trap .aq-k { stroke: var(--signal); }
.aq.fut { opacity: .4; }
.aq-fog { opacity: .7; }
.aq-cut-l { stroke: var(--signal); stroke-width: 1.6; }
.aq-cut-t { font-family: var(--iso); font-size: 12px; fill: var(--signal); letter-spacing: .06em; }
.aq-sw { stroke: var(--ink); stroke-width: .8; fill: var(--paper); }
.aq-sw.use { fill: var(--ink-3); }
.aq-sw.trap { stroke: var(--signal); stroke-width: 1.4; }
.aq-trap-t { fill: var(--signal); }
.aq-ctl { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-family: var(--iso); font-size: 12px; letter-spacing: .08em; color: var(--ink-3); }
.aq-range { flex: 1; accent-color: var(--signal); }
.id-reg { stroke: var(--ink-3); stroke-width: .7; stroke-dasharray: 2 3; }
.id-hatch { stroke: var(--signal); stroke-width: 1; }
.id-idle { stroke: var(--signal); stroke-width: .8; }
.id-work { fill: var(--grid-major); stroke: none; }
.id-curve { fill: none; stroke: var(--ink); stroke-width: 1.4; }
.id-lead { stroke: var(--signal); stroke-width: 1; fill: none; }
.id-lbl { font-size: 11px; }
.fig .d { stroke-dasharray: 1; animation: cs-draw 1.4s cubic-bezier(.4, 0, .2, 1) .2s both; }
.places { margin: 4px 0 14px; }
.places svg { margin-top: 8px; }
.sec { display: none; }
.places[data-place="0"] .sec-0, .places[data-place="1"] .sec-1, .places[data-place="2"] .sec-2 { display: inline; }
.photos[data-place="0"] figure:not([data-p="0"]), .photos[data-place="1"] figure:not([data-p="1"]), .photos[data-place="2"] figure:not([data-p="2"]) { display: none; }
.sec-line { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.sec-cut { opacity: .55; }
.places.draw .sec-line { stroke-dasharray: 1; animation: cs-draw 1.1s cubic-bezier(.4, 0, .2, 1) both; }
.place-tabs button span { color: var(--signal); margin-left: .3em; }
.place-tabs button[aria-pressed="true"] span { color: var(--paper); }
.rev-switch { display: flex; gap: 0; margin-top: 8px; }
.rev-switch button { font-family: var(--iso); font-size: 12px; letter-spacing: .08em; background: var(--paper); color: var(--ink-2); border: 1px solid var(--ink); padding: 5px 12px; cursor: pointer; margin-left: -1px; }
.rev-switch button:first-child { margin-left: 0; }
.rev-switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.rev-switch button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.repo-link { margin: 18px 0 0; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photos figure { margin: 0; }
.photos img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; object-fit: cover; border: 1px solid var(--ink); }
.photos a { display: block; }
.photos a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.photos figcaption { font-family: var(--cond); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding-top: 6px; display: flex; gap: 8px; }
.photos figcaption span { font-family: var(--mono); color: var(--ink-3); letter-spacing: 0; }

.mini { display: none; }

/* ---------- text mode ---------- */
@media screen { .textmode p, .textmode li { max-width: 58ch; } }
.textmode { display: none; max-width: 780px; margin: 0 auto; padding: 48px 20px 80px; font-family: var(--serif); }
body.is-text .frame { display: none; }
body.is-text .textmode { display: block; }
.tm-head { border-bottom: 1.5px solid var(--ink); padding-bottom: 18px; margin-bottom: 8px; }
.tm-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.tm-controls { display: flex; gap: 10px; flex-wrap: wrap; }
.textmode h1 { font-family: var(--cond); font-size: 44px; letter-spacing: .06em; text-transform: uppercase; margin: 0; line-height: 1; font-weight: 600; }
.textmode h1:focus { outline: none; }
.textmode .role { font-family: var(--cond); font-size: 19px; margin: 6px 0 0; }
.textmode .contact { font-family: var(--mono); font-size: 13px; margin: 10px 0 0; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.textmode .contact a { text-decoration: none; border-bottom: 1px solid var(--ink-3); }
.textmode h2 { font-family: var(--cond); font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 34px 0 10px; }
.textmode h3 { font-family: var(--cond); font-size: 21px; margin: 18px 0 4px; font-weight: 600; letter-spacing: .02em; }
.textmode .meta { font-family: var(--mono); font-size: 12.5px; color: var(--ink-3); margin: 0 0 6px; }
.textmode p, .textmode li { font-size: 17.5px; line-height: 1.55; }
.textmode ul { padding-left: 1.1em; }
.textmode h4 { font-family: var(--cond); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 12px 0 0; }
.part-no { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; margin-right: .45em; border: 1px solid var(--ink); border-radius: 50%; font: 500 .62em var(--mono); color: var(--ink); text-decoration: none; vertical-align: .18em; }
a.part-no:hover, a.part-no:focus-visible { background: var(--signal); border-color: var(--signal); color: #fff; outline: none; }
.part-ev b { font-family: var(--cond); font-size: .8em; letter-spacing: .12em; text-transform: uppercase; color: var(--signal); font-weight: 600; margin-right: .3em; }
.textmode .proof { list-style: none; padding: 0; border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); display: grid; grid-template-columns: repeat(4, 1fr); }
.textmode .proof li { padding: 10px 12px; font-family: var(--cond); font-size: 14px; line-height: 1.3; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
.textmode .proof strong { display: block; font-family: var(--mono); font-weight: 500; color: var(--signal); font-size: 19px; margin-bottom: 2px; }
.textmode dl { display: grid; grid-template-columns: 11em 1fr; gap: 6px 16px; margin: 0; }
.textmode dt { font-family: var(--cond); font-weight: 600; font-size: 15px; padding-top: 2px; }
.textmode dd { margin: 0; font-size: 16.5px; line-height: 1.45; }

/* ---------- narrow: stacked column ---------- */
@media (max-width: 1024px), (max-height: 719px) {
  .frame { height: auto; padding: 16px; }
  .stage { height: auto; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  #paper { display: none; }
  .stage svg { position: static; }
  .stage svg.wide { display: none; }
  .stage svg.tall { display: block; height: auto; }
  .overlay { position: static; width: auto; }
  .ident { order: -2; }
  .titleblock { order: -1; }
  .ident h1 { font-size: 34px; }
  .ident p { font-size: 18px; margin-top: 6px; }
  .titleblock { font-size: 13px; width: auto; }
  .tb-num { grid-column: span 6; }
  .tb-num strong { font-size: 1.1em; }
  .tb-num.n0, .tb-num.n2 { border-right: 1px solid var(--ink); }
  .tb-num.n1, .tb-num.n3 { border-right: 0; }
  .ident-ctl { font-size: 13px; margin-top: 14px; }
  .tb-links a { min-height: 44px; }
  .seg button { height: 44px; }
  .seg button::after { display: none; }
  .revisions { order: 3; width: 100%; font-size: 13px; }
  #titleblock > .tb-cell:nth-child(-n+3), #titleblock .tb-controls { display: none; }
  #titleblock .tb-links { order: -1; }
  .sheet-end { display: grid; order: 4; margin-bottom: 52px; }
  .explode.desk { display: none; }
  .panel-open .overlay { opacity: 1; }
  .panel { border-left: 0; }
  .fleet { grid-template-columns: 1fr; }
  .pane { border-right: 0; }
  .pane.wide { grid-column: auto; }
  .mini {
    display: flex; align-items: center; justify-content: space-between;
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    background: var(--paper); border-bottom: 1.5px solid var(--ink);
    padding: 0 0 0 16px; font-family: var(--cond);
    transform: translateY(-100%); transition: transform .3s ease;
  }
  .mini.show { transform: none; }
  .mini strong { letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .mini nav { display: flex; }
  .mini a { min-height: 44px; min-width: 88px; display: flex; align-items: center; justify-content: center; text-decoration: none; border-left: 1px solid var(--ink); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 500; }
  body.is-text .mini { display: none; }
  .textmode .proof { grid-template-columns: repeat(2, 1fr); }
  .textmode dl { grid-template-columns: 1fr; gap: 2px; }
  .textmode dd { margin-bottom: 8px; }
}
@media (min-width: 1025px) and (min-height: 720px) {
  .panel h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}

:root.no-motion *, :root.no-motion *::before, :root.no-motion *::after { animation: none !important; transition: none !important; }
:root.no-motion .fade-in, :root.no-motion .pending { opacity: 1; }

/* ---------- orchestration theater: sheet JM-002 ---------- */
.frame { transform-origin: 0 0; transition: transform .9s cubic-bezier(.65, 0, .25, 1); }
body.theater-open { overflow: hidden; }
body.theater-open .frame { position: relative; z-index: 7; pointer-events: none; }
.th { position: fixed; inset: 0; z-index: 6; visibility: hidden; transition: visibility 0s .9s; --rail: 300px; --maph: 200px; }
.th.open { visibility: visible; transition: none; }
.th-rail { position: absolute; left: 0; top: 0; bottom: 0; width: var(--rail); background: var(--paper-2); border-right: 1.5px solid var(--ink); opacity: 0; transition: opacity .5s ease; }
.th.open .th-rail { opacity: 1; }
.th-back { position: absolute; left: 14px; top: 14px; width: calc(var(--rail) - 28px); height: var(--maph); border: 1px solid var(--ink); background: none; cursor: zoom-out; padding: 0; }
.th-back span { position: absolute; left: 0; top: calc(100% + 10px); font-family: var(--cond); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.th-back:hover, .th-back:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
.th-acts { position: absolute; left: 14px; right: 14px; top: calc(var(--maph) + 62px); border-bottom: 1px solid var(--ink); }
.th-acts button {
  display: grid; grid-template-columns: 2.6em 1fr auto; align-items: center; width: 100%; min-height: 46px; padding: 0 10px;
  border: 0; border-top: 1px solid var(--ink); background: none; cursor: pointer; text-align: left;
  font-family: var(--cond); font-size: 15px; letter-spacing: .1em; text-transform: uppercase;
}
.th-acts button span { font-family: var(--mono); font-size: 12px; color: var(--signal); letter-spacing: 0; }
.th-rec { grid-column: 2 / -1; font-family: var(--mono); font-size: 11.5px; line-height: 1.35; letter-spacing: 0; text-transform: none; color: var(--ink-3); padding: 0 0 8px; animation: th-in .3s ease both; }
.th-rec:empty { display: none; }
.th-acts button[aria-current="true"] .th-rec { color: var(--paper); opacity: .8; }
.th-acts button:hover { background: var(--lit); }
.th-acts button:focus-visible { outline: 2px solid var(--signal); outline-offset: -3px; }
.th-acts button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.th-acts button[aria-current="true"] span { color: var(--paper); }
.th-note { position: absolute; left: 14px; right: 14px; bottom: 16px; margin: 0; font-family: var(--serif); font-style: italic; font-size: 14px; line-height: 1.4; color: var(--ink-3); }
.th-sheet {
  position: absolute; left: calc(var(--rail) + 14px); right: 14px; top: 14px; bottom: 14px;
  border: 1.5px solid var(--ink); outline: 1px solid var(--ink); outline-offset: -9px;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
  clip-path: inset(0 0 0 100%); transition: clip-path .85s cubic-bezier(.65, 0, .25, 1) .2s;
}
.th.open .th-sheet { clip-path: inset(-14px); }
.th-hdr { position: absolute; left: 28px; right: 28px; top: 22px; display: flex; align-items: center; gap: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
.th-no { font-family: var(--cond); font-weight: 600; font-size: 46px; line-height: 1; color: var(--signal); min-width: 1.7em; }
.th-ttl { font-family: var(--cond); font-weight: 600; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; }
.th-cap { font-family: var(--serif); font-style: italic; font-size: 16.5px; line-height: 1.35; color: var(--ink-2); max-width: 80ch; margin-top: 2px; }
.th-hdr.swap .th-no, .th-hdr.swap .th-ttl, .th-hdr.swap .th-cap { animation: reletter .65s cubic-bezier(.4, 0, .2, 1) both; }
.th-hdr.swap .th-cap { animation-delay: .12s; }
@keyframes reletter { from { clip-path: inset(0 100% 0 0); opacity: .3; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.th-live { flex: none; height: 40px; padding: 0 14px; display: flex; align-items: center; border: 1px solid var(--ink-3); font-family: var(--mono); font-size: 12px; letter-spacing: .06em; white-space: nowrap; color: var(--ink-2); }
.th-hdr > div:not(.th-live) { flex: 1; min-width: 0; }
.th-close { flex: none; white-space: nowrap; height: 40px; padding: 0 16px; border: 1px solid var(--ink); background: none; cursor: pointer; font-family: var(--cond); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
.th-close:hover, .th-close:focus-visible { background: var(--ink); color: var(--paper); outline: none; }
.th-area { position: absolute; left: 18px; right: 18px; top: 116px; bottom: 46px; }
.th-world { position: absolute; left: 0; top: 0; width: 1120px; height: 660px; transform-origin: 0 0; }
.th-tb { position: absolute; right: 28px; bottom: 16px; display: flex; font-family: var(--iso); font-size: 12px; color: var(--ink-3); border: 1px solid var(--ink); background: var(--paper); }
.th-tb span { padding: 3px 10px; }
.th-tb span + span { border-left: 1px solid var(--ink); }

.th-wires { position: absolute; left: 0; top: 0; width: 1120px; height: 660px; overflow: visible; pointer-events: none; }
.th-wire { fill: none; stroke: var(--ink); stroke-width: 1.4; transition: opacity .5s ease; }
.th-wire.io { stroke: var(--signal); stroke-dasharray: 5 5; }
.th-wire.hand { stroke: var(--signal); stroke-width: 2; }
.th-w { transition: opacity .5s ease; }
.th-w.dead { opacity: .14; }
.th-pin { fill: var(--paper); stroke: var(--ink); stroke-width: 1.3; }
.th-pin.io, .th-pin.hand { stroke: var(--signal); }
.th-trunk { fill: none; stroke: var(--ink); stroke-width: 2.4; }
.th-trunk-t { font: 13px var(--mono); fill: var(--ink-3); text-anchor: end; }
.th-branch { fill: none; stroke: var(--ink-3); stroke-width: 1.4; transition: stroke .4s ease; }
.th-branch.merged { stroke: var(--signal); stroke-width: 2; }
.th-commit { fill: var(--signal); }

.th-pane {
  position: absolute; display: flex; flex-direction: column; border: 1.5px solid var(--ink); background: var(--node-fill);
  box-shadow: 6px 6px 0 var(--shadow); font-family: var(--mono); font-size: 13px; transition: background-color .3s ease, opacity .5s ease;
}
.th-pane.lit { background: color-mix(in srgb, var(--signal) 8%, var(--node-fill)); }
.th-head { display: flex; align-items: center; gap: 8px; padding: 5px 9px; border-bottom: 1px solid var(--ink); font-family: var(--cond); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; min-width: 0; }
.th-head { overflow: hidden; }
.th-head b { flex: none; font-weight: 600; }
.th-pane.has-ctx .th-ctx-k { display: none; }
.th-pane.has-ctx .th-ctx i { width: 44px; }
.th-role { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--ink-3); font-family: var(--mono); font-size: 12px; letter-spacing: 0; text-transform: none; }
.th-st { margin-left: auto; min-width: 7ch; flex: none; text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.th-pane.lit .th-st { color: var(--signal); }
.th-body { flex: 1; overflow: hidden; padding: 7px 10px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.th-body .l { min-height: 1.55em; }
.pbar { display: inline-block; position: relative; width: 9em; height: .62em; border: 1px solid var(--ink-3); vertical-align: -.02em; }
.pbar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--signal); }
.pcount { display: inline-block; text-align: right; font-variant-numeric: tabular-nums; }
.pane-body .l, .th-body .l { white-space: pre-wrap; }
.th-body .pre, .th-body .dim, .th-body .l.dim { color: var(--ink-3); }
.th-body .l.ok .pre, .th-body .bar { color: var(--signal); }
.th-body .l.bad { color: var(--signal); font-weight: 600; }
.th-body .l.bad .pre, .th-body .l.warn .pre { color: var(--signal); }
.th-body .l.warn { color: var(--signal); font-style: italic; }
.th-body .cursor { display: inline-block; width: .55em; height: 2px; vertical-align: -.15em; background: var(--ink-2); }
.th-spec { outline: 1px solid var(--ink); outline-offset: 3px; }
.th-pane.has-ctx .th-role { display: none; }
.th-ctx { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--ink-3); }
.th-ctx + .th-st { margin-left: 8px; }
.th-ctx i { position: relative; display: block; width: 56px; height: 7px; border: 1px solid var(--ink); }
.th-ctx i b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.th-ctx i::after { content: ""; position: absolute; left: 40%; top: -4px; bottom: -4px; border-left: 1.5px solid var(--signal); }
.th-ctx em { font-style: normal; min-width: 4ch; text-align: right; font-variant-numeric: tabular-nums; }
.th-ctx.hot i b { background: var(--signal); }
.th-ctx.hot em { color: var(--signal); font-weight: 500; }

.th-spawn { animation: th-spawn .6s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes th-spawn { 0% { clip-path: inset(50% 50% 50% 50%); opacity: .2; } 55% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(-24px -24px -24px -24px); opacity: 1; } }
.th-pane.reaped { opacity: .45; border-style: dashed; box-shadow: none; }
.th-pane.reaped .th-body { opacity: .4; }
.th-pane.gone, .th-chip.gone, .th-card.gone, .th-page.gone { animation: th-gone .5s ease forwards; }
@keyframes th-gone { from { clip-path: inset(-24px); } to { clip-path: inset(50% 50% 50% 50%); opacity: 0; } }

.th-tok {
  position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; white-space: nowrap; will-change: transform;
  font: 600 11px var(--cond); letter-spacing: .16em; padding: 4px 9px; background: var(--paper); color: var(--ink);
  border: 1.5px solid var(--ink); box-shadow: 3px 3px 0 var(--shadow);
}
.th-tok.io, .th-tok.hot { border-color: var(--signal); color: var(--signal); }
.th-tok.io { border-style: dashed; }
.th-tok.hand { background: var(--signal); border-color: var(--signal); color: var(--paper); }
.th-chip { position: absolute; border: 1px solid var(--ink); background: var(--paper); padding: 5px 10px; font-family: var(--mono); font-size: 12.5px; white-space: nowrap; box-shadow: 3px 3px 0 var(--shadow); }
.th-chip b { font-weight: 500; color: var(--signal); }
.th-chip.sleeping::before { content: "◌ "; color: var(--ink-3); }
.th-chip.wake { animation: th-wake .8s ease; border-color: var(--signal); }
@keyframes th-wake { from { box-shadow: 0 0 0 0 var(--signal); } to { box-shadow: 0 0 0 18px transparent; } }
.th-chip.hot, .th-chip.bad { border-color: var(--signal); color: var(--signal); }
.th-chip.clock { font-size: 13px; }
.th-card { position: absolute; z-index: 3; display: grid; gap: 2px; border: 1.5px solid var(--signal); background: var(--paper); padding: 8px 11px; font-family: var(--mono); font-size: 12.5px; line-height: 1.45; box-shadow: 4px 4px 0 var(--shadow); }
.th-card .th-k { color: var(--signal); }
.th-card q { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink); quotes: "“" "”"; }
.th-card .dim { color: var(--ink-3); }

.th-vault { overflow: hidden; position: absolute; border: 1.5px solid var(--signal); background: var(--node-fill); box-shadow: 6px 6px 0 var(--shadow); font-family: var(--mono); font-size: 12px; }
.th-vh { display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-bottom: 1px solid var(--signal); font-family: var(--cond); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.th-vh b { font-weight: 600; color: var(--signal); }
.th-stack { position: relative; flex: none; width: 20px; height: 18px; }
.th-stack i { position: absolute; width: 12px; height: 14px; border: 1.2px solid var(--signal); background: var(--paper); }
.th-stack i:nth-child(1) { left: 0; top: 4px; }
.th-stack i:nth-child(2) { left: 4px; top: 2px; }
.th-stack i:nth-child(3) { left: 8px; top: 0; }
.th-vault.reading .th-stack i { animation: th-flip .4s ease infinite alternate; }
.th-vault.reading .th-stack i:nth-child(2) { animation-delay: .13s; }
.th-vault.reading .th-stack i:nth-child(3) { animation-delay: .26s; }
@keyframes th-flip { to { transform: translateY(-4px) rotate(-8deg); } }
.th-vault.bump { animation: th-bump .55s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes th-bump { 40% { transform: translateY(-6px); } }
.th-vrows { display: grid; gap: 6px; padding: 7px 9px; }
.th-vrow { line-height: 1.4; animation: th-in .4s ease both; }
.th-vk { color: var(--signal); }
.th-vmeta { display: block; overflow-wrap: anywhere; color: var(--ink-3); }
@keyframes th-in { from { opacity: 0; transform: translateY(-6px); } }

.th-gauge { position: absolute; border: 1.5px solid var(--ink); background: var(--node-fill); box-shadow: 6px 6px 0 var(--shadow); }
.th-gauge svg { display: block; width: 100%; height: 150px; }
.g-arc { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.g-tick { stroke: var(--ink); stroke-width: 1.2; }
.g-t { font: 600 14px var(--cond); fill: var(--ink-3); text-anchor: middle; dominant-baseline: middle; letter-spacing: .06em; transition: fill .3s ease; }
.g-t.on { fill: var(--signal); font-size: 19px; }
.g-needle { stroke: var(--signal); stroke-width: 2.6; stroke-linecap: round; transform-box: view-box; transform-origin: 125px 128px; transform: rotate(-90deg); transition: transform .32s cubic-bezier(.3, 1.5, .5, 1); }
.g-hub { fill: var(--signal); }
.g-lbl { position: absolute; left: 0; right: 0; bottom: 7px; text-align: center; font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.th-pipe { position: absolute; display: flex; align-items: center; padding: 0 14px; border: 1.5px solid var(--ink); background: var(--node-fill); box-shadow: 6px 6px 0 var(--shadow); font-family: var(--mono); font-size: 13px; }
.th-pipe span { padding: 6px 10px; border: 1px solid var(--ink-3); color: var(--ink-3); }
.th-pipe i { flex: 1; border-top: 1px dashed var(--ink-3); }
.th-pipe span.run { border-color: var(--signal); color: var(--signal); }
.th-pipe span.done { border-color: var(--ink); color: var(--ink); background: var(--lit); }
.th-pipe span.done::before { content: "✓ "; color: var(--signal); }
.th-bracket { position: absolute; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 10px; border: 1.5px solid var(--ink); background: var(--node-fill); box-shadow: 6px 6px 0 var(--shadow); font-family: var(--mono); font-size: 12.5px; }
.b-col { display: flex; flex-direction: column; justify-content: space-around; gap: 6px; }
.b-col span { border: 1px solid var(--ink-3); padding: 3px 6px; text-align: center; }
.b-col span.on { border-color: var(--signal); color: var(--signal); font-weight: 500; box-shadow: 3px 3px 0 var(--shadow); }

/* fleet node: live badge that invites a click */
.live-ants { fill: none; stroke: var(--signal); stroke-width: 1.4; stroke-dasharray: 7 6; animation: ants .9s linear infinite; opacity: .85; }
@keyframes ants { to { stroke-dashoffset: -13; } }
.live-pane { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
.live-bar { fill: var(--signal); transform-box: fill-box; transform-origin: left center; animation: typebar 1.3s steps(5) infinite; }
@keyframes typebar { 0% { transform: scaleX(.1); } 70%, 100% { transform: scaleX(1); } }
.node[data-node="fleet"]:hover .live-bar, .node[data-node="fleet"]:focus-visible .live-bar { animation-duration: .45s; }
.node[data-node="fleet"]:hover .live-ants, .node[data-node="fleet"]:focus-visible .live-ants { stroke-width: 2.4; }

/* sign-off row: replaces rubber stamps with a ruled approval strip */
.th-pane { outline: 1px solid transparent; outline-offset: 14px; transition: background-color .3s ease, opacity .5s ease, outline-offset .6s cubic-bezier(.2, .8, .2, 1), outline-color .6s ease; }
.th-pane.signed { outline-color: var(--ink); outline-offset: 3px; }
.th-pane.signed .th-body { margin-bottom: 27px; }
.th-sign { position: absolute; left: 0; right: 0; bottom: 0; height: 27px; display: flex; align-items: stretch; background: var(--paper); font-family: var(--mono); font-size: 12px; white-space: nowrap; overflow: hidden; }
.th-sign::before { content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 1.5px solid var(--ink); transform-origin: left; animation: th-rule .45s cubic-bezier(.6, 0, .3, 1) both; }
@keyframes th-rule { from { transform: scaleX(0); } }
.th-tick { flex: none; width: 27px; padding: 6px; fill: none; stroke: var(--signal); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; animation: th-draw .35s ease .4s forwards; }
@keyframes th-draw { to { stroke-dashoffset: 0; } }
.th-sign span { display: flex; align-items: center; padding: 0 9px; border-left: 1px solid var(--ink); color: var(--ink-2); opacity: 0; animation: th-cell .25s ease both; animation-delay: calc(.55s + var(--i) * .16s); }
.th-sign span:first-of-type { font-family: var(--cond); font-weight: 600; letter-spacing: .16em; color: var(--ink); }
.th-sign span:last-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@keyframes th-cell { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.th-lockic svg { display: block; width: 11px; height: 13px; fill: none; stroke: var(--ink-2); stroke-width: 1.3; }

/* OCR sheet: synthetic letters, layout boxes, routing rows */
.th-page { position: absolute; overflow: hidden; container-type: inline-size; background: #fbfaf6; border: 1px solid #a9a59c; box-shadow: 4px 5px 0 var(--shadow); }
.th-page.inline { position: relative; width: 100%; aspect-ratio: 1 / 1.414; box-shadow: none; }
.pg-b { position: absolute; display: flex; flex-direction: column; justify-content: space-between; gap: 1px; }
.pg-b i { display: block; height: 1.3cqw; min-height: 1px; background: #c3bfb5; }
.pg-header i.pg-logo { width: 55%; height: 100%; background: #8f8b83; }
.pg-identifier { justify-content: center; font: 500 3.4cqw/1 var(--mono); color: #1c1d1f; white-space: nowrap; overflow: hidden; }
.pg-title i { height: 2.4cqw; background: #8f8b83; }
.pg-table { border: 1px solid #c3bfb5; background: repeating-linear-gradient(#c3bfb5 0 1px, transparent 1px 25%), repeating-linear-gradient(90deg, #c3bfb5 0 1px, transparent 1px 33.33%); }
.th-page.scanning::before { content: ""; position: absolute; left: 0; right: 0; height: 8%; z-index: 2; background: linear-gradient(transparent, rgba(194, 63, 38, .3)); border-bottom: 1.5px solid #c23f26; animation: th-scan .9s linear infinite; }
@keyframes th-scan { from { top: -8%; } to { top: 100%; } }
.lb { position: absolute; z-index: 1; border: 1.5px solid #c23f26; background: rgba(194, 63, 38, .07); animation: lb-in .3s ease both; }
.lb::after { content: attr(data-l); position: absolute; left: -1.5px; bottom: 100%; padding: 0 .8cqw; background: #c23f26; color: #fff; font: 600 3.4cqw/1.35 var(--cond); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.lb.ev { background: rgba(194, 63, 38, .16); }
.lb.ev::after, .th-page.thumb .lb::after { display: none; }
@keyframes lb-in { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(-40px); } }
.th-tag { position: absolute; right: 4px; top: 4px; z-index: 2; padding: 1px 6px; background: #1c1d1f; color: #fbfaf6; font: 600 11px var(--cond); letter-spacing: .12em; text-transform: uppercase; }
.th-cut { stroke: var(--signal); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.th-brace { fill: none; stroke: var(--ink-3); stroke-width: 1.2; }
.th-brace-t { font: 12px var(--mono); fill: var(--ink-2); text-anchor: middle; }
.th-wire.ev { stroke: var(--signal); stroke-width: 1.2; }
.th-w.dim { opacity: .35; }
.th-node { position: absolute; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1.5px solid var(--ink); background: var(--node-fill); box-shadow: 4px 4px 0 var(--shadow); font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.th-node b { font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
.th-node em { margin-left: auto; font-style: normal; color: var(--signal); font-weight: 500; }
.th-node.head { border-width: 0 0 1.5px; background: none; box-shadow: none; padding: 0; }
.th-node.off { opacity: .5; border-style: dashed; box-shadow: none; }
.th-node.off b { text-decoration: line-through; }
.th-node.manual { border-color: var(--signal); }
.th-node.hit { animation: th-hit .7s ease; }
@keyframes th-hit { from { background: color-mix(in srgb, var(--signal) 24%, var(--node-fill)); } }
.th-node.loop { flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; white-space: normal; }
.th-node.field { display: grid; grid-template-columns: 92px 1fr auto; grid-template-rows: auto 3px; column-gap: 10px; row-gap: 6px; align-content: center; }
.th-node.field b { font-size: 12.5px; }
.th-node.field .v { font-family: var(--mono); font-size: 13.5px; color: var(--ink); }
.th-node.field .cf { grid-column: 1 / -1; position: relative; height: 3px; background: var(--grid-major); }
.th-node.field .cf s { position: absolute; left: 0; top: 0; bottom: 0; background: var(--signal); transition: width .6s ease; }
.th-node.field em { grid-row: 1; grid-column: 3; color: var(--ink-3); font-weight: 400; }

.th-node.gate { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 3px; padding: 8px 12px; white-space: normal; }
.th-node.gate > span { color: var(--ink-3); }
.th-node.gate ol { display: grid; gap: 3px; margin: 3px 0 0; padding: 0; list-style: none; }
.th-node.gate li { display: flex; justify-content: space-between; gap: 10px; animation: th-in .3s ease both; }
.th-node.gate li code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12.5px var(--mono); color: var(--ink); }
.th-node.gate li span { flex: none; }
.th-node.gate li span::before { content: "✓ "; color: var(--ink-3); }
.th-node.gate li.ask span, .th-node.gate li.ask span::before { color: var(--signal); }
.th-node.gate li.ask span::before { content: "? "; }
.th-node.gate li.no span { color: var(--signal); font-weight: 600; }
.th-node.gate li.no span::before { content: "✗ "; }
.th-card code { font: 12px var(--mono); color: var(--ink); }
.th-card.void { opacity: .6; }
.th-card.void code { text-decoration: line-through; }

/* OCR sheet: the review workstation */
.th-app { position: absolute; display: flex; flex-direction: column; overflow: hidden; border: 1.5px solid var(--ink); background: var(--paper); box-shadow: 8px 8px 0 var(--shadow); font-family: var(--cond); }
.ap-bar { display: flex; align-items: center; gap: 6px; height: 30px; flex: none; padding: 0 12px; border-bottom: 1px solid var(--ink); background: var(--paper-2); font: 12px var(--mono); color: var(--ink-3); }
.ap-bar i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--ink-3); }
.ap-bar span { margin-left: 10px; }
.ap-nav { position: relative; align-self: flex-end; display: grid; grid-template-columns: repeat(3, 124px); margin: 12px 16px 0; border: 1px solid var(--ink); flex: none; }
.ap-nav span { position: relative; z-index: 1; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 13.5px; letter-spacing: .04em; color: var(--ink-2); transition: color .3s ease; }
.ap-nav span.on { color: var(--paper); }
.ap-ind { position: absolute; left: 0; top: 0; bottom: 0; width: 124px; background: var(--ink); transition: transform .45s cubic-bezier(.3, .9, .3, 1); }
.ap-view { flex: 1; min-height: 0; padding: 14px 16px 16px; }
.ap-view.swap { animation: ap-in .4s ease both; }
@keyframes ap-in { from { opacity: 0; transform: translateY(6px); } }
.ap-toast { position: absolute; right: 18px; bottom: 18px; padding: 9px 14px; background: var(--ink); color: var(--paper); font: 12px var(--mono); opacity: 0; transform: translateY(8px); transition: opacity .3s ease, transform .3s ease; }
.ap-toast.on { opacity: 1; transform: none; }
.ap-review { display: grid; grid-template-columns: 250px 300px 1fr; gap: 16px; }
.ap-list { align-self: start; border: 1px solid var(--ink); }
.ap-row { display: grid; grid-template-columns: 1fr auto; row-gap: 2px; padding: 9px 11px; border-bottom: 1px solid var(--grid-major); font: 12px var(--mono); }
.ap-row:last-child { border-bottom: 0; }
.ap-row.on { background: var(--lit); box-shadow: inset 3px 0 0 var(--signal); }
.ap-row b { font-weight: 500; color: var(--ink); }
.ap-row span { color: var(--ink-3); }
.ap-row em { grid-column: 1 / -1; font: 12.5px var(--cond); letter-spacing: .03em; }
.th-app em { font-style: normal; }
.th-app em.ok { color: var(--ink); }
.th-app em.ok::before { content: "● "; color: var(--ink-2); }
.th-app em.todo::before { content: "○ "; }
.th-app em.doubt { color: var(--signal); }
.th-app em.doubt::before { content: "◐ "; }
.ap-pdf { align-self: start; padding: 10px; border: 1px solid var(--ink); background: var(--paper-2); }
.ap-side { display: flex; flex-direction: column; gap: 10px; }
.ap-fact { display: grid; grid-template-columns: 1fr auto; padding: 9px 12px; border: 1px solid var(--ink); transition: background-color .2s ease, box-shadow .2s ease; }
.ap-fact span { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.ap-fact b { grid-column: 1; font: 500 15px var(--mono); color: var(--ink); }
.ap-fact a { grid-row: 1 / 3; grid-column: 2; align-self: center; font: 11px var(--mono); color: var(--signal); text-decoration: underline dotted; }
.ap-fact.look { background: var(--lit); box-shadow: inset 3px 0 0 var(--signal); }
.ap-actions { display: flex; gap: 10px; margin-top: 6px; }
.ap-actions button { position: relative; isolation: isolate; height: 40px; padding: 0 18px; border: 1px solid var(--ink); background: none; overflow: hidden; cursor: default; font: 500 14px var(--cond); letter-spacing: .04em; }
.ap-actions .ap-hold { background: var(--ink); color: var(--paper); }
.ap-hold::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; z-index: -1; width: var(--p, 0%); background: var(--signal); }
.ap-hold.done::before { width: 0; }
.ap-pin { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding: 10px 14px; border: 1px solid var(--signal); box-shadow: inset 3px 0 0 var(--signal); font: 12.5px var(--mono); }
.ap-pin b { font: 600 12px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--signal); }
.ap-pin em { margin-left: auto; }
.ap-mx { width: 100%; border-collapse: collapse; font: 12.5px var(--mono); }
.ap-mx th, .ap-mx td { border: 1px solid var(--ink); padding: 8px 10px; text-align: center; }
.ap-mx th { font: 500 11px var(--cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.ap-mx td:first-child, .ap-mx th:first-child { text-align: left; }
.ap-mx td.miss { color: var(--signal); background: var(--lit); font-weight: 600; }
.ap-note { margin: 10px 0 0; font: italic 14px var(--serif); color: var(--ink-3); }
.ap-batch { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 18px; padding: 12px 14px; border: 1px solid var(--ink); font: 12.5px var(--mono); }
.ap-batch b { font: 600 14px var(--cond); letter-spacing: .06em; }
.ap-batch.open { background: var(--lit); box-shadow: inset 3px 0 0 var(--signal); }
.ap-kids { margin-left: 22px; border-left: 1px solid var(--ink); }
.ap-kid { display: grid; grid-template-columns: 30px 210px 110px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--grid-major); font: 12.5px var(--mono); animation: th-in .3s ease both; }
.ap-kid a { font-size: 11px; color: var(--signal); text-decoration: underline dotted; }
.th-cursor { position: absolute; z-index: 30; pointer-events: none; transition: left .75s cubic-bezier(.45, 0, .2, 1), top .75s cubic-bezier(.45, 0, .2, 1); }
.th-cursor svg { display: block; width: 18px; height: 22px; fill: var(--ink); stroke: var(--paper); stroke-width: 1.2; transform-origin: 0 0; transition: transform .12s ease; }
.th-cursor.click svg { transform: scale(.82); }

/* ================= phones and short windows ================= */
:root { --on-signal: #fff; --signal-t: #b93a22; }
/* red text on the tinted panes and on the change sheet needs the darker red to hold 4.5:1 at phone sizes */
.th.m, .change-sheet.tall { --signal: var(--signal-t); }
:root[data-theme="blueprint"] { --on-signal: #0f2a45; --signal-t: #ff8a5c; }

/* ---------- scroll-plotted system diagram (tall sheet) ---------- */
#svg-tall.sp .node { transition: opacity .3s ease var(--d, 0s), transform .55s cubic-bezier(.16, 1, .3, 1) var(--d, 0s); transform-box: fill-box; transform-origin: 50% 50%; }
#svg-tall.sp .node:not(.in) { opacity: 0; transform: translateY(12px) scale(.985); pointer-events: none; }
#svg-tall.sp .node .node-shadow { transition: transform .5s cubic-bezier(.34, 1.56, .64, 1) calc(var(--d, 0s) + .16s); }
#svg-tall.sp .node:not(.in) .node-shadow { transform: translate(-6px, -6px); }
#svg-tall.sp .node .balloon { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .3s cubic-bezier(.34, 1.56, .64, 1) calc(var(--d, 0s) + .34s); }
#svg-tall.sp .node:not(.in) .balloon { transform: scale(0); }
#svg-tall.sp .sp-f { transition: opacity .35s ease; }
#svg-tall.sp .sp-f:not(.in) { opacity: 0; }
#svg-tall.sp-set .node, #svg-tall.sp-set .node *, #svg-tall.sp-set .sp-f { transition: none !important; }
.sp-pen { transition: opacity .3s ease; }
.sp-pen.off { opacity: 0; }
/* one small live detail per project; it runs only while its node is on screen */
.mm { pointer-events: none; }
#svg-tall .node:not(.vis) .mm *, #svg-tall .node:not(.vis) .live *,
.panel-open #svg-tall .mm *, .panel-open #svg-tall .live *, html.thm-lock #svg-tall .mm *, html.thm-lock #svg-tall .live * { animation-play-state: paused; }
.mm-t { font: 500 11px var(--mono); fill: var(--ink-2); text-anchor: end; }
.mm-t.s { fill: var(--signal-t); }
.mm-l { stroke: var(--ink-3); stroke-width: 1; fill: none; }
.mm-b { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
.mm-b.s { stroke: var(--signal); }
.mm-s { fill: var(--signal); }
.mm-k { fill: var(--ink-3); }
.mm-lat .a { opacity: 0; animation: mm-a 4.4s linear infinite; }
.mm-lat .b { animation: mm-b 4.4s linear infinite; }
.mm-lat .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(.05); animation: mm-bar 4.4s cubic-bezier(.16, 1, .3, 1) infinite; }
@keyframes mm-a { 0%, 44% { opacity: 1; } 48%, 100% { opacity: 0; } }
@keyframes mm-b { 0%, 44% { opacity: 0; } 48%, 100% { opacity: 1; } }
@keyframes mm-bar { 0%, 40% { transform: scaleX(1); } 56%, 100% { transform: scaleX(.05); } }
.mm-pages g { transform-box: fill-box; transform-origin: 0 100%; animation: mm-flip 3.6s cubic-bezier(.4, 0, .2, 1) infinite; }
@keyframes mm-flip { 0%, 52% { transform: none; opacity: 1; } 70% { transform: translate(15px, -4px) rotate(9deg); opacity: 0; } 71% { transform: translate(-9px, 3px); opacity: 0; } 90%, 100% { transform: none; opacity: 1; } }
.mm-call circle { animation: mm-call 1.6s cubic-bezier(.76, 0, .24, 1) infinite alternate; }
@keyframes mm-call { from { transform: translateX(0); } to { transform: translateX(34px); } }
.mm-cut .cut { stroke: var(--signal); stroke-width: 1.4; transform: translateX(38px); animation: mm-cut 5.6s cubic-bezier(.76, 0, .24, 1) infinite alternate; }
.mm-cut .fog { fill: var(--node-fill); opacity: .82; transform-box: fill-box; transform-origin: right center; transform: scaleX(.4); animation: mm-fog 5.6s cubic-bezier(.76, 0, .24, 1) infinite alternate; }
@keyframes mm-cut { from { transform: translateX(6px); } to { transform: translateX(58px); } }
@keyframes mm-fog { from { transform: scaleX(.906); } to { transform: scaleX(.094); } }
.mm-env .e { animation: mm-eph 3.2s steps(1) infinite; }
@keyframes mm-eph { 0%, 30% { opacity: 1; } 31%, 100% { opacity: .14; } }

@media (max-width: 1024px), (max-height: 719px) { .tb-num strong { font-variant-numeric: tabular-nums; } }

/* ---------- exploded view in the narrow panel: numbered layers, a parts list, drag to turn ---------- */
.ex-view { position: relative; height: 300px; overflow: hidden; touch-action: pan-y; cursor: grab; -webkit-user-select: none; user-select: none; }
.ex-view:focus-visible { outline: 2px solid var(--signal); outline-offset: -3px; }
.compact.open .ex-iso { animation: none; }
.compact.live .plate { transition: translate .32s cubic-bezier(.16, 1, .3, 1); }
.compact .plate.hot { translate: 0 0 calc(var(--gap) * .3); }
.compact.pick .plate:not(.hot) .ft, .compact.pick .plate:not(.hot) .pw { border-color: var(--ink-3); }
.compact .plate.hot .ft, .compact .plate.hot .pw:not(.bare) { border-color: var(--signal); }
.compact .ex-caption { color: var(--ink-2); font-size: 11px; letter-spacing: .12em; }
.compact .ex-label { display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 11px; line-height: 1; }
.compact .ex-label.hot { background: var(--signal); border-color: var(--signal); color: var(--on-signal); }
.ex-parts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); background: var(--paper); }
.ex-parts li { margin: 0 !important; min-width: 0; border-bottom: 1px solid var(--grid-major); }
.ex-parts li:nth-child(odd) { border-right: 1px solid var(--grid-major); }
.ex-parts button, .ex-parts .row { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 5px 9px; border: 0; background: none; cursor: pointer; text-align: left; font: 11.5px/1.25 var(--mono); color: var(--ink); }
.ex-parts b { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid var(--ink); border-radius: 50%; font-weight: 400; font-size: 11px; }
.ex-parts button[aria-pressed="true"] { background: var(--lit); }
.ex-parts button[aria-pressed="true"] b { background: var(--signal); border-color: var(--signal); color: var(--on-signal); }
.ex-parts button:focus-visible { outline: 2px solid var(--signal); outline-offset: -3px; }
.ex-parts.pro { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 4; display: block; columns: 2; column-gap: 14px; border: 0; background: none; opacity: 0; transition: opacity .4s ease .9s; }
.ex-parts.pro.on { opacity: 1; }
.ex-parts.pro li { border: 0; break-inside: avoid; }
.ex-parts.pro .row { min-height: 0; padding: 3px 0; cursor: default; font-size: 11px; }
.ex-parts.pro b { width: 20px; height: 20px; background: var(--paper); }

/* ---------- ECN-01 re-composed for a narrow panel: top to bottom, Before / After ---------- */
.change-sheet.tall { max-width: 440px; }
.change-sheet.tall .rev-switch { margin-top: 10px; }
.change-sheet.tall .rev-switch button { flex: 1; min-height: 44px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
.change-sheet.tall .cs-title { font-size: 14px; }
.change-sheet.tall .cs-txt, .change-sheet.tall .cs-dim { font-size: 12px; }
.change-sheet.tall .cs-tag, .change-sheet.tall .cs-note { font-size: 12px; }
.change-sheet.tall .cs-dim { fill: var(--ink-2); }
.cst-big { font: 500 30px var(--mono); fill: var(--signal); font-variant-numeric: tabular-nums; }
.cst-unit { font: 500 14px var(--mono); fill: var(--signal-t); }
.cst-track { stroke: var(--ink-3); stroke-width: 1; }
.cst-bar { fill: var(--signal); transform-box: fill-box; transform-origin: left center; transition: transform .8s cubic-bezier(.16, 1, .3, 1); }
.change-sheet.tall[data-rev="b"] .cst-bar { transform: scaleX(.012); }
.cst-dot { fill: var(--signal); opacity: 0; }
.cst-load { fill: var(--signal); transform-box: fill-box; transform-origin: left center; transform: scaleX(0); }
/* a request waits at the session box while it loads (Rev A) or passes straight through the shared cache (Rev B) */
.change-sheet.tall.run[data-rev="a"] .cst-dot.in { animation: cst-in-a 2.8s linear infinite; }
.change-sheet.tall.run[data-rev="a"] .cst-dot.out { animation: cst-out-a 2.8s linear infinite; }
.change-sheet.tall.run[data-rev="b"] .cst-dot.in { animation: cst-in-b 1.2s linear infinite; }
.change-sheet.tall.run[data-rev="b"] .cst-dot.out { animation: cst-out-b 1.2s linear infinite; }
.change-sheet.tall.run[data-rev="a"] .cst-load { animation: cst-load 2.8s linear infinite; }
@keyframes cst-in-a { 0% { transform: translateY(0); opacity: 0; } 4% { opacity: 1; } 12%, 76% { transform: translateY(22px); opacity: 1; } 79%, 100% { transform: translateY(22px); opacity: 0; } }
@keyframes cst-out-a { 0%, 78% { transform: translateY(0); opacity: 0; } 81% { transform: translateY(0); opacity: 1; } 94% { transform: translateY(22px); opacity: 1; } 100% { transform: translateY(22px); opacity: 0; } }
@keyframes cst-in-b { 0% { transform: translateY(0); opacity: 0; } 5% { opacity: 1; } 22% { transform: translateY(22px); opacity: 1; } 26%, 100% { transform: translateY(22px); opacity: 0; } }
@keyframes cst-out-b { 0%, 24% { transform: translateY(0); opacity: 0; } 27% { transform: translateY(0); opacity: 1; } 44% { transform: translateY(22px); opacity: 1; } 50%, 100% { transform: translateY(22px); opacity: 0; } }
@keyframes cst-load { 0%, 12% { transform: scaleX(0); } 76% { transform: scaleX(1); } 77%, 100% { transform: scaleX(0); } }

/* ---------- mobile theater: full screen, portrait world, Stories-style chrome ---------- */
.thm-top, .thm-bot, .thm-end, .thm-rec, .thm-rail { display: none; }
html.thm-lock, html.thm-lock body { overflow: hidden; overscroll-behavior: none; }
html.thm-lock body { position: fixed; left: 0; right: 0; }
.th.m { bottom: auto; height: 100vh; height: 100dvh; overscroll-behavior: contain; transition: visibility 0s .3s; }
.th.m.open { transition: none; }
.th.m .th-rail, .th.m .th-hdr, .th.m .th-tb { display: none; }
.th.m .th-sheet, .th.m.open .th-sheet {
  left: 0; right: 0; top: 0; bottom: 0; border: 0; outline: 0; clip-path: none;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.th.m .th-sheet { opacity: 0; transform: translateY(18px); transition: opacity .22s ease, transform .22s cubic-bezier(.7, 0, .84, 0); }
.th.m.open .th-sheet { opacity: 1; transform: none; transition: opacity .3s ease, transform .45s cubic-bezier(.16, 1, .3, 1); }
.th.m .thm-top { display: block; background: var(--paper); border-bottom: 1.5px solid var(--ink); }
.thm-prog { display: flex; gap: 4px; padding: 10px 12px 0; }
.thm-prog i { flex: 1; height: 3px; overflow: hidden; background: color-mix(in srgb, var(--ink) 20%, transparent); }
.thm-prog b { display: block; height: 100%; background: var(--ink); transform: scaleX(0); transform-origin: left center; }
.thm-prog i.cur b { background: var(--signal); }
.thm-prog i.done b { transform: scaleX(1); }
.thm-hd { display: flex; align-items: center; gap: 10px; min-height: 54px; padding-left: 12px; }
.thm-no { flex: none; min-width: 1.35em; font: 600 30px/1 var(--cond); color: var(--signal); }
.thm-no:empty { display: none; }
.thm-tt { flex: 1; min-width: 0; padding: 6px 0; }
.thm-id { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 10.5px var(--mono); letter-spacing: .06em; color: var(--ink-3); }
