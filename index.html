.thm-ttl:focus { outline: none; }
.thm-ttl { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 600 17px/1.2 var(--cond); letter-spacing: .1em; text-transform: uppercase; }
.thm-x { flex: none; align-self: stretch; min-width: 78px; min-height: 54px; border: 0; border-left: 1px solid var(--ink); background: none; cursor: pointer; font: 500 13px var(--cond); letter-spacing: .12em; text-transform: uppercase; }
.th.m .th-area { position: relative; left: auto; right: auto; top: auto !important; bottom: auto; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
.th.m .th-world { will-change: transform; }
.th.m .th-cursor { transition: transform .75s cubic-bezier(.45, 0, .2, 1); }
.th.m .thm-rail { display: block; position: absolute; right: 3px; top: 10px; bottom: 10px; z-index: 34; width: 2px; background: color-mix(in srgb, var(--ink) 16%, transparent); opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.th.m .thm-rail.on { opacity: 1; }
.thm-rail b { position: absolute; left: -1px; top: 0; width: 4px; height: 100%; background: var(--ink-2); transform-origin: 0 0; }
.th.m .thm-rec { display: flex; position: absolute; left: 10px; right: 12px; bottom: 10px; z-index: 35; align-items: stretch; border: 1.5px solid var(--ink); background: var(--paper); box-shadow: 4px 4px 0 var(--shadow); font: 11px/1.35 var(--mono); color: var(--ink); opacity: 0; transform: translateY(10px); transition: opacity .2s ease, transform .2s ease; pointer-events: none; }
.th.m .thm-rec.on { opacity: 1; transform: none; transition: opacity .25s ease, transform .4s cubic-bezier(.16, 1, .3, 1); }
.thm-rec svg, .thm-row svg { flex: none; fill: none; stroke: var(--signal); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.thm-rec svg { width: 30px; padding: 7px; }
.thm-rec b { flex: none; display: flex; align-items: center; padding: 0 9px; border-left: 1px solid var(--ink); font: 600 12px var(--cond); letter-spacing: .14em; }
.thm-rec span { flex: 1; min-width: 0; display: flex; align-items: center; padding: 6px 9px; border-left: 1px solid var(--ink); }
.th.m .thm-bot { display: block; position: relative; background: var(--paper); border-top: 1.5px solid var(--ink); }
.thm-cap { display: flex; align-items: stretch; min-height: 58px; }
.thm-cap-t { flex: 1; min-width: 0; padding: 9px 6px 9px 14px; }
.thm-cap p { margin: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font: italic 15px/1.35 var(--serif); color: var(--ink-2); }
.thm-more { position: relative; z-index: 2; flex: none; width: 62px; min-height: 44px; border: 0; border-left: 1px solid var(--grid-major); background: var(--paper); cursor: pointer; font: 500 11.5px var(--cond); letter-spacing: .12em; text-transform: uppercase; }

      el('path', { d: `M${x1} ${y1 + 1} V${y2 - 1}`, class: 'dim-line', 'marker-start': `url(#dimhead-${key})`, 'marker-end': `url(#dimhead-${key})` }, d);
      const my = (y1 + y2) / 2, lw = textW(label, 12.5) + 12;
      el('rect', { x: x1 - 9, y: my - lw / 2, width: 18, height: lw, class: 'dim-bg' }, d);

    } else {

      const mx = (x1 + x2) / 2, lw = textW(label, 12.5) + 14;
      el('rect', { x: mx - lw / 2, y: y1 - 9, width: lw, height: 18, class: 'dim-bg' }, d);

  }

  /* ================= build ================= */
  let packets = [];
  let plotQueue = null;
  let tallIO = null;
  // tall sheet: one small live detail per project that hints at what its detail shows. CSS runs it only while the node is on screen.
  const MICRO = {
    platform(g, rx, by) {     // file-URL generation: 240 ms becomes 1 ms
      const m = el('g', { class: 'mm mm-lat', 'aria-hidden': 'true' }, g);
      el('path', { d: `M${rx - 116} ${by - 4} h56`, class: 'mm-l' }, m);

      text(m, rx, by, 'mm-t a', '240 ms');

    },
    ocr(g, rx, by) {          // pages of a batch turn over

      }
    },
    assistants(g, rx, by) {   // a tool call goes out and its result comes back

      el('path', { d: `M${rx - 49} ${by - 5.5} h36`, class: 'mm-l' }, m);
      el('rect', { x: rx - 62, y: by - 12, width: 13, height: 13, class: 'mm-b' }, m);
      el('rect', { x: rx - 13, y: by - 12, width: 13, height: 13, class: 'mm-b s' }, m);
      el('circle', { cx: rx - 48, cy: by - 5.5, r: 2.8, class: 'mm-s' }, m);
    },
    quant(g, rx, by) {        // the as-of cut moves over the quarters; what lies after it is not known yet
      const m = el('g', { class: 'mm mm-cut', 'aria-hidden': 'true' }, g);
      for (let i = 0; i < 8; i++) el('rect', { x: rx - 64 + i * 8, y: by - 11, width: 5, height: 9, class: 'mm-k' }, m);
      el('rect', { x: rx - 64, y: by - 14, width: 64, height: 15, class: 'fog' }, m);
      el('path', { d: `M${rx - 64} ${by - 16} v19`, class: 'cut' }, m);
    },
    ebep(g, rx, by) {         // persistent environments stay on; ephemeral ones exist only while they work

      for (let i = 0; i < 4; i++) {
        el('rect', { x: rx - 46 + i * 12, y: by - 16, width: 9, height: 6, class: 'mm-k' }, m);
        el('rect', { x: rx - 46 + i * 12, y: by - 7, width: 9, height: 6, class: 'mm-s e', style: `opacity:${i % 2 ? .14 : 1};animation-delay:${(-i * .8).toFixed(1)}s` }, m);

  function build(L, { plot = false } = {}) {
    const t = T();
    const svg = document.getElementById(L.svg);
    svg.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
    svg.setAttribute('aria-label', t.sheet);
    packets = packets.filter(p => p.svg !== svg);
    const rand = makeRand(7);
    const key = L.key;
    const strokes = [];          // outlines; plotted by rank: border, nodes, edges, contours
    const reveals = [];          // [stroke that must finish first, element]
    const S = (node, rank) => { node.dataset.rank = rank; strokes.push(node); return node; };
    const folds = [], tnodes = [];   // tall sheet only: fold marks and nodes with the height at which the scroll plot inks them

    const defs = el('defs', {}, svg);
    const pat = el('pattern', { id: 'grid-' + key, width: 50, height: 50, patternUnits: 'userSpaceOnUse' }, defs);
    for (let i = 10; i < 50; i += 10) {
      el('line', { x1: i, y1: 0, x2: i, y2: 50, class: 'grid-minor' }, pat);
      el('line', { x1: 0, y1: i, x2: 50, y2: i, class: 'grid-minor' }, pat);
    }
    el('line', { x1: 0, y1: 0, x2: 50, y2: 0, class: 'grid-major' }, pat);
    el('line', { x1: 0, y1: 0, x2: 0, y2: 50, class: 'grid-major' }, pat);
    const hatch = el('pattern', { id: 'hatch-' + key, width: 9, height: 9, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
    el('line', { x1: 0, y1: 0, x2: 0, y2: 9, class: 'hatch-line' }, hatch);
    const mk = el('marker', { id: 'head-' + key, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0 1.5 L10 5 L0 8.5 Z', class: 'edge-head' }, mk);
    const dm = el('marker', { id: 'dimhead-' + key, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0 2 L10 5 L0 8 Z', class: 'dim-head' }, dm);

    const world = el('g', { id: key === 'wide' ? 'world' : 'world-tall' }, svg);
    const { w, h, inset } = L;
    el('rect', { x: 0, y: 0, width: w, height: h, fill: `url(#grid-${key})` }, world);
    const outer = S(el('path', { d: rectPath(inset, inset, w - inset * 2, h - inset * 2), class: 'border-outer' }, world), 0);

    let innerBorder = null;
    if (L.zones) {
      const ii = inset + 14;
      innerBorder = S(el('path', { d: rectPath(ii, ii, w - ii * 2, h - ii * 2), class: 'border-inner' }, world), 1);
      const zg = el('g', {}, world);
      const cols = Math.max(6, Math.round(w / 200)), rows = Math.max(4, Math.round(h / 200));
      for (let i = 0; i < cols; i++) {
        const zx = ii + (w - ii * 2) * (i + .5) / cols;
        text(zg, zx, inset + 7, 'zone', String(i + 1));
        text(zg, zx, h - inset - 7, 'zone', String(i + 1));
        if (i) {
          const tx = ii + (w - ii * 2) * i / cols;
          el('line', { x1: tx, y1: inset, x2: tx, y2: ii, class: 'zone-tick' }, zg);
          el('line', { x1: tx, y1: h - ii, x2: tx, y2: h - inset, class: 'zone-tick' }, zg);
        }
      }
      for (let j = 0; j < rows; j++) {
        const zy = ii + (h - ii * 2) * (j + .5) / rows;
        text(zg, inset + 7, zy, 'zone', 'ABCDEFGHJK'[j]);
        text(zg, w - inset - 7, zy, 'zone', 'ABCDEFGHJK'[j]);
        if (j) {
          const ty = ii + (h - ii * 2) * j / rows;
          el('line', { x1: inset, y1: ty, x2: ii, y2: ty, class: 'zone-tick' }, zg);
          el('line', { x1: w - ii, y1: ty, x2: w - inset, y2: ty, class: 'zone-tick' }, zg);
        }
      }
      L.zoneInfo = { ii, cols, rows };
      reveals.push([innerBorder, zg]);
    }

    // the tall sheet is a folded print: fold marks sit in the margin between projects
    if (key === 'tall') {
      const fg = el('g', { class: 'folds', 'aria-hidden': 'true' }, world);
      const ys = Object.values(L.nodes).map(b => [b[1], b[1] + b[3]]).sort((a, b) => a[0] - b[0]);
      for (let i = 1; i < ys.length; i++) {
        const fy = (ys[i - 1][1] + ys[i][0]) / 2;
        folds.push([fy, el('path', { d: `M${inset} ${fy} h10 M${w - inset - 10} ${fy} h10`, class: 'fold sp-f' }, fg)]);
      }
      reveals.push([outer, fg]);
    }

    // sheet heading and lede
    const hg = el('g', { class: 'dimmable' }, world);
    if (key === 'wide') {
      text(hg, L.lede[0], L.lede[1], 'hdr-lede', t.lede[0]);
      text(hg, L.lede[0], L.lede[1] + 25, 'hdr-lede', t.lede[1]);
      text(hg, L.lede[0], L.lede[1] + 56, 'hdr-sub', t.sheet);
    } else {
      text(hg, 30, 40, 'hdr-sub', t.sheetTall).setAttribute('style', 'font-size:11.5px');
      text(hg, 30, 84, 'hdr-lede', t.lede[0]).setAttribute('style', 'font-size:18px');
      text(hg, 30, 108, 'hdr-lede', t.lede[1]).setAttribute('style', 'font-size:18px');
      hg.classList.add('sp-f');
    }
    reveals.push([outer, hg]);

    // edges
    const eg = el('g', { class: 'dimmable' }, world);
    EDGES.forEach(e => {
      const [as, at, bs, bt, off] = L.anchors[e.id];
      const a = anchor(L.nodes[e.from], as, at), b = anchor(L.nodes[e.to], bs, bt);
      // ends that face each other and nearly line up are drawn as one straight line, not a small jog
      const ax = as === 't' || as === 'b';
      if (ax === (bs === 't' || bs === 'b') && as !== bs && Math.abs(ax ? a[0] - b[0] : a[1] - b[1]) < 16) {
        const m = ax ? (a[0] + b[0]) / 2 : (a[1] + b[1]) / 2;
        if (ax) { a[0] = m; b[0] = m; } else { a[1] = m; b[1] = m; }
      }
      const pts = routeEdge(a, as, b, bs, off);
      const p = el('path', { d: ptsToPath(pts), class: 'edge' + (e.dashed ? ' dashed' : ''), 'marker-end': `url(#head-${key})` }, eg);
      S(p, 3);
      const dots = [0, 1, 2].map(i => el('circle', { r: (key === 'wide' ? 3.6 : 3) - i * .8, class: 'packet', opacity: 0 }, eg));
      packets.push({ path: p, dots, len: 0, pos: rand() * 300, speed: e.dashed ? 55 : 95, svg, ends: [e.from, e.to], pts, dashed: !!e.dashed, tall: key === 'tall' });
      if (L.labels && t.edges[e.id]) {
        // label on the middle of the longest segment
        const run = pts.filter((q, i) => i === 0 || i === pts.length - 1 ||
          Math.abs((q[0] - pts[i - 1][0]) * (pts[i + 1][1] - q[1]) - (q[1] - pts[i - 1][1]) * (pts[i + 1][0] - q[0])) > .5);
        let mid = run[0], best = -1;
        for (let i = 1; i < run.length; i++) { const d = Math.hypot(run[i][0] - run[i - 1][0], run[i][1] - run[i - 1][1]); if (d > best) { best = d; mid = [(run[i][0] + run[i - 1][0]) / 2, (run[i][1] + run[i - 1][1]) / 2]; } }
        const lg = el('g', {}, eg);
        const label = t.edges[e.id];
        if (!label) return;
        const lw = textW(label, 12) + 14;
        el('rect', { x: mid[0] - lw / 2, y: mid[1] - 10, width: lw, height: 20, class: 'edge-label-bg' }, lg);
        text(lg, mid[0], mid[1] + 1, 'edge-label', label);
        reveals.push([p, lg]);
      }
    });

    // nodes
    ORDER.forEach(id => {
      const box = L.nodes[id];
      const n = t.nodes[id], m = META[id];
      const [x, y, bw, bh] = box;
      const g = el('g', { class: 'node dimmable', tabindex: 0, role: 'button', 'data-node': id, 'aria-label': titleOf(n) }, world);
      const inner = el('g', {}, g);
      let lastStroke = null;
      if (m.offduty) {
        el('rect', { x, y, width: bw, height: bh, class: 'node-hit' }, g);
        const cg = el('g', {}, g);
        const marks = contours(cg, box, rand, S);
        lastStroke = strokes[strokes.length - 1];
        marks.forEach(mk2 => reveals.push([lastStroke, mk2]));
        g.appendChild(inner);
        el('rect', { x, y, width: Math.max(textW(n.sub, 14), textW(n.title[0].toUpperCase(), 23)) + 16, height: 64, class: 'edge-label-bg' }, inner);
        text(inner, x + 4, y + 26, 'node-title', n.title[0].toUpperCase());
        text(inner, x + 4, y + 50, 'node-sub', n.sub);
        reveals.push([lastStroke, inner]);
      } else {
        const shadow = el('rect', { x: x + 6, y: y + 6, width: bw, height: bh, class: 'node-shadow' }, g);
        const fill = el('rect', { x, y, width: bw, height: bh, class: 'node-box', style: 'stroke:none' }, g);
        el('rect', { x, y, width: bw, height: bh, fill: `url(#hatch-${key})`, class: 'hatch-fill' }, g);
        const outline = el('path', { d: rectPath(x, y, bw, bh), class: 'node-box', style: 'fill:none' }, g);
        g.appendChild(inner);
        S(outline, 2);
        lastStroke = outline;
        reveals.push([outline, shadow], [outline, fill]);
        const pad = 18;
        const big = m.big && key === 'wide';
        const tcls = 'node-title' + (big ? ' big' : '');
        const lh = big ? 30 : 26;
        n.title.forEach((tl, k) => text(inner, x + pad, y + 42 + k * lh, tcls, tl.toUpperCase()));
        text(inner, x + pad, y + 42 + (n.title.length - 1) * lh + 28, 'node-sub', n.sub);
        if (n.tag) text(inner, x + pad, y + bh - 18, 'node-tag', n.tag);
        reveals.push([outline, inner]);
        if (id === 'fleet') {
          // marching outline and three typing panes: an invitation to open the theater
          const lv = el('g', { class: 'live', 'aria-hidden': 'true' }, g);
          el('rect', { x: x - 8, y: y - 8, width: bw + 16, height: bh + 16, class: 'live-ants' }, lv);
          for (let i = 0; i < 3; i++) {
            const px = x + bw - 104 + i * 30, py = y + bh - 32;
            el('rect', { x: px, y: py, width: 24, height: 17, class: 'live-pane' }, lv);
            el('rect', { x: px + 4, y: py + 5, width: 16, height: 2.2, class: 'live-bar', style: `animation-delay:${(i * .43).toFixed(2)}s` }, lv);
            el('rect', { x: px + 4, y: py + 10, width: 11, height: 2.2, class: 'live-bar', style: `animation-delay:${(i * .43 + .6).toFixed(2)}s` }, lv);
          }
          reveals.push([outline, lv]);
        }
        if (key === 'tall' && MICRO[id]) MICRO[id](g, x + bw - 18, y + bh - 18);
      }
      if (key === 'tall') {
        const rec = { g, trig: y + Math.min(56, bh * .45), in: false };
        tnodes.push(rec);
        g.addEventListener('focus', () => { rec.in = true; g.classList.add('in'); });   // a node reached by keyboard is never left unplotted
      }
      // dimensions state what the system achieves, not the size of the box
      if (L.dims && t.dims[id]) {
        // the off-duty sheet sits on the bottom border, so its dimension goes above it
        const dy = m.offduty ? y - 22 : y + bh + 22;
        dimension(g, x, dy, x + bw, dy, t.dims[id][0], key, false, m.offduty);
        dimension(g, x - 24, y, x - 24, y + bh, t.dims[id][1], key, true);
      }
      const bx = x + bw + (key === 'wide' ? 26 : -4), by = y - (key === 'wide' ? 18 : 4);
      const bal = el('g', { class: 'balloon' }, g);
      if (key === 'wide') el('path', { d: `M${x + bw - 10} ${y + 10} L${bx - 8} ${by + 8}`, class: 'leader' }, bal);
      el('circle', { cx: bx, cy: by, r: 13 }, bal);
      text(bal, bx, by, '', String(m.no));
      reveals.push([lastStroke, bal]);
      g.addEventListener('click', () => openNode(id));
      g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openNode(id); } });
    });

    if (key === 'wide') {
      const gg = el('g', { class: 'guides', id: 'guides', 'aria-hidden': 'true' }, svg);
      el('line', { x1: 0, y1: 0, x2: w, y2: 0, class: 'guide', id: 'guide-h' }, gg);
      el('line', { x1: 0, y1: 0, x2: 0, y2: h, class: 'guide', id: 'guide-v' }, gg);
      el('rect', { id: 'guide-bg', class: 'guide-read-bg', x: 0, y: 0, width: 96, height: 20 }, gg);
      text(gg, 0, 0, 'guide-read', '').id = 'guide-read';

      // magnifier: a live, scaled clone of the sheet inside a clipped circle
      const clip = el('clipPath', { id: 'loupe-clip' }, defs);
      el('circle', { id: 'loupe-c', cx: 0, cy: 0, r: 130 }, clip);
      const lp = el('g', { id: 'loupe', class: 'loupe', 'aria-hidden': 'true' }, svg);
      const lens = el('g', { 'clip-path': 'url(#loupe-clip)' }, lp);
      el('rect', { x: 0, y: 0, width: w, height: h, class: 'loupe-bg' }, lens);
      el('use', { href: '#world', id: 'loupe-use' }, lens);
      const hud = el('g', { id: 'loupe-hud' }, lp);
      el('circle', { r: 130, class: 'loupe-ring' }, hud);
      el('circle', { r: 137, class: 'loupe-ring2' }, hud);
      for (let a = 0; a < 360; a += 10) {
        const c = Math.cos(a * Math.PI / 180), sn = Math.sin(a * Math.PI / 180), r2 = a % 90 === 0 ? 150 : a % 30 === 0 ? 144 : 140;
        el('line', { x1: c * 131, y1: sn * 131, x2: c * r2, y2: sn * r2, class: 'loupe-tick' }, hud);
      }
      el('line', { x1: -8, y1: 0, x2: 8, y2: 0, class: 'loupe-tick' }, hud);
      el('line', { x1: 0, y1: -8, x2: 0, y2: 8, class: 'loupe-tick' }, hud);
      text(hud, 0, -112, 'loupe-read', '').id = 'loupe-read';
    }

    if (key === 'tall') {
      L.sp = { outer, folds, hg, nodes: tnodes, edges: packets.filter(p => p.svg === svg), world };
      // live details and running packets pause while their node or connector is off screen
      if (tallIO) tallIO.disconnect();
      tallIO = new IntersectionObserver(es => es.forEach(en => {
        if (en.target._pk) en.target._pk.vis = en.isIntersecting; else en.target.classList.toggle('vis', en.isIntersecting);
      }), { rootMargin: '40px 0px' });
      tnodes.forEach(n => tallIO.observe(n.g));
      L.sp.edges.forEach(p => { p.path._pk = p; tallIO.observe(p.path); });
    }
    if (plot) plotQueue = { strokes, reveals, svg };
    return L;
  }

  /* ================= scroll plot (tall sheet) =================
     The phone sheet is drawn like a roll plotter. The paper feeds with the scroll, and everything above the plot line is
     inked: the frame and the connectors draw down to the line, a pen rides each connector that is being drawn, and a node
     stamps in when the line reaches it. The line only moves down, so ink never comes off. Without motion the sheet is
     simply complete. */
  const SP = { on: false, y: -1e9, e: 0, sy: 0, top: 0, k: 1, vh: 0, last: 0, intro: 0, topLen: 0, pen: null, L: null };
  function spMeasure() {
    const r = document.getElementById('svg-tall').getBoundingClientRect();
    if (!r.width) return false;
    SP.top = r.top + scrollY; SP.k = r.width / TALL.w; SP.vh = innerHeight; SP.sy = scrollY;
    return true;
  }
  const spLine = () => (SP.sy + SP.vh * .84 - SP.top) / SP.k;
  // a dash pattern that shows only [a, b] of a path of length T; dashed connectors keep their 7 5 rhythm in phase with the finished line
  function dashWin(a, b, T, dashed) {
    let out = '0', at = 0;
    const add = (s, e) => { if (e > s) { out += ` ${(s - at).toFixed(1)} ${(e - s).toFixed(1)}`; at = e; } };
    if (dashed) for (let s = Math.floor(a / 12) * 12; s < b; s += 12) add(Math.max(a, s), Math.min(b, s + 7)); else add(a, b);
    return `${out} ${(T + 10).toFixed(0)}`;
  }
  // how much of the polyline q (ordered top to bottom) lies above the line y, and the point where it meets the line
  function spReach(q, y) {
    let d = 0, pt = q[0];
    for (let i = 1; i < q.length; i++) {
      const a = q[i - 1], b = q[i], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (a[1] > y) break;
      if (b[1] <= y) { d += len; pt = b; continue; }
      const f = (y - a[1]) / (b[1] - a[1]);
      d += len * f; pt = [a[0] + (b[0] - a[0]) * f, y];
      break;
    }
    return [d, pt];
  }
  function spPen(parent) {
    const g = el('g', { class: 'pen sp-pen', 'aria-hidden': 'true' }, parent), s = el('g', { transform: 'scale(.82)' }, g);
    el('circle', { r: 9 }, s); el('circle', { r: 2.4, class: 'nib' }, s);
    el('line', { x1: -16, y1: 0, x2: -11, y2: 0 }, s); el('line', { x1: 11, y1: 0, x2: 16, y2: 0 }, s);
    el('line', { x1: 0, y1: -16, x2: 0, y2: -11 }, s); el('line', { x1: 0, y1: 11, x2: 0, y2: 16 }, s);
    return g;
  }
  function spFrame(now) {
    if (!SP.on) return false;
    const S = SP.L.sp, inset = SP.L.inset;
    let busy = false;
    if (SP.intro) {

  function renderText() {

    // on screen the parts list follows the balloon numbers; the printed CV puts production work first and numbers it 1..n

        <p class="contact"><a href="mailto:JialongM@outlook.com">JialongM@outlook.com</a><a href="${LINKS.linkedin}">linkedin.com/in/jialong-mei-38b93a27b</a><a href="${LINKS.github}">github.com/JialongMei</a>${PRINT ? '' : `<a href="${cvHref()}" download>${esc(x.pdf)}</a>`}</p></div>
       <h2>${esc(x.profileH)}</h2><section class="entry"><p>${esc(x.profile)}</p></section>
       <h2>${esc(x.expH)}</h2>${x.exp.map(([r, o, m, d]) => `<section class="entry"><h3>${esc(r)} · ${esc(o)}</h3><p class="meta">${esc(m)}</p>${d ? `<p>${esc(d)}</p>` : ''}</section>`).join('')}

       <h2>${esc(x.skillsH)}</h2><section class="entry"><dl>${x.skills.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>
       ${PRINT ? '' : `<h2>${esc(x.offH)}</h2><p>${esc(t.nodes.offduty.lede)}</p>`}`;

  // The PDF CV: one A4 page, ATS-friendly single column, generated from t.text.cv
  function renderCv(t) {

    document.getElementById('textmode').innerHTML = `<div class="cv1">
      <header><h1>Jialong Mei</h1><p class="role">${esc(t.role)} · ${esc(t.tb.locVal)}</p>

      <h2>${esc(x.profileH)}</h2><p>${esc(c.summary)}</p>
      <h2>${esc(x.expH)}</h2>${c.exp.map(([r, o, m, b]) => `<section>${row(`${r} · ${o}`, m)}${list(b)}</section>`).join('')}

      <h2>${esc(x.eduH)}</h2>${c.edu.map(([d, sc, m]) => row(`${d} · ${sc}`, m)).join('')}
      <h2>${esc(x.skillsH)}</h2><dl>${c.skills.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    </div>`;

  /* ================= panel ================= */
  const panel = document.getElementById('panel');
  const body = document.getElementById('panel-body');
  const kicker = document.getElementById('panel-kicker');
  const frame = document.getElementById('frame');
  const mini = document.getElementById('mini');

  function caseHTML(id) {
    const t = T(), n = t.nodes[id], m = META[id], P = t.panel;
    let h = `<h2 id="panel-title" tabindex="-1">${esc(titleOf(n))}</h2>${n.layers && isNarrow() ? '<div class="ex-host"></div>' : ''}<p class="lede">${esc(n.lede)}</p>`;
    {
      if (m.changeSheet) h += `<div style="margin-top:28px">${isNarrow() ? changeSheetTallHTML() : changeSheetHTML()}</div>`;
      if (n.asOf) h += asOfHTML(n.asOf);
      if (n.idle) h += idleHTML(n.idle);
      if (m.replay) h += `<h3>${esc(P.workflow)}</h3>${fleetHTML()}`;
      if (m.offduty) h += `<h3>${esc(P.photos)}</h3>${sectionHTML(n)}<div class="photos" data-place="0">${PHOTOS.map(([f, pi], i) =>
        `<figure data-p="${pi}"><a href="photos/${f}-full.webp" target="_blank" rel="noopener"><img src="photos/${f}.webp" alt="${esc(n.places[pi])}" width="480" height="600" loading="lazy"></a><figcaption><span>FIG. ${i + 1}</span>${esc(n.places[pi])}</figcaption></figure>`).join('')}</div>`;
      if (n.numbers) h += `<h3>${esc(P.numbers)}</h3><div class="numbers">${n.numbers.map(([v, l]) => `<div><strong>${esc(v)}</strong><span>${esc(l)}</span></div>`).join('')}</div>`;
      if (n.repo) h += `<p class="repo-link"><a class="btn" href="${n.repo}" target="_blank" rel="noopener">${esc(P.repo)} ↗</a></p>`;
      if (n.design) h += `<h3>${esc(P.design)}</h3><ul>${n.design.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
      if (n.tradeoffs) h += `<h3>${esc(P.tradeoffs)}</h3><ul>${n.tradeoffs.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;

    h += `<div class="panel-contact"><span>${esc(P.contact)}</span><nav aria-label="${esc(P.contact)}">${linksHTML(['cv', 'linkedin', 'github', 'email'])}</nav></div>`;
    return h;

  /* quant: an "as of" cut sweeps through synthetic quarters; a quarter is usable only once its report is out */
  const AQ = { n: 12, x0: 40, x1: 460, lag: [.55, .7, .45, .8, .6, .5, .75, .4, .65, .7, .5, .6] };
  function asOfHTML(f) {
    const qw = (AQ.x1 - AQ.x0) / AQ.n;
    let q = '', yrs = '';
    for (let i = 0; i < AQ.n; i++) {
      const x = AQ.x0 + i * qw, end = x + qw, kx = end + AQ.lag[i] * qw;
      q += `<g class="aq" data-end="${end}" data-known="${kx}"><rect x="${x + 2}" y="64" width="${qw - 4}" height="14" class="aq-p"/>
        <path d="M${end - 2} 79 L${kx} 117" class="aq-l"/><circle cx="${kx}" cy="121" r="4" class="aq-k"/></g>`;
      if (i % 4 === 0) yrs += `<path d="M${x} 150 v5" class="cs-line"/><text x="${x + 2}" y="168" class="cs-dim">${2022 + i / 4}</text>`;
    }
    return `<figure class="fig asof"><svg viewBox="0 0 500 236" role="img" aria-label="${esc(f.title)}">
      <defs><pattern id="aq-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="hatch-line"/></pattern></defs>
      <rect x="0.75" y="0.75" width="498.5" height="234.5" class="cs-frame"/>
      <text x="10" y="24" class="cs-title">${esc(f.title)}</text><text x="490" y="24" class="cs-dim" text-anchor="end">${esc(f.note)}</text>
      <path d="M0 34 H500" class="cs-rule"/>
      <text x="${AQ.x0}" y="57" class="cs-dim">${esc(f.period)}</text><text x="${AQ.x0}" y="142" class="cs-dim">${esc(f.known)}</text>
      <path d="M${AQ.x0} 150 H${AQ.x1 + 30}" class="cs-line"/>${yrs}
      <rect class="aq-fog" x="0" y="44" width="0" height="104" fill="url(#aq-hatch)"/>
      ${q}
      <g class="aq-cut"><path d="M0 42 V176" class="aq-cut-l"/><text x="0" y="188" class="aq-cut-t" text-anchor="middle"></text></g>
      <rect x="10" y="200" width="10" height="8" class="aq-sw use"/><text x="26" y="208" class="cs-dim">${esc(f.usable)}</text>
      <rect x="250" y="200" width="10" height="8" fill="url(#aq-hatch)" class="aq-sw"/><text x="266" y="208" class="cs-dim">${esc(f.future)}</text>
      <rect x="10" y="216" width="10" height="8" class="aq-sw trap"/><text x="26" y="224" class="cs-dim aq-trap-t">${esc(f.trap)}</text>
    </svg><label class="aq-ctl"><span>${esc(f.drag)}</span><input type="range" class="aq-range" min="${AQ.x0 + 20}" max="${AQ.x1 + 20}" step="1" value="250"></label></figure>`;
  }
  function mountAsOf(root) {
    const fig = root.querySelector('.asof');
    if (!fig) return;
    const range = fig.querySelector('.aq-range'), fog = fig.querySelector('.aq-fog'), cut = fig.querySelector('.aq-cut'), lbl = fig.querySelector('.aq-cut-t');
    const qs = [...fig.querySelectorAll('.aq')], qw = (AQ.x1 - AQ.x0) / AQ.n;
    const set = c => {
      cut.setAttribute('transform', `translate(${c} 0)`);
      fog.setAttribute('x', c); fog.setAttribute('width', Math.max(0, 500 - c));
      const t = (c - AQ.x0) / qw, yr = 2022 + Math.floor(t / 4), mo = Math.min(12, Math.floor((t % 4) * 3) + 1);
      lbl.textContent = `${T().nodes.quant.asOf.cut} ${yr}-${String(mo).padStart(2, '0')}`;
      lbl.setAttribute('x', Math.max(50 - c, Math.min(0, 450 - c)));
      qs.forEach(g => g.setAttribute('class', 'aq ' + (+g.dataset.known <= c ? 'use' : +g.dataset.end <= c ? 'trap' : 'fut')));
    };
    range.addEventListener('input', () => set(+range.value));
    if (!motionOK()) { set(+range.value); return; }
    // one slow sweep on open, then the visitor moves the cut
    const a = AQ.x0 + 10, b = +range.value, t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / 2600); const c = a + (b - a) * (1 - Math.pow(1 - k, 3)); set(c); if (k < 1 && fig.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  /* ebep: the same workload on two lanes; the persistent lane keeps an idle band that the ephemeral lane does not */
  function idleHTML(f) {
    const B = [[80, 120, 30], [160, 190, 24], [230, 290, 38], [330, 360, 27]];
    const lane = (base, idle) => {
      let d = `M40 ${base - idle}`;
      B.forEach(([a, b, h]) => { d += ` L${a - (idle ? 0 : 8)} ${base - idle} L${a} ${base - idle - (idle ? 0 : 6)} L${a + 6} ${base - idle - h} L${b - 6} ${base - idle - h} L${b} ${base - idle}`; });
      return d + ` L400 ${base - idle}`;
    };
    const work = (base, idle) => B.map(([a, b, h]) => `<path d="M${a} ${base - idle} L${a + 6} ${base - idle - h} L${b - 6} ${base - idle - h} L${b} ${base - idle} Z" class="id-work"/>`).join('');
    const reg = B.map(([a]) => `<path d="M${a} 44 V214" class="id-reg"/>`).join('');
    return `<figure class="fig idle"><svg viewBox="0 0 500 262" role="img" aria-label="${esc(f.title + '. ' + f.foot)}">
      <defs><pattern id="id-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" class="id-hatch"/></pattern></defs>
      <rect x="0.75" y="0.75" width="498.5" height="260.5" class="cs-frame"/>
      <text x="10" y="24" class="cs-title">${esc(f.title)}</text><path d="M0 34 H500" class="cs-rule"/>
      ${reg}
      <text x="40" y="54" class="cs-tag">${esc(f.lanes[0])}</text>
      <rect x="40" y="98" width="360" height="22" fill="url(#id-hatch)" class="id-idle"/>${work(120, 22)}
      <path d="${lane(120, 22)}" pathLength="1" class="id-curve d"/><path d="M40 120 H400" class="cs-line"/>
      <path d="M404 109 h12" class="id-lead"/><text x="420" y="113" class="cs-ms id-lbl">${esc(f.idle)}</text>
      <text x="40" y="144" class="cs-tag">${esc(f.lanes[1])}</text><text x="400" y="144" class="cs-dim" text-anchor="end">${esc(f.work)}</text>
      ${work(210, 0)}<path d="${lane(210, 0)}" pathLength="1" class="id-curve d"/><path d="M40 210 H400" class="cs-line"/>
      <text x="40" y="228" class="cs-dim">${esc(f.axis[0])}</text><text x="400" y="228" class="cs-dim" text-anchor="end">${esc(f.axis[1])}</text>
      <text x="10" y="251" class="cs-dim">${esc(f.foot)}</text>
    </svg></figure>`;
  }

  /* off-duty: a section line through the contours, one profile per place; the photos follow the chosen place */
  const SECTIONS = [
    t => Math.pow(Math.max(0, 1 - Math.abs(t - .5) / .46), 1.7) * (Math.abs(t - .5) < .025 ? .96 : 1),
    t => Math.max(.12, .22 + .5 * Math.abs(Math.sin(t * 9.4)) * (.65 + .35 * Math.sin(t * 3.1 + 1)) + .04 * Math.sin(t * 41)),
    t => .2 + .1 * Math.sin(t * 6.3) + .05 * Math.sin(t * 15 + 1)
  ];
  function sectionHTML(n) {
    const prof = fn => { let d = ''; for (let i = 0; i <= 92; i++) d += `${i ? ' L' : 'M'}${20 + i * 5} ${(118 - fn(i / 92) * 92).toFixed(1)}`; return d; };
    const counts = n.places.map((_, i) => PHOTOS.filter(p => p[1] === i).length);
    const secs = SECTIONS.map((fn, i) => { const d = prof(fn); return `<g class="sec sec-${i}"><path d="${d} L480 118 L20 118 Z" fill="url(#sec-hatch)" class="sec-cut"/><path d="${d}" pathLength="1" class="sec-line d"/>
      ${i === 0 ? `<path d="M250 26 V12 h16" class="id-lead"/><text x="270" y="16" class="cs-ms">${esc(n.summit)}</text>` : ''}
      <text x="20" y="140" class="cs-dim">${esc(n.section)} · ${esc(n.places[i])}</text></g>`; }).join('');
    return `<div class="places draw" data-place="0"><div class="rev-switch place-tabs" role="group" aria-label="${esc(n.section)}">${n.places.map((pl, i) =>
      `<button type="button" data-place="${i}" aria-pressed="${i === 0}">${esc(pl)} <span>${counts[i]}</span></button>`).join('')}</div>
      <svg class="section" viewBox="0 0 500 150" role="img" aria-label="${esc(n.section)}">
      <defs><pattern id="sec-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" class="hatch-line"/></pattern></defs>
      <path d="M20 118 H480" class="cs-line"/><text x="8" y="122" class="cs-tri-t">A</text><text x="486" y="122" class="cs-tri-t">A</text>${secs}</svg></div>`;
  }
  document.addEventListener('click', e => {
    const bt = e.target.closest('.place-tabs button');
    if (!bt) return;
    const box = bt.closest('.places'), grid = box.nextElementSibling;
    box.dataset.place = bt.dataset.place;
    if (grid) grid.dataset.place = bt.dataset.place;
    box.querySelectorAll('.place-tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === bt)));
    box.classList.remove('draw'); void box.offsetWidth; box.classList.add('draw');
  });

  // Rev A and Rev B are drawn in register on one sheet: the visitor can view either one or both overlaid
  function changeSheetHTML() {
    const s = T().sheetCS;
    const box = (x, y, w, h, lines, cls = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" pathLength="1" class="cs-box d ${cls}"/>` +
      lines.map((tx, i) => `<text x="${x + 8}" y="${y + 17 + i * 14}" class="cs-txt${i ? ' cs-dim' : ''}">${esc(tx)}</text>`).join('');
    const arrow = (x1, y1, x2, y2) => `<path d="M${x1} ${y1} L${x2} ${y2}" pathLength="1" class="cs-line d" marker-end="url(#cs-head)"/>`;
    const ys = [62, 112, 162];
    let common = '', a = '', b = '';
    ys.forEach((y, i) => {
      common += box(10, y, 68, 34, [s.thread(i + 1)]);
      a += arrow(78, y + 17, 108, y + 17) + box(110, y, 98, 34, s.fresh, 'cs-hot');
      b += arrow(78, y + 17, 328, y + 17);
    });

  function buildRun(steps) {
    let at = rnd(250, 700);

  /* routing: the hash is the single source of truth for the open detail */

  /* ================= orchestration theater (sheet JM-002) ================= */
  // the architecture sheet shrinks into a left rail; a second sheet spawns the agent processes act by act
  const TW = 1120, THH = 660;
  const TH = { sheet: 'fleet', open: false, playing: false, t: 0, last: 0, raf: 0, run: 0, waits: [], frame: new Set(), act: 0, vault: null,

  const thEl = document.getElementById('theater');

  class Abort extends Error {}

  function thTick(now) {

    const due = TH.waits.filter(w => TH.t >= w.at);
    if (due.length) { TH.waits = TH.waits.filter(w => TH.t < w.at); due.forEach(w => w.res()); }

  const sleep = ms => {

  };
  function thPlay() {

  }
  function thPause() { TH.playing = false; cancelAnimationFrame(TH.raf); }
  function thAbort() { TH.run++; const w = TH.waits; TH.waits = []; w.forEach(x => x.res()); TH.frame.clear(); }
  // a call site gives both placements: pt(portrait world, wide world)
  const pt = (a, b) => TH.pt ? a : b;
  // a static card runs its act on a drained clock (TH.fast): timers fire at once and nothing is animated
  const later = (fn, ms) => { if (TH.fast) fn(); else setTimeout(fn, ms); };
  const draw = (node, kf, opt) => { if (!TH.fast) node.animate(kf, opt); };

  /* ---- primitives: everything lives in a 1120 x 660 world that is scaled to the sheet ---- */
  const hex = n => Array.from({ length: n }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('');
  function box(cls, x, y, w, h, html) {
    const d = document.createElement('div');
    d.className = cls;

    if (w) d.style.width = w + 'px';
    if (h) d.style.height = h + 'px';
    d.innerHTML = html;
    thWorld.appendChild(d);
    const b = { el: d, x, y, w, h: h || 40 };
    if (TH.pt) {
      // the portrait world grows downward with its content, and the camera keeps the newest part in view
      if (!w) b.w = d.offsetWidth;
      if (!h) b.h = d.offsetHeight;

  }
  function pane(x, y, w, h, title, role, cls = '') {

      `<div class="th-head"><b>${esc(title)}</b><span class="th-role">${esc(role)}</span><span class="th-st">idle</span></div><div class="th-body"></div>`);
    p.body = p.el.querySelector('.th-body'); p.st = p.el.querySelector('.th-st'); p.wires = [];

  const busy = (p, on, label) => { p.st.textContent = label || (on ? 'working' : 'idle'); p.el.classList.toggle('lit', !!on); };
  const PRE = { cmd: '$ ', ok: '✓ ', bad: '✗ ', warn: '! ' };
  async function line(p, str, kind = 'out') {
    const d = document.createElement('div');
    d.className = 'l ' + kind;
    if (PRE[kind]) { const s = document.createElement('span'); s.className = 'pre'; s.textContent = PRE[kind]; d.appendChild(s); }
    const tx = document.createTextNode('');
    const cur = document.createElement('span'); cur.className = 'cursor';

    }

    try { await sleep(ms); } finally { TH.frame.delete(upd); d.remove(); busy(p, false); }
  }
  async function tests(p, label, n, ms = rnd(1100, 2400)) {
    const d = document.createElement('div'); d.className = 'l';
    p.body.appendChild(d); p.body.scrollTop = p.body.scrollHeight;

  // wires: drawn between the facing edges of two boxes
  function wire(a, b, cls = '', bus) {
    const ca = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, cb = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    const horiz = Math.abs(cb.x - ca.x) > Math.abs(cb.y - ca.y) * 1.2;
    let p0, p1, d;
    if (TH.pt && bus) {
      // portrait: boxes that are not neighbours are joined along a bus in the left ('l') or right ('r') margin; '2' is the outer lane
      const left = bus[0] === 'l', lane = bus[1] === '2' ? 1 : 0, gx = left ? 12 - lane * 7 : TH.W - 12 + lane * 7;

  function send(w, label, { back = false, cls = '', dur = rnd(780, 1100) } = {}) {

  /* ---- the Obsidian vault: recall at the start of every act, a verified record at the end ---- */
  function vault() {

  /* ---- synthetic letters: grey bars stand in for text, only the identifier is legible ---- */
  const BLOCKS = [['header', 8, 5, 34, 6], ['address', 8, 15, 38, 12], ['identifier', 50, 15, 44, 5], ['date', 54, 22, 26, 4],
    ['title', 8, 32, 62, 5], ['paragraph', 8, 40, 84, 27], ['table', 8, 70, 84, 15], ['signature', 8, 89, 30, 5]];
  // portrait pages are small, so the identifier gets a full line and stays readable
  const BLOCKS_PT = [['header', 8, 4, 34, 6], ['identifier', 8, 13, 84, 8], ['address', 8, 24, 38, 10], ['date', 56, 27, 26, 4],
    ['title', 8, 37, 62, 5], ['paragraph', 8, 45, 84, 24], ['table', 8, 72, 84, 14], ['signature', 8, 89, 30, 5]];
  const blocks = () => TH.pt ? BLOCKS_PT : BLOCKS;
  const IDS = { notice: 'ref. 3012-4458-7710', notice2: 'ref. 3012-4458-9902', court: 'case 2026-0412', tax: 'assessment 8841-2207', none: 'ref. 00417' };
  const TAGS = { notice: 'notice', notice2: 'notice', court: 'court', tax: 'tax', none: '?' };
  // one synthetic batch used by every act: 9 pages, 5 letters
  const BATCH = { kinds: ['notice', 'notice', 'court', 'court', 'court', 'tax', 'notice2', 'notice2', 'none'], cont: [false, true, false, true, true, false, false, true, false] };
  function letterHTML(kind, cont) {
    const bars = (n, w) => Array.from({ length: n }, (_, i) => `<i style="width:${w - (i * 17 % 28)}%"></i>`).join('');
    const inner = {
      header: cont ? '' : '<i class="pg-logo"></i>', address: cont ? '' : bars(4, 88), identifier: cont ? '' : esc(IDS[kind]),
      date: cont ? '' : bars(1, 100), title: bars(1, 100), paragraph: bars(9, 100), table: '', signature: bars(1, 70)
    };
    return blocks().map(([k, x, y, w, h]) => `<div class="pg-b pg-${k}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${inner[k]}</div>`).join('');
  }
  // shrink an identifier until it fits its block
  const fitIds = root => root.querySelectorAll('.pg-identifier').forEach(e => {
    if (e.scrollWidth > e.clientWidth) e.style.fontSize = parseFloat(getComputedStyle(e).fontSize) * e.clientWidth / e.scrollWidth * .95 + 'px';
  });
  function page(x, y, w, kind, cont = false, cls = '') {
    const p = box('th-page th-spawn ' + cls, x, y, w, Math.round(w * 1.414), letterHTML(kind, cont));
    fitIds(p.el);
    p.kind = kind; p.cont = cont; p.wires = [];
    return p;
  }
  // a layout or evidence box over one block of a page; returns the block's rectangle in world coordinates
  function mark(pg, key, cls = '') {
    const b = blocks().find(z => z[0] === key);
    const d = document.createElement('div');
    d.className = 'lb ' + cls; d.dataset.l = key;
    Object.assign(d.style, { left: b[1] + '%', top: b[2] + '%', width: b[3] + '%', height: b[4] + '%' });
    pg.el.appendChild(d);
    return { el: d, x: pg.x + pg.w * b[1] / 100, y: pg.y + pg.h * b[2] / 100, w: pg.w * b[3] / 100, h: pg.h * b[4] / 100, wires: [] };
  }
  // centre of a DOM element, in world coordinates
  function at(e) {
    const r = e.getBoundingClientRect(), wr = thWorld.getBoundingClientRect(), s = wr.width / TH.W;
    return { x: (r.left + r.width / 2 - wr.left) / s, y: (r.top + r.height / 2 - wr.top) / s };
  }

  /* ---- OCR act II: split by anchors, route to human-approved versions ---- */

    const letters = [];
    for (const [i, t] of thumbs.entries()) {
      t.el.classList.add('scanning');

      t.el.classList.remove('scanning');
      if (!cont[i]) {

    vt.ready.then(() => {
      // keeps the transition open for D ms; the fold itself is driven frame by frame
      root.animate({ opacity: [1, 1] }, { duration: D, pseudoElement: '::view-transition-old(root)' });
      const t0 = performance.now();
      const tick = now => {
        const p = Math.min(1, (now - t0) / D);
        frame(s0 + (s1 - s0) * easeTurn(p));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }).catch(() => {});
    vt.finished.finally(() => {
      root.classList.remove('vt-turn'); root.style.removeProperty('--peel');
      flap.remove(); curl.classList.remove('turning'); switching = false;
    });
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.view) {
      const v = b.dataset.view;
      if (v === view()) return;
      transition('vt-fade', () => setView(v));
      setTimeout(() => {
        const target = v === 'text' ? document.querySelector('#textmode h1') : document.querySelector('#svg-wide .node, #svg-tall .node');
        const visible = v === 'text' ? target : visibleNode('platform');
        if (visible) visible.focus({ preventScroll: true });
      }, 60);
    } else if (b.dataset.themeSet) {
      if (b.dataset.themeSet !== theme()) transition('vt-scan', () => setTheme(b.dataset.themeSet, true));
    } else if (b.dataset.langSet) {
      switchLang(b.dataset.langSet);
    } else if (b.dataset.motionSet) {
      motionPref = b.dataset.motionSet;
      store.set('jm-motion', motionPref);
      syncMotion();
    }
  });

  /* ================= layout lifecycle ================= */
  const layouts = {};
  function relayout() {
    layouts.wide = build(wideLayout());
    layouts.tall = build(tallLayout());
    if (SP.on) spInit('restore');
    if (currentId) {
      document.querySelectorAll(`.node[data-node="${currentId}"]`).forEach(n => n.classList.add('active'));
      document.getElementById('svg-wide').classList.add('focusing');
      if (explodeEl || !isNarrow()) mountExplode(currentId, true); else focusWorld(currentId);
    }
  }
  let resizeTimer = 0, lastW = innerWidth, wasNarrow = isNarrow();
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      // phones resize whenever the browser bar slides: the tall sheet does not depend on the height, so it is not rebuilt for that
      const sameSheet = innerWidth === lastW && wasNarrow && isNarrow();
      lastW = innerWidth; wasNarrow = isNarrow();
      if (sameSheet) { if (SP.on) { spMeasure(); fxAdd(spFrame); } }
      else if (!intro) relayout();
      paper.render();
      if (TH.open && !TH.under) { if (isNarrow() || TH.m) syncRoute(); else layoutTheater(); }
    }, 120);
  });

  new IntersectionObserver(([e]) => mini.classList.toggle('show', !e.isIntersecting && isNarrow()))
    .observe(document.getElementById('titleblock'));

  /* ================= start ================= */
  // 'jm-sheet' holds an explicit choice; the older 'jm-theme' key was written on every visit, so it is ignored
  setTheme(PRINT ? 'paper' : store.get('jm-sheet') || 'blueprint');
  const startText = PRINT || params.get('view') === 'text' || (store.get('jm-view') === 'text' && !META[routeId()]);
  if (startText) document.body.classList.add('is-text');
  renderOverlays();
  const wantPlot = motionOK() && !startText && !isNarrow() && !META[routeId()];
  // phones: the sheet is plotted with the scroll; the first visit of a session opens with a short plotted intro
  const session = { get(k) { try { return sessionStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (_) {} } };
  const narrowMotion = motionOK() && !startText && isNarrow();
  const wantIntro = narrowMotion && !META[routeId()] && !session.get('jm-intro');
  layouts.wide = build(wideLayout(), { plot: wantPlot });
  layouts.tall = build(tallLayout());
  if (narrowMotion) spInit(wantIntro ? 'intro' : 'load');
  paper.render();
  if (wantPlot && plotQueue) {
    intro = true;
    stageEl.classList.add('intro');
    document.getElementById('skip-hint').textContent = T().skip;
    plot(plotQueue, () => { intro = false; plotQueue = null; stageEl.classList.remove('intro'); syncMotion(); });
  } else if (wantIntro && SP.on) {
    intro = true;
    session.set('jm-intro', '1');
    introTall(() => { intro = false; syncMotion(); });
  } else syncMotion();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (SP.on) { spMeasure(); fxAdd(spFrame); } });
  if (META[routeId()]) setTimeout(syncRoute, 300);
})();
</script>
</body>
</html>
