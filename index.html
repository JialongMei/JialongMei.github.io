    return BLOCKS.map(([k, x, y, w, h]) => `<div class="pg-b pg-${k}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${inner[k]}</div>`).join('');
  }
  // shrink an identifier until it fits its block
  const fitIds = root => root.querySelectorAll('.pg-identifier').forEach(e => {
    if (e.scrollWidth > e.clientWidth) e.style.fontSize = parseFloat(getComputedStyle(e).fontSize) * e.clientWidth / e.scrollWidth * .95 + 'px';
  });
  function page(x, y, w, kind, cont = false, cls = '') {
    const p = box('th-page th-spawn ' + cls, x, y, w, Math.round(w * 1.414), letterHTML(kind, cont));
    fitIds(p.el);
    p.kind = kind; p.cont = cont; p.wires = [];
    return p;
  }
  // a layout or evidence box over one block of a page; returns the block's rectangle in world coordinates
  function mark(pg, key, cls = '') {
    const b = BLOCKS.find(z => z[0] === key);
    const d = document.createElement('div');
    d.className = 'lb ' + cls; d.dataset.l = key;
    Object.assign(d.style, { left: b[1] + '%', top: b[2] + '%', width: b[3] + '%', height: b[4] + '%' });
    pg.el.appendChild(d);
    return { el: d, x: pg.x + pg.w * b[1] / 100, y: pg.y + pg.h * b[2] / 100, w: pg.w * b[3] / 100, h: pg.h * b[4] / 100, wires: [] };
  }
  // centre of a DOM element, in world coordinates
  function at(e) {
    const r = e.getBoundingClientRect(), wr = thWorld.getBoundingClientRect(), s = wr.width / TW;
    return { x: (r.left + r.width / 2 - wr.left) / s, y: (r.top + r.height / 2 - wr.top) / s };
  }

    const tab = async i => {
      await go(tabs[i]);
      cur.el.classList.add('click'); await sleep(160); cur.el.classList.remove('click');
      tabs.forEach((t, j) => t.classList.toggle('on', j === i));
      ind.style.transform = `translateX(${i * 100}%)`;
      view.classList.remove('swap'); void view.offsetWidth; view.classList.add('swap');
    };
    const say = async msg => { toast.textContent = msg; toast.classList.add('on'); await sleep(1700); toast.classList.remove('on'); };
    // daily review: PDF on the left, fact cards with evidence links on the right, hold to confirm
    tabs[0].classList.add('on');
    view.innerHTML = `<div class="ap-review">
      <div class="ap-list">${[['scan_0412.pdf', 'Te beoordelen', 'todo'], ['scan_0411.pdf', 'Akkoord', 'ok'], ['scan_0409.pdf', 'Twijfel', 'doubt']].map(([f, st, c], i) => `<div class="ap-row${i ? '' : ' on'}"><b>${f}</b><span>29-09</span><em class="${c}">${st}</em></div>`).join('')}</div>
      <div class="ap-pdf"><div class="th-page inline">${letterHTML('cjib')}</div></div>
      <div class="ap-side"><div class="ap-facts">${factsHTML()}</div><div class="ap-actions"><button type="button" class="ap-hold" tabindex="-1">Goedkeuren</button><button type="button" tabindex="-1">Aanpassen</button></div></div></div>`;
    fitIds(view);
    await sleep(900);
    for (const f of view.querySelectorAll('.ap-fact')) { f.classList.add('look'); await sleep(420); f.classList.remove('look'); }
    const hold = view.querySelector('.ap-hold');
    await go(hold, 0, 6);
    hold.classList.add('holding');
    const t0 = TH.t;
    const fill = t => hold.style.setProperty('--p', Math.min(100, (t - t0) / 20) + '%');
    TH.frame.add(fill);
    try { await sleep(2000); } finally { TH.frame.delete(fill); }
    hold.classList.remove('holding'); hold.classList.add('done'); hold.textContent = '✓ Goedgekeurd';
    const st = view.querySelector('.ap-row.on em'); st.textContent = 'Akkoord'; st.className = 'ok';
    await say(`Goedgekeurd · audit event ${hex(6)}`);
    // templates: anchors per sample, best candidate pinned
    await tab(1);
    const anchors = ['Centraal Justitieel Incassobureau', 'Beschikking', 'Boetenummer · 16 cijfers', 'Betalen vóór'];
    view.innerHTML = `<div class="ap-tpl"><div class="ap-pin"><b>Beste kandidaat</b><span>CJIB › boete · v3</span><em>5 / 5 samples</em></div>
      <table class="ap-mx"><thead><tr><th>Anker</th>${[1, 2, 3, 4, 5].map(i => `<th>S${i}</th>`).join('')}</tr></thead><tbody>
      ${anchors.map(a => `<tr><td>${a}</td>${[1, 2, 3, 4, 5].map(() => '<td></td>').join('')}</tr>`).join('')}</tbody></table>
      <p class="ap-note">100 % = alle verplichte ankers letterlijk gevonden</p></div>`;
    const cells = [...view.querySelectorAll('.ap-mx td:not(:first-child)')];
    for (const [i, c] of cells.entries()) {
      const miss = i === 18;
      c.textContent = miss ? '✗' : '✓'; c.className = miss ? 'miss' : 'hit';
      await sleep(70);
    }
    await sleep(500);
    await say('S4 mist "Betalen vóór" · pagina 2 openen');
    // split control: a batch drills down to every child letter
    await tab(2);
    view.innerHTML = `<div class="ap-split"><div class="ap-batch"><b>Batch 2026-10-12</b><span>9 pagina's · 5 brieven</span><em class="ok">Gesplitst</em></div><div class="ap-kids"></div></div>`;
    await sleep(600);
    await go(view.querySelector('.ap-batch'));
    cur.el.classList.add('click'); await sleep(160); cur.el.classList.remove('click');
    view.querySelector('.ap-batch').classList.add('open');
    const kids = view.querySelector('.ap-kids');
    for (const [i, [id, type, s, c]] of [['3012 4458 7710 2291', 'Boete', 'Gekoppeld', 'ok'], ['C/13/745120', 'Vonnis', 'Handmatige controle', 'doubt'], ['8841.2207.3315', 'Aanslag', 'Gekoppeld', 'ok'], ['3012 4458 9902 1174', 'Boete', 'Gekoppeld', 'ok'], ['—', 'Onbekend', 'Handmatige controle', 'doubt']].entries()) {
      const r = document.createElement('div'); r.className = 'ap-kid';
      r.innerHTML = `<span>${i + 1}</span><b>${id}</b><span>${type}</span><em class="${c}">${s}</em><a>PDF</a>`;
      kids.appendChild(r);
      await sleep(240);
    }
    await sleep(2200);
  }

  /* ---- OCR act V: offline evaluation and the human-approved improvement loop ---- */
  async function ocrLoop() {
    const ev = pane(40, 14, 430, 330, 'Evaluator', 'offline replay · shadow');
    await line(ev, 'evaluate --replay batch-A --mode shadow', 'cmd');
    for (const [s, k] of [['recorded batch 827 pages · 403 letters', 'out'], ['exact splits   402 / 403', 'out'], ['split F1       99.88 %', 'ok'], ['abstentions    counted apart from errors', 'dim']]) await line(ev, s, k);
    await signoff(ev, ['BASELINE', nowStamp(), '827 pages']);
    const A = box('th-node loop th-spawn', 540, 30, 240, 60, '<b>Staff correction</b><span>Aanpassen · deadline 10-11 → 11-11</span>');
    const B = box('th-node loop th-spawn', 850, 30, 240, 60, '<b>Proposed field rule</b><span>AI drafts it, with evidence</span>');
    const C = pane(850, 170, 240, 150, 'Domain colleague', '');
    const D = box('th-node loop th-spawn', 540, 200, 240, 60, '<b>Version v4</b><span>awaiting approval</span>');
    const E = box('th-node loop th-spawn', 540, 340, 240, 60, '<b>Matcher</b><span>sees only published versions</span>');
    const ab = wire(A, B), bc = wire(B, C), cd = wire(C, D), de = wire(D, E), ea = wire(E, A);
    await send(ab, 'EDIT');
    await send(bc, 'RULE');
    await line(C, 'evidence on 5 samples', 'out');
    await line(C, 'rule matches the business meaning', 'ok');
    await signoff(C, ['APPROVED', nowStamp()]);
    await send(cd, 'PUBLISH');
    D.el.querySelector('b').textContent = 'Published version v4';
    D.el.querySelector('span').textContent = `immutable · sha256:${hex(8)}`;
    await send(de, 'v4');
    await send(ea, 'NEXT BATCH');
    box('th-card th-spawn', 540, 440, 550, null, '<span class="th-k">rule</span><q>AI may propose field rules; only colleague-approved, published versions reach the matcher.</q>');
    chip(40, 380, 'status · shadow on staging · production cut-over pending');
    await sleep(3000);
  }

  const SHEETS = {
    fleet: { key: 'th', acts: [actIntake, actKamae, actFleet, actBatch, actOvernight] },
    ocr: { key: 'thOcr', acts: [ocrPerception, ocrSplit, ocrExtract, ocrStation, ocrLoop] }
  };
  const ROMAN = ['I', 'II', 'III', 'IV', 'V'];

  function clearWorld() {
    [...thWorld.children].forEach(c => { if (c !== thWires && !c.classList.contains('th-vault')) c.remove(); });
    thWires.innerHTML = '';
  }
  function renderActHead() {
    const a = T()[SHEETS[TH.sheet].key].acts[TH.act];
    document.getElementById('th-no').textContent = ROMAN[TH.act];
    document.getElementById('th-ttl').textContent = a[0];
    document.getElementById('th-cap').textContent = a[1];
    const hd = document.getElementById('th-hdr');
    hd.classList.remove('swap'); void hd.offsetWidth; hd.classList.add('swap');
    if (TH.open) layoutTheater();
    document.querySelectorAll('#th-acts button').forEach((b, i) => b.setAttribute('aria-current', String(i === TH.act)));
  }
  async function playActs(i) {
    thAbort();
    const run = TH.run;
    for (;;) {
      TH.act = i;
      renderActHead();
      clearWorld();
      try {
        await sleep(450);
        await SHEETS[TH.sheet].acts[i]();
        await sleep(2400);
      } catch (e) {
        if (e instanceof Abort) return;
        throw e;
      }
      if (run !== TH.run) return;
      i = (i + 1) % SHEETS[TH.sheet].acts.length;
    }
  }

  function renderTheaterText() {
    const t = T()[SHEETS[TH.sheet].key];
    document.getElementById('th-sheet-id').textContent = t.sheet;
    document.getElementById('th-back-l').textContent = t.back;
    document.getElementById('th-note').textContent = t.note;
    document.getElementById('th-acts').innerHTML = t.acts.map(([ti], i) => `<button type="button" data-act="${i}"><span>${ROMAN[i]}</span>${esc(ti)}</button>`).join('');
    document.getElementById('th-close').textContent = T().panel.close;
  }
  function layoutTheater() {
    const rail = Math.round(Math.min(380, Math.max(236, innerWidth * .2)));
    const k = (rail - 28) / innerWidth;
    thEl.style.setProperty('--rail', rail + 'px');
    thEl.style.setProperty('--maph', Math.round(innerHeight * k) + 'px');
    frame.style.transform = `translate(14px, 14px) scale(${k})`;
    // the scene starts below the header, whose height follows the caption length
    const hd = document.getElementById('th-hdr'), areaEl = document.getElementById('th-area');
    areaEl.style.top = Math.max(116, hd.offsetTop + hd.offsetHeight + 8) + 'px';
    const area = areaEl.getBoundingClientRect();
    const s = Math.min(area.width / TW, area.height / THH);
    thWorld.style.transform = `translate(${(area.width - TW * s) / 2}px, ${Math.min(12, (area.height - THH * s) / 2)}px) scale(${s})`;
  }
  let liveTimer = 0;
  function showTheater(id = 'fleet') {
    if (TH.open && TH.sheet === id) { layoutTheater(); return; }
    if (TH.open) {
      TH.sheet = id; thAbort(); clearWorld();
      if (TH.vault) { TH.vault.el.remove(); TH.vault = null; }
      renderTheaterText(); thPlay(); playActs(0);
      return;
    }
    TH.sheet = id;
    TH.open = true;
    renderTheaterText();
    document.body.classList.add('theater-open');
    thEl.inert = false;
    frame.inert = true; mini.inert = true; document.getElementById('curl').inert = true;
    requestAnimationFrame(() => { layoutTheater(); thEl.classList.add('open'); });
    const clk = document.getElementById('th-clock');
    const tickLive = () => { clk.textContent = new Date().toLocaleTimeString('en-GB'); };
    tickLive(); clearInterval(liveTimer); liveTimer = setInterval(tickLive, 1000);
    thPlay();
    playActs(0);
    setTimeout(() => document.getElementById('th-close').focus({ preventScroll: true }), 400);
  }
  function hideTheater() {
    if (!TH.open) return;
    TH.open = false;
    thAbort(); thPause(); clearInterval(liveTimer);
    thEl.classList.remove('open');
    thEl.inert = true;
    frame.style.transform = '';
    frame.inert = false; mini.inert = false; document.getElementById('curl').inert = false;
    document.body.classList.remove('theater-open');
    setTimeout(() => { if (!TH.open) { clearWorld(); if (TH.vault) TH.vault.el.remove(); TH.vault = null; } }, 900);
    const trigger = visibleNode(TH.sheet);
    if (trigger) trigger.focus({ preventScroll: true });
  }
  thEl.inert = true;
  document.getElementById('th-acts').addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b) { thPlay(); playActs(+b.dataset.act); }
  });
  document.getElementById('th-close').addEventListener('click', () => closePanel());
  document.getElementById('th-back').addEventListener('click', () => closePanel());

  /* ================= view, theme, language ================= */
  const transition = (cls, fn) => {
    if (!document.startViewTransition || !motionOK()) { fn(); return; }
    document.documentElement.classList.add(cls);
    const vt = document.startViewTransition(fn);
    vt.finished.finally(() => document.documentElement.classList.remove(cls));
  };
  function setView(v) {
    if (v === 'text' && currentId) closePanel();
    document.body.classList.toggle('is-text', v === 'text');
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    store.set('jm-view', v);
    scrollTo(0, 0);
    if (v === 'drawing') { relayout(); paper.render(); }
    syncMotion();
  }
  function setTheme(t) {
    if (t === 'blueprint') document.documentElement.dataset.theme = 'blueprint';
    else delete document.documentElement.dataset.theme;
    document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t)));
    store.set('jm-theme', t);
    paper.render();
  }
  function setLang(l) {
    lang = l;
    store.set('jm-lang', l);
    const u = new URL(location.href);
    if (l === 'zh') u.searchParams.set('lang', 'zh'); else u.searchParams.delete('lang');
    history.replaceState(history.state, '', u);
    renderOverlays();
    relayout();
    if (currentId) { const id = currentId; hidePanel(); showPanel(id); }
    syncMotion();
  }

  /* language: the sheet's bottom-left corner lifts on hover; a click turns the whole page over to the other edition */
  let switching = false;
  const easeTurn = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  function switchLang(l) {
    if (l === lang || switching) return;
    if (!document.startViewTransition || !motionOK()) { setLang(l); return; }
    switching = true;
    const root = document.documentElement, curl = document.getElementById('curl');
    const W = innerWidth, H = innerHeight, R = Math.SQRT1_2, D = 1300;
    // fold geometry: u = (1, -1)/√2 points from the bottom-left corner into the sheet; the fold line sits at distance s along u
    const s0 = curl.getBoundingClientRect().width * R, s1 = (W + H) * R + 60;
    const proj = ([x, y]) => (x + H - y) * R;
    const RECT = [[0, 0], [W, 0], [W, H], [0, H]];
    const clip = (poly, f) => {   // keep the part of the polygon where f(p) >= 0
      const out = [];
      poly.forEach((a, i) => {
        const b = poly[(i + 1) % poly.length], fa = f(a), fb = f(b);
        if (fa >= 0) out.push(a);
        if ((fa >= 0) !== (fb >= 0)) { const k = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]); }
      });
      return out;
    };
    const mirror = (p, s) => { const d = 2 * (s - proj(p)) * R; return [p[0] + d, p[1] - d]; };
    const svgPts = poly => poly.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const cssPoly = poly => poly.length ? `polygon(${poly.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(', ')})` : 'polygon(0 0, 0 0, 0 0)';
    const on = s => [s * R, H - s * R];
    const cs = getComputedStyle(root), c = k => cs.getPropertyValue(k).trim();
    const flap = document.createElementNS(NS, 'svg');
    flap.id = 'page-flap';
    flap.setAttribute('viewBox', `0 0 ${W} ${H}`);
    flap.setAttribute('aria-hidden', 'true');
    flap.innerHTML = `<defs>
      <linearGradient id="pf-back" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c('--ink')}" stop-opacity=".3"/><stop offset=".07" stop-color="${c('--paper-2')}"/><stop offset=".5" stop-color="${c('--paper')}"/><stop offset="1" stop-color="${c('--paper-2')}"/></linearGradient>
      <linearGradient id="pf-cast" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs>
      <polygon class="pf-cast" fill="url(#pf-cast)"/><polygon class="pf-back" fill="url(#pf-back)" stroke="${c('--ink')}" stroke-opacity=".25" stroke-width=".8"/>`;
    const back = flap.querySelector('.pf-back'), cast = flap.querySelector('.pf-cast');
    const line = (g, a, b) => { g.setAttribute('x1', a[0]); g.setAttribute('y1', a[1]); g.setAttribute('x2', b[0]); g.setAttribute('y2', b[1]); };
    const frame = s => {
      const peeled = clip(RECT, p => s - proj(p)), band = Math.min(80, s * .5);
      root.style.setProperty('--peel', cssPoly(clip(RECT, p => proj(p) - s)));     // the old edition that is still lying flat
      back.setAttribute('points', svgPts(peeled.map(p => mirror(p, s))));          // its peeled part, folded over: the back of the sheet
      line(flap.querySelector('#pf-back'), on(s), on(2 * s));
      cast.setAttribute('points', svgPts(clip(peeled, p => proj(p) - (s - band)))); // shadow the lifted sheet casts on the new edition
      line(flap.querySelector('#pf-cast'), on(s - band), on(s));
    };
    frame(s0);
    root.classList.add('vt-turn');
    const vt = document.startViewTransition(() => {
      setLang(l);
      curl.classList.add('turning');
      document.body.appendChild(flap);
    });
    vt.ready.then(() => {
      // keeps the transition open for D ms; the fold itself is driven frame by frame
      root.animate({ opacity: [1, 1] }, { duration: D, pseudoElement: '::view-transition-old(root)' });
      const t0 = performance.now();
      const tick = now => {
        const p = Math.min(1, (now - t0) / D);
        frame(s0 + (s1 - s0) * easeTurn(p));
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }).catch(() => {});
    vt.finished.finally(() => {
      root.classList.remove('vt-turn'); root.style.removeProperty('--peel');
      flap.remove(); curl.classList.remove('turning'); switching = false;
    });
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.view) {
      const v = b.dataset.view;
      if (v === view()) return;
      transition('vt-fade', () => setView(v));
      setTimeout(() => {
        const target = v === 'text' ? document.querySelector('#textmode h1') : document.querySelector('#svg-wide .node, #svg-tall .node');
        const visible = v === 'text' ? target : visibleNode('platform');
        if (visible) visible.focus({ preventScroll: true });
      }, 60);
    } else if (b.dataset.themeSet) {
      if (b.dataset.themeSet !== theme()) transition('vt-scan', () => setTheme(b.dataset.themeSet));
    } else if (b.dataset.langSet) {
      switchLang(b.dataset.langSet);
    } else if (b.dataset.motionSet) {
      motionPref = b.dataset.motionSet;
      store.set('jm-motion', motionPref);
      syncMotion();
    }
  });

  /* ================= layout lifecycle ================= */
  const layouts = {};
  function relayout() {
    layouts.wide = build(wideLayout());
    layouts.tall = build(tallLayout());
    if (currentId) {
      document.querySelectorAll(`.node[data-node="${currentId}"]`).forEach(n => n.classList.add('active'));
      document.getElementById('svg-wide').classList.add('focusing');
      if (explodeEl || !isNarrow()) mountExplode(currentId, true); else focusWorld(currentId);
    }
  }
  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!intro) relayout();
      paper.render();
      if (TH.open) { if (isNarrow()) syncRoute(); else layoutTheater(); }
    }, 120);
  });

  new IntersectionObserver(([e]) => mini.classList.toggle('show', !e.isIntersecting && isNarrow()))
    .observe(document.getElementById('titleblock'));

  /* ================= start ================= */
  const savedTheme = store.get('jm-theme');
  setTheme(PRINT ? 'paper' : savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'blueprint' : 'paper'));
  const startText = PRINT || params.get('view') === 'text' || (store.get('jm-view') === 'text' && !META[location.hash.slice(1)]);
  if (startText) document.body.classList.add('is-text');
  renderOverlays();
  const wantPlot = motionOK() && !startText && !isNarrow() && !META[location.hash.slice(1)];
  layouts.wide = build(wideLayout(), { plot: wantPlot });
  layouts.tall = build(tallLayout());
  if (!startText && isNarrow() && motionOK()) document.getElementById('svg-tall').classList.add('fade-in');
  paper.render();
  if (wantPlot && plotQueue) {
    intro = true;
    stageEl.classList.add('intro');
    plot(plotQueue, () => { intro = false; plotQueue = null; stageEl.classList.remove('intro'); syncMotion(); });
  } else syncMotion();
  if (META[location.hash.slice(1)]) setTimeout(syncRoute, 300);
})();
</script>
